[base]
package = ocean
env_name = puffer_cartpole
policy_name = Policy
rnn_name = Recurrent

[policy]
hidden_size = 256

[rnn]
input_size = 1024
hidden_size = 1024

[env]
num_envs = 64
cart_mass = 1.0
pole_mass = 0.1
pole_length = 0.5
gravity = 9.8
force_mag = 10.0
dt = 0.02

[vec]
num_envs = 1

[train]
total_timesteps = 100_000
gamma = 0.95
learning_rate = 0.0025
minibatch_size = 1024
bptt_horizon = 16
update_epochs = 32
ent_coef = 0.01
max_grad_norm = 0.5

[sweep]
method = Protein
metric = score

