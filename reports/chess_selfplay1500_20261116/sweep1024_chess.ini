# Chess hyper sweep (2026-11-18, RTX 5090; score = max(policy, magnet)): 1024x2 (the real-run size; on the NC 5090 it trains at 248K SPS vs 263K
# for 256x2, which leaves the GPU 57% idle; size above 1024 did not help per step: 2048 = 1024 at 1.57B), 200M steps
# per trial, feat2 binary puffer_chess_teach2s. Base = the main2/main3 recipe (chess_teach/bench.sh values) with
# magnet_tau 0.02. Score per trial: final checkpoint (policy) vs top-move Maia 1100, 600 games from the training
# opening bank (resources/chess/fens.txt, 81K positions): win 1, draw .5. Finalists get re-scored with autoscore.sh
# (1000 games, Maia-1900 openings, policy + magnet). Locked: size, replay_ratio 1, total steps, rewards, curriculum.
[base]
env_name = chess
eval_episodes = 0
checkpoint_interval = 0
cudagraphs = 1
profile = 0
reset_every_horizon = 0
async = 1
eval_agents = -1
eval_greedy = 0
enemy_greedy = -1

[selfplay]
enabled = 1
max_size = 500
seed = 42
initial_opponents = None
opp_timeout_steps = 100000000
eval_pool_size = 8
eval_games = 0
eval_bot_games = 600
eval_bots = 4
eval_bot_envs = 32
eval_bot_threads = 8
# Score = max(policy, magnet) of the final checkpoint (2026-11-18, after 14 policy-only trials were rescored).
eval_bot_magnet = 1

[vec]
total_agents = 2048
num_buffers = 2
num_threads = 40
num_policies = 2
hist_policy_percent = 0.0625
hist_policy_hidden_size = 1024
hist_policy_num_layers = 2

[env]
dr = 0
num_agents = 1
num_bots = 0
max_moves = 5000
reward_draw = 0
reward_invalid_piece = 0
reward_invalid_move = 0
reward_repetition = 0
book_reward = 0
book_penalty = 0
perf_book_weight = 0
enable_50_move_rule = 1
enable_threefold_repetition = 1
mode = 1
random_fen = 0
render_fps = 30
fen_curric_pct = 0.9
teacher_pct = 0.3

[bot_eval]
mode = 4
fen_curric_pct = 1
perf_book_weight = 0

[policy]
hidden_size = 1024
num_layers = 2

[train]
gpus = 1
budget = agents
total_timesteps = 200_000_000
learning_rate = 0.00208645
anneal_lr = 1
min_lr_ratio = 0.4
gamma = 0.994711041
gae_lambda = 0.871022522
replay_ratio = 1
clip_coef = 0.489849299
vf_coef = 4.80991316
vf_clip_coef = 1.57298505
reward_clip = 1.0
max_grad_norm = 1.17061818
ent_coef = 0.0058005
anneal_ent_coef = 1
min_ent_coef_ratio = 0.1
magnet_coef = 0.003
magnet_tau = 0.02
anneal_magnet_coef = 0
min_magnet_coef_ratio = 0.1
magnet_reverse = 0
momentum = 0.9164415
minibatch_size = 8192
horizon = 128
vtrace = 0
vtrace_rho_clip = 1.47163081
vtrace_c_clip = 1
verb_eps = 0.0
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
downsample = 1
max_runs = 500
max_suggestion_cost = 3600
prune_pareto = 1
early_stop_quantile = 0
history_path = /workspace/chess_sweep/sweep.history

# Locked dims (inherited from default.ini, min = max).
[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 2e8
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 1024
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 2
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 1
scale = auto

# Swept.
# 4096+ agents do not fit in the 5090 32 GB (cudaMalloc fails at start; trials 3-5 of the first try).
[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 2048
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0005
max = 0.008
scale = auto

[sweep.train.min_lr_ratio]
distribution = log_normal
min = 0.05
max = 1.0
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.03
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = log_normal
min = 0.02
max = 1.0
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.98
max = 0.9995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.7
max = 0.98
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.8
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.5
max = 8.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.2
max = 3.0
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.2
max = 5.0
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.8
max = 0.98
scale = auto

[sweep.train.magnet_coef]
distribution = log_normal
min = 0.0003
max = 0.03
scale = auto

[sweep.train.magnet_tau]
distribution = log_normal
min = 0.003
max = 0.1
scale = auto

[sweep.vec.hist_policy_percent]
distribution = uniform
min = 0.02
max = 0.25
scale = auto

[sweep.env.teacher_pct]
distribution = uniform
min = 0.1
max = 0.5
scale = auto
