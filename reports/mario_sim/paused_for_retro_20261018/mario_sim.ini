# Original full-game training plus FPG practice, sharing the semantic encoder.
# See ocean/mario_sim/FPG.md. Starts follow a real successful ROM route.
# Full-playfield semantic CNN + player/object branches; old RAM weights cannot load.
# Baseline: 10B sweep run 0 (sweep_1792016021935_0000), whose 6.44B weights
# had the strongest evaluated run-0 ROM result. Fresh weights unless loaded explicitly.
[base]
env_name = mario_sim
# Fresh weights and curriculum for training/sweeps; pass a path to resume.
load_model_path = None
# The sweep worker spaces recovery saves by 100M steps and retains final/rung weights.
checkpoint_interval = 1024
eval_episodes = 0
async = 1
cudagraphs = 1
seed = 73
reset_every_horizon = 0

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 12
num_policies = 1

[policy]
architecture = puffernet
hidden_size = 256
num_layers = 2

# One shared semantic policy; modes: game, fpg, mixed.
[env]
mode = mixed
seed = 73
engine_module = build/mario_sim/runtime/cuda_replay.cubin
engine_cpu_archive = build/mario_sim/runtime/logic_cpu.a

# Natural starts, uniform over the original 32 stages. -1 selects all stages;
# 0 starts at 1-1, 31 at 8-4. Clears and life losses continue naturally.
[game]
reset_bank = build/mario_sim/runtime/generated/bank.bin
fixed_stage = -1
max_frames = 108000
terminate_on_clear = 0
clear_reward = 1
# Completion means a finished stage transition or castle victory.
# Set 0 only for the historical flag-contact reward control.
reward_on_exit = 1
# Natural encounter practice is enabled in the standard training mixture.
# Shares count simulation frames; 0.25 plus FPG 0.25 leaves 0.50 ordinary game.
practice_fraction = 0.25
practice_bank = build/mario_sim/practice/bank.bin
practice_max_frames = 6000
practice_replay = 0.2
practice_resume = 1
# Reward each 128 newly traversed rightward pixels (8 tiles).
# Frontiers persist across lives; backtracking and pipe teleports do not pay.
checkpoint_distance = 128
checkpoint_reward = 0.025
time_bonus = 0.1
time_target_frames = 1800
death_penalty = 0

# Fixed actor allocation: fraction of frames in mixed mode, rounded to actors.
[fpg]
fraction = 0.25
reset_bank = build/mario_sim/fpg/curriculum/bank.bin
max_frames = 1800
fixed_stage = 0
world_variants = 1
# All states come from actual ROM gameplay, with no synthetic RAM edits.
generation_knobs = 0
# Each actor advances one band after two qualifying windows of frontier episodes.
# Easier practice does not promote. Sustained low success lowers the frontier.
curriculum = 1
curriculum_adaptive = 1
curriculum_start_frames = 3
curriculum_window = 16
curriculum_confirmations = 2
curriculum_threshold = 0.8
curriculum_replay = 0.2
curriculum_retention = 1
curriculum_demotion_confirmations = 2
curriculum_demotion_threshold = 0.25
# Preserve actor progress in a sidecar with each checkpoint; 0 starts it afresh.
curriculum_resume = 1
# Evaluation is always fixed. 0 uses the checkpoint's median frontier.
curriculum_eval_frames = 0
# Every reset has a verified successful continuation; this table is required.
time_table = build/mario_sim/fpg/curriculum_targets.bin
# Success: 1 + time_bonus * min(1, target / actual_frames)^time_power.
# Failure: 0. Set time_bonus=0 for the sparse-reward comparison.
# target = time_target_scale * estimate + time_slack_frames.
time_bonus = 0.1
time_target_scale = 1.0
time_slack_frames = 8
time_power = 1
time_fallback_speed = 2.5
time_fallback_setup = 24

[train]
total_timesteps = 10000000000
learning_rate = 0.000266737334
anneal_lr = 0
min_lr_ratio = 0.0
gamma = 0.998788059
gae_lambda = 0.975953162
replay_ratio = 1
clip_coef = 0.362240344
vf_coef = 1.18343806
vf_clip_coef = 2.15372181
# Preserve the timing bonus instead of clipping every success back to 1.
reward_clip = 0
max_grad_norm = 0.353460759
ent_coef = 8.06973767e-05
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.941101253
minibatch_size = 1024
horizon = 128
vtrace = 0
vtrace_rho_clip = 3.40632558
vtrace_c_clip = 1.0
gpus = 1

# Native PROTEIN proposals/history, with one canonical trainer and fixed ROM tests.
[sweep]
# Score v2: 50% all-level clear rate + 25% bounded continuing-game progress
# + 25% mean FPG success across all 17 curriculum depths (3 through 425).
# Fixed starts/seeds make early learning comparable before the first level clear.
metric = fixed_eval_score
metric_distribution = linear
goal = maximize
max_runs = 500
# Starting trial only; later trials use the sampled step budget.
trial_timesteps = 500000000
gpus = 1
downsample = 1
live = 0
history_path = logs/mario_sim/sweep_20261017.history
rung_history_path = logs/mario_sim/sweep_20261017.rungs.jsonl
max_suggestion_cost = 14400
max_trial_seconds = 14400
startup_timeout = 600
min_steps_per_second = 150000
speed_check_seconds = 30
# Includes observation copies, semantic encoder caches, graph/context headroom.
memory_limit_mb = 14336
max_train_graph_work = 160000
max_failures = 1000
worker_path = ocean/mario_sim/sweep_worker.py
trainer_path = puffer
# All candidates face the same sampled-action tests and reset seeds.
eval_seed = 137
eval_level_episodes = 4
eval_fpg_episodes = 16
eval_workers = 8
eval_panel_timeout = 300
eval_timeout = 600
# Only stop learning early after >=20 other trials at the same budget AND actors.
# A deficit of >0.10 versus the bottom decile must survive fixed ROM scoring.
prune_min_trials = 20
prune_quantile = 0.1
prune_score_margin = 0.10

[sweep.train.total_timesteps]
distribution = log_normal
min = 200000000
max = 3000000000
scale = time

# Keep 4096 as the control; open the higher-actor configurations up to 32K.
# The VRAM preflight rejects combinations, rather than lowering sampled actors.
[sweep.vec.total_agents]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
scale = auto

# Short horizons allow large actor batches without huge rollout observations.
[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 256
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 32768
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.002
scale = 0.5

[sweep.train.anneal_lr]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0
max = 0.5
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.000001
max = 0.03
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = uniform
min = 0
max = 0.5
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.999
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
