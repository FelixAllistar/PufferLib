# Fresh 1024x2 learner vs eight frozen 64x2 policies; BF16 trainer.
# Isolated experiment. Metamon ranks trials; Oak is disabled.
[base]
env_name = pokemon
seed = 73
async = 0
checkpoint_interval = 0
eval_episodes = 0
# Training samples actions; the external Metamon evaluator uses argmax.
eval_deterministic = 0
# Start a new policy; resuming requires an explicit checkpoint override.
load_model_path = None

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 4
action_mask_size = 168
num_policies = 9
hist_policy_percent = 0.5
hist_policy_hidden_size = 64
hist_policy_num_layers = 2

[selfplay]
enabled = 1
max_size = 16
initial_opponents = /workspace/PufferLib/reports/pokemon_experiments/20261018_capacity1024/opponents.txt
# Frozen banks never rotate or receive learner checkpoint updates.
opp_timeout_steps = 0
eval_pool_size = 0
eval_games = 0

[policy]
hidden_size = 1024
num_layers = 2

[env]
; Fixed catalog sets below; no forced-core or snapshot-reset curriculum.
force_core_combos = 0
; Per-episode probability: 0 = all normal drafts; 1 = all forced cores.
force_core_prob = 0
core_pool = all
core_seed = 76102
; Optional curriculum cursor for weight-only continuation. League rounds carry it.
core_start_assigned = 0
core_start_drafted = 0
; Written by the checkpoint hook; not used as a starting cursor directly.
core_next_assigned = 0
core_next_drafted = 0
core_observation_version = 1
; Snapshot resets are a separate, mutually exclusive option (disabled here).
reset_state_bank = runs/pokemon_states_20260913/states.pks
reset_state_prob = 0
reset_observation_version = 1
; Optional capped event objectives; zero leaves win-only/default behavior intact.
behavior_sleep = 0
behavior_paralysis = 0
# Opponent mixture: fraction of concurrent environments facing frozen experts.
# Remaining environments play the current learner against itself.
expert_fraction = 0.5
# Eight frozen opponents selected from the focused Metamon comparison.
# Fixed ABI-3 roster format: ocean/pokemon/README.md, Fixed named opponents.
# Historical ocean/pokemon/experts_three.ini uses incompatible checkpoints.
native_league = /workspace/PufferLib/reports/pokemon_experiments/20261018_capacity1024/opponents.ini
seed = 42
generation = 1
abi_version = 3
policy_version = 3
rules_sha = None
# 0: Gen 1 OU species and fully validated individual move choices.
format = 0
# 0: random legal construction; 1: private species then individual move drafting.
team_selection = 1
# Includes forced-switch decisions. Reaching the cap adjudicates a draw.
max_updates = 512
# Zero-sum terminal win/loss magnitude; draws remain zero.
reward_win = 1
# Optional discounted potential shaping (defaults off). Normalized team HP
# advantage and fainted-opponent advantage, each in [-1,1].
reward_hp_scale = 0
reward_ko_scale = 0
# Species-blind, terminal-zero potential weights. Total absolute weight <= 1.
# Native ./puffer only. See ocean/pokemon/QD.md; defaults preserve old behavior.
personality_paralysis = 0
personality_sleep = 0
personality_offense = 0
personality_defense = 0
personality_reserve = 0
# Synchronized to train.gamma by the native Pokemon configuration hook.
reward_gamma = 0.999899983
# Sample exact completed teams: first episode and every N episodes per env.
# Metrics always report learner team/lead frequencies. 0 disables JSONL.
team_log_interval = 0
team_log_path = logs/pokemon/teams.jsonl
# Hard append cap; existing oversized files are left untouched.
team_log_max_bytes = 8388608
# Exact fixed catalog sets: Starmie / Exeggutor / Rhydon / Chansey / Snorlax / Tauros.
# Current-policy self-play mirrors this team; frozen banks use their bound teams.
learner_team = 421,366,389,395,512,445
opponent_team = 421,366,389,395,512,445
learner_lead = 121
opponent_lead = 121

[train]
# PPO starting point inherited from the small-policy experiment, but lower LR.
# Steps count all agent slots; at expert_fraction=.5, 75% are learner slots.
total_timesteps = 1000000000
horizon = 32
minibatch_size = 2048
learning_rate = 0.0003
gamma = 0.999899983
gae_lambda = 0.899999976
ent_coef = 0.020000007
anneal_lr = 1
min_lr_ratio = 0.1
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
replay_ratio = 3.71047497
clip_coef = 0.12561436
vf_coef = 0.52888006
vf_clip_coef = 0.2
max_grad_norm = 0.338345766
# Keep shaping unclipped to preserve its telescoping potential difference.
reward_clip = 0

[league]
mode = matrix
games = 256
policy_manifest = None
output = None

[sweep]
live = 1
gpus = 1
max_runs = 500
history_path = /workspace/PufferLib/reports/pokemon_experiments/20261018_capacity1024/capacity.history
metric = metamon_score
worker_path = /workspace/PufferLib/ocean/pokemon/benchmarks/sweep_metamon.py
trainer_path = /workspace/PufferLib/puffer
eval_python = /workspace/PufferLib/build/pokemon/metamon-eval-env-cu128/bin/python
eval_games = 8
eval_seed = 20261025
eval_timeout = 3600
goal = maximize
downsample = 1
# Record divergent trials as failures and continue; stop after 32 failures.
max_failures = 32
max_suggestion_cost = 86400

# Broad fresh-training sweep; architecture held fixed to test added capacity.
[sweep.train.total_timesteps]
min = 500000000
max = 2000000000

[sweep.policy.hidden_size]
min = 1024
max = 1024

[sweep.policy.num_layers]
min = 2
max = 2

[sweep.vec.total_agents]
min = 2048
max = 4096

[sweep.train.horizon]
min = 16
max = 64

[sweep.train.minibatch_size]
min = 1024
max = 4096

[sweep.train.learning_rate]
min = 0.00001
max = 0.003

[sweep.train.ent_coef]
min = 0.00001
max = 0.05

[sweep.train.gamma]
min = 0.95
max = 0.9999

[sweep.train.gae_lambda]
min = 0.8
max = 0.995

[sweep.train.replay_ratio]
min = 1
max = 8

[sweep.train.clip_coef]
min = 0.05
max = 0.4

[sweep.train.vf_coef]
min = 0.1
max = 2

[sweep.train.vf_clip_coef]
min = 0.05
max = 1

[sweep.train.max_grad_norm]
min = 0.1
max = 2

[sweep.train.momentum]
min = 0.8
max = 0.99

# Oak stays disabled; the external worker supplies the Metamon objective.
[oak]
enabled = 0
python = build/pokemon/oak-benchmark-env/bin/python
games = 128
budget = 4096
workers = 6
seed = 20261015

# Keep LR annealing enabled, vary its floor.
[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.01
max = 0.5
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = uniform
min = 0
max = 0.5
scale = auto

[sweep.env.expert_fraction]
distribution = uniform
min = 0.25
max = 0.75
step = 0.25
scale = auto

[sweep.train.vtrace]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.5
max = 2
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.5
max = 1
scale = auto
