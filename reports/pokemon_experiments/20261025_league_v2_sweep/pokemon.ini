# LeagueV2 sweep (2026-10-25): OMNI-1024 2B continued for 100M steps per trial on the 13 league teams
# (env.learner_team_pool), 25% of games vs LeagueV2 (frozen OMNI-1024 2B piloting each team) and 75% self-play.
# Metric: vs_league_score, the learner's win rate over all LeagueV2 games in the last log interval (>0.5 means it
# beats its frozen start). Metamon TaurosV0 (144 games on gar_egg_zap, batched) is logged as a held-out monitor only.
# Swept: LR and its anneal floor, entropy (down to ~0) and its anneal floor, magnet, replay. Built from OMNI-1024's
# saved config.ini (notes: reports/pokemon_experiments/20261023_next/README.md).

