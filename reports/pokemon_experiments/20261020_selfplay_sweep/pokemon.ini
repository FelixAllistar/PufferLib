# Self-play Metamon sweep: low entropy, magnet KL, encoder widths, 50M–1B steps.
# Opponents: current-policy self-play plus the 13 round-26 league peers (256x2).
# Final-only Metamon score (48 games/team, 144 total) ranks trials.
[base]
env_name = pokemon
seed = 73
async = 0
checkpoint_interval = 0
checkpoint_dir = reports/pokemon_experiments/20261020_selfplay_sweep/checkpoints
log_dir = reports/pokemon_experiments/20261020_selfplay_sweep/logs
eval_episodes = 0
# Evaluation action selection is unchanged from the winning trial.
eval_deterministic = 0
# Start a new policy; resuming requires an explicit checkpoint override.
load_model_path = None

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 4
action_mask_size = 168
num_policies = 15
hist_policy_percent = 0.5
hist_policy_hidden_size = 64
hist_policy_num_layers = 2

[selfplay]
enabled = 1
max_size = 16
initial_opponents = saved/pokemon/starmie_sweep/opponents.txt
# Frozen banks never rotate or receive learner checkpoint updates.
opp_timeout_steps = 0
eval_pool_size = 0
eval_games = 0

[policy]
hidden_size = 256
num_layers = 2
; Per-Pokemon embedding width and entity-MLP width of the semantic encoder.
pokemon_embed = 32
pokemon_mid = 64

[env]
; Fixed catalog sets below; no forced-core or snapshot-reset curriculum.
force_core_combos = 0
; Per-episode probability: 0 = all normal drafts; 1 = all forced cores.
force_core_prob = 0
core_pool = all
core_seed = 76102
; Optional curriculum cursor for weight-only continuation. League rounds carry it.
core_start_assigned = 0
core_start_drafted = 0
; Written by the checkpoint hook; not used as a starting cursor directly.
core_next_assigned = 0
core_next_drafted = 0
core_observation_version = 1
; Snapshot resets are a separate, mutually exclusive option (disabled here).
reset_state_bank = runs/pokemon_states_20260913/states.pks
reset_state_prob = 0
reset_observation_version = 1
; Optional capped event objectives; zero leaves win-only/default behavior intact.
behavior_sleep = 0
behavior_paralysis = 0
# Opponent mixture: fraction of concurrent environments facing frozen experts.
# Remaining environments play the current learner against itself.
# Forced to 0 when pokemon_embed/pokemon_mid differ from the banks' 32/64.
expert_fraction = 0.25
# Round-26 peers of the 20M round-robin league (13 banks, 256x2).
# Fixed ABI-3 roster format: ocean/pokemon/README.md, Fixed named opponents.
# Historical ocean/pokemon/experts_three.ini uses incompatible checkpoints.
native_league = leagues/pokemon/rr20m_256x2_20261020/rounds/r000026/master-opponents.ini
seed = 42
generation = 1
abi_version = 3
policy_version = 3
rules_sha = None
# 0: Gen 1 OU species and fully validated individual move choices.
format = 0
# 0: random legal construction; 1: private species then individual move drafting.
team_selection = 1
# Includes forced-switch decisions. Reaching the cap adjudicates a draw.
max_updates = 512
# Zero-sum terminal win/loss magnitude; draws remain zero.
reward_win = 1
# Optional discounted potential shaping (defaults off). Normalized team HP
# advantage and fainted-opponent advantage, each in [-1,1].
reward_hp_scale = 0
reward_ko_scale = 0
# Species-blind, terminal-zero potential weights. Total absolute weight <= 1.
# Native ./puffer only. See ocean/pokemon/QD.md; defaults preserve old behavior.
personality_paralysis = 0
personality_sleep = 0
personality_offense = 0
personality_defense = 0
personality_reserve = 0
# Synchronized to train.gamma by the native Pokemon configuration hook.
reward_gamma = 0.999899983
# Sample exact completed teams: first episode and every N episodes per env.
# Metrics always report learner team/lead frequencies. 0 disables JSONL.
team_log_interval = 0
team_log_path = logs/pokemon/teams.jsonl
# Hard append cap; existing oversized files are left untouched.
team_log_max_bytes = 8388608
# Exact fixed catalog sets: Starmie / Exeggutor / Rhydon / Chansey / Snorlax / Tauros.
# Current-policy self-play mirrors this team; frozen banks use their bound teams.
learner_team = 421,366,389,395,512,445
opponent_team = 421,366,389,395,512,445
learner_lead = 121
opponent_lead = 121

[train]
# Fresh 200M-step starting trial; subsequent trials range 50M–1B.
# Counted agent steps include frozen slots; expert_fraction=.5 gives 75% learner slots.
total_timesteps = 200000000
horizon = 32
minibatch_size = 4096
learning_rate = 0.0005
gamma = 0.999899983
gae_lambda = 0.899999976
ent_coef = 0.001
anneal_lr = 1
min_lr_ratio = 0.1
anneal_ent_coef = 1
min_ent_coef_ratio = 0.1
# Magnet KL (EMAgnet): pull toward an EMA of the learner's own weights.
magnet_coef = 0.1
magnet_tau = 0.01
magnet_reverse = 0
anneal_magnet_coef = 0
min_magnet_coef_ratio = 0.1
replay_ratio = 2
clip_coef = 0.12561436
vf_coef = 0.52888006
vf_clip_coef = 0.2
max_grad_norm = 0.338345766
# Keep shaping unclipped to preserve its telescoping potential difference.
reward_clip = 0

[league]
mode = matrix
games = 256
policy_manifest = None
output = None
[sweep]
live = 1
gpus = 1
max_runs = 500
history_path = reports/pokemon_experiments/20261020_selfplay_sweep/sweep.history
metric = metamon_score
goal = maximize
downsample = 1
max_failures = 8
max_suggestion_cost = 21600

# Native trainer, fresh history: no external sweep worker.
# 32 varying dimensions. Team/rules/benchmark remain fixed for comparison.
# Expert fractions use a discrete grid so all learner minibatch layouts divide.

[sweep.train.total_timesteps]
distribution = log_normal
min = 50000000
max = 1000000000
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.policy.pokemon_embed]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.policy.pokemon_mid]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 4096
max = 16384
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 8192
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.003
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.003
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 6
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.4
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.1
max = 2
scale = auto

[sweep.train.vf_clip_coef]
distribution = log_normal
min = 0.05
max = 1
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.25
max = 3
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.8
max = 0.99
scale = auto

[sweep.train.min_lr_ratio]
distribution = log_normal
min = 0.01
max = 0.5
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = log_normal
min = 0.01
max = 1
scale = auto

[sweep.train.vtrace]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1
max = 2
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.5
max = 1
scale = auto

[sweep.train.magnet_coef]
distribution = log_normal
min = 0.01
max = 10
scale = auto

[sweep.train.magnet_tau]
distribution = log_normal
min = 0.00001
max = 0.1
scale = auto

[sweep.train.magnet_reverse]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.anneal_magnet_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_magnet_coef_ratio]
distribution = log_normal
min = 0.01
max = 1
scale = auto

[sweep.env.expert_fraction]
distribution = uniform
min = 0
max = 1
scale = auto
step = 0.25

[sweep.env.reward_hp_scale]
distribution = uniform
min = 0
max = 0.5
scale = auto
step = 0.25

[sweep.env.reward_ko_scale]
distribution = uniform
min = 0
max = 0.5
scale = auto
step = 0.25

# Metamon (TaurosV0, private-information v2 evaluator) at the final checkpoint only:
# interval_fraction = 1 skips interim checks. 48 games per opponent team = 144 total.
[metamon]
enabled = 1
interval_fraction = 1
games = 2
final_games = 48
min_free_gb = 2
python = build/pokemon/metamon-eval-env-cu128/bin/python
device = cuda
seed = 20261025
timeout = 3600

# Legacy perfect-information Oak benchmark, opt-in only. Metamon takes precedence.
[oak]
enabled = 0
python = build/pokemon/oak-benchmark-env/bin/python
games = 128
budget = 4096
workers = 6
seed = 20261015
