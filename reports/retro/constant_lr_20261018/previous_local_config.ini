[base]
env_name = retro
async = 1
# Pixel/ROM continuation sweep restored 2026-10-18.
# Every trial independently loads the same preserved 838.9M parent weights.
# Optimizer, step counter, recurrent state and schedules start fresh per trial.
load_model_path = saved/retro/vast_838m.bin
checkpoint_dir = checkpoints/retro_pixel_20261018
log_dir = logs/retro_pixel_20261018
# Keep one final checkpoint and its fixed-panel report per trial.
checkpoint_interval = 0
eval_episodes = 0
cudagraphs = 1


[vec]
total_agents = 1024
num_buffers = 4
num_threads = 12

[policy]
architecture = puffernet
num_layers = 2
hidden_size = 256

[env]
practice_replay = None
# Verified World/NTSC ROM on the NTSC core. RTA = native frames / 60.0988139.
# Existing PAL-trained weights can warm-start; old timing results do not compare.
# Hold each action for four native frames; every frame is still emulated.
frameskip = 4
full_render = 0
idle_loop_skip = 1
# Native frames, NOT decisions: 30000 allows about 8m 19s at any frameskip.
max_frames = 30000
# Level transitions and castle completion pay once per source level/episode.
# The ROM continues naturally through flags, pipes, vines and wrong warps.
completion_reward = 2
# Pay on the SAME black-screen split shown by the viewer/dashboard.
# Completion speed shaping is disabled for exploration.
completion_on_rta_split = 1
completion_on_next_playable = 0
completion_time_bonus = 0
completion_time_min_frames = 0
completion_time_max_frames = 1800
# Once per 1-1 route segment: reset -> underground playable, then underground
# playable -> overworld playable. Extra = pipe_segment_bonus * clamp(1 - segment_frames/600,0,1).
# Already learned this route: do not pay early partial progress in this round.
pipe_segment_bonus = 0
pipe_segment_frames = 600
# Small penalty for failed attempts.
death_penalty = 0.05
checkpoint_distance = 128
checkpoint_reward = 0.125
score_scale = 0.0001
# All explicit reward components share reward_scale; no potential shaping.
# Idle penalties are per decision after idle_grace_decisions.
coin_reward = 0
idle_penalty = 0
idle_grace_decisions = 8
# Once per new playable destination within a level per episode, without timing.
# Starting areas/revisits do not pay. novel_areas logs the rewarded event count.
# Raw 1 = 0.0625 after reward_scale (eight checkpoint rewards).
novel_area_reward = 1
# Obsolete completion HUD TIME extra stays disabled.
completion_time_target_bonus = 0
# Episode-local checkpoint frontiers prevent repeat farming.
reward_scale = 0.0625
# All 32 starts are built and validated once; CSV/single levels also work.
spawn_levels = all
# Keep playing through level clears; deaths use the ROM's own midpoint
# checkpoint and remaining lives. Episode ends on game over, final win or cap.
# The fixed evaluation panel measures first source-level clears separately.
terminate_on_clear = 0
backend = quicknes
# Compiled ROM CPU with full-screen rendering.
cpu_backend = blocks
render_backend = wide
rom_path = ocean/retro/roms/smb1_ntsc.nes

[train]
# Ordinary training keeps the old budget; sweep budgets are configured below.
total_timesteps = 838860800
reward_clip = 0
# Original parent-run PPO defaults. Sweep trial zero uses these at 30M decisions.
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.9999
gae_lambda = 0.997
replay_ratio = 2
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0
anneal_ent_coef = 1
min_ent_coef_ratio = 0.1
momentum = 0.9
minibatch_size = 4096
horizon = 256
vtrace = 0
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0

# Fixed independent evaluation: 8 attempts per original level, natural lives,
# 30,000 native frames per attempt, and the first source-level clear as terminal.
# Objective = mean novel 128-pixel progress checkpoints, with revisits excluded.
# Reward weights never enter this score. Per-level clears are also retained.
# 500 successful trials; each adds 10M-100M decisions to the SAME parent.
# 32K actors are available only when the full pixel buffers fit in VRAM.
# Invalid layouts/large graphs are rejected before spawning the trainer.
# The worker also measures resident memory, startup, throughput and runtime.
# The model and 64x60 pixel contract stay fixed to match the parent checkpoint.
[panel]
levels = all
repeats = 8
seed = 20260907
frames = 30000
frameskip = 4
workers = 12

[sweep]
metric = checkpoints
metric_distribution = linear
goal = maximize
max_runs = 500
gpus = 1
downsample = 1
max_suggestion_cost = 3600
prune_pareto = 1
early_stop_quantile = 0.3
live = 0
history_path = logs/retro_pixel_20261018/sweep_20261018.history
trial_timesteps = 30000000
worker_path = ocean/retro/sweep_worker.py
trainer_path = puffer
max_failures = 1000
max_trial_seconds = 3600
startup_timeout = 600
eval_timeout = 900
min_steps_per_second = 5000
speed_check_seconds = 30
memory_limit_mb = 15360
max_train_graph_work = 80000

