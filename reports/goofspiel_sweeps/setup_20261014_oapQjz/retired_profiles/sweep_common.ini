# Shared PPO/Muon search for both architectures. No EMAg or priority-replay keys.
# Loaded by sweep.sh after default.ini + goofspiel.ini, before runtime/model files.
# Runtime and model-size ranges are in sweep_runtime.ini. Game rules, opponent
# setup and the agent-step budget stay fixed for a comparable objective.

[base]
async = 1
cudagraphs = 1
eval_episodes = 0
load_model_path = None
load_enemy_model_path = None

[selfplay]
enabled = 1
initial_opponents = None
eval_games = 0
eval_bot_games = 0

[env]
# Evaluate exact best responses, but do not train against response-table actions.
exact_exploiter = 0

[train]
# Keep schedules fixed for this first search; tune the ordinary default knobs.
anneal_lr = 1
min_lr_ratio = 0
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
vtrace = 0
gpus = 1

[sweep]
metric = best_exploitability
metric_distribution = linear
goal = minimize
max_runs = 32
gpus = 1
downsample = 1
max_failures = 4
# Suggestion-cost model setting, NOT a hard timeout or a wall-clock budget.
max_suggestion_cost = 600

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.05
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
# Unlike the old Goofspiel range, include the low lambdas used in NMMO/Nethack.
# 0.999 also retains Goofspiel's previous 0.998220325 starting value.
distribution = logit_normal
min = 0.2
max = 0.999
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.02
max = 0.9
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 4
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 1.5
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto
