# Runtime/model search, shared by both models. Values below are the first trial;
# ranges below are searched together with PPO. Invalid coupled shapes are
# skipped before launching a training worker, not silently repaired.

[vec]
total_agents = 8192
num_buffers = 1
num_threads = 4
num_policies = 5
hist_policy_percent = 0.5

[policy]
hidden_size = 32
num_layers = 2
transformer_heads = 2

[train]
# 2^23 agent steps per trial. This is a tuning budget, not a convergence claim.
total_timesteps = 8_388_608
minibatch_size = 4096
horizon = 8
replay_ratio = 4

[selfplay]
opp_timeout_steps = 1_000_000

# --checkpoints=N sets an agent-step cadence that is recomputed for every
# sampled agents/horizon combination. Explicit epoch intervals remain available.

[sweep.vec.total_agents]
min = 256
max = 16384

[sweep.vec.num_buffers]
min = 1
max = 4

[sweep.vec.num_threads]
min = 1
max = 4

[sweep.train.horizon]
min = 8
max = 32

[sweep.train.minibatch_size]
min = 256
max = 8192

[sweep.train.replay_ratio]
min = 1
max = 8

[sweep.policy.hidden_size]
min = 16
max = 128

[sweep.policy.num_layers]
min = 1
max = 4
