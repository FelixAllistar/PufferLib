# Optional launcher overlay. Search ranges live in config/mario_sim.ini so
# ./puffer sweep and sweep.py use the same 17-dimensional search.
[base]
load_model_path = None
checkpoint_interval = 0
eval_episodes = 0

[env]
mode = mixed

[fpg]
curriculum_resume = 0

[train]
total_timesteps = 30000000
anneal_lr = 0
anneal_ent_coef = 0

[sweep]
max_runs = 128

[sweep.train.total_timesteps]
distribution = log_normal
min = 30000000
max = 30000000
scale = time
