# FPG curriculum: start very close, then move backward after sustained success.
# See ocean/mario_fpg_time/README.md. Starts follow a real successful ROM route.
# Full-playfield semantic CNN + player/object branches; old RAM weights cannot load.
[base]
env_name = mario_fpg_time
# Continue the completed semantic run, including its saved actor frontiers.
# Override with --base.load_model_path=None for a fresh run.
load_model_path = checkpoints/mario_fpg_time/1791497853012/0000000268435456.bin
checkpoint_interval = 64
eval_episodes = 0
async = 0
cudagraphs = 0
seed = 73
reset_every_horizon = 0

[vec]
total_agents = 4096
num_buffers = 1
num_threads = 4
num_policies = 1

[policy]
hidden_size = 64
num_layers = 2

[env]
reset_bank = build/mario_fpg_time/curriculum/bank.bin
engine_module = build/mario_sim/runtime/cuda_replay.cubin
engine_cpu_archive = build/mario_sim/runtime/logic_cpu.a
max_frames = 1800
seed = 73
fixed_stage = 0
world_variants = 1
# All states come from actual ROM gameplay, with no synthetic RAM edits.
generation_knobs = 0
# Each actor advances one band after two qualifying windows of frontier episodes.
# Easier practice episodes do not count toward promotion. Failure stays put.
curriculum = 1
curriculum_adaptive = 1
curriculum_start_frames = 3
curriculum_window = 16
curriculum_confirmations = 2
curriculum_threshold = 0.8
curriculum_replay = 0.2
# Preserve actor progress in a sidecar with each checkpoint; 0 starts it afresh.
curriculum_resume = 1
# Evaluation is always fixed. 0 uses the checkpoint's median frontier.
curriculum_eval_frames = 0
# Every reset has a verified successful continuation; this table is required.
time_table = build/mario_fpg_time/curriculum_targets.bin
# Success: 1 + time_bonus * min(1, target / actual_frames)^time_power.
# Failure: 0. Set time_bonus=0 for the sparse-reward comparison.
# target = time_target_scale * estimate + time_slack_frames.
time_bonus = 0.1
time_target_scale = 1.0
time_slack_frames = 8
time_power = 1
time_fallback_speed = 2.5
time_fallback_setup = 24

[train]
total_timesteps = 268435456
learning_rate = 0.001
anneal_lr = 0
gamma = 0.995
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
# Preserve the timing bonus instead of clipping every success back to 1.
reward_clip = 0
max_grad_norm = 1
ent_coef = 0.01
anneal_ent_coef = 0
momentum = 0.9
minibatch_size = 4096
horizon = 32
gpus = 1

[sweep]
# Rank progress into harder starts; raw success rates span different difficulties.
metric = curriculum_frames
# Broad sweep: python3 ocean/mario_fpg_time/sweep.py
# Its overlay starts fresh, bounds inherited ranges, and scores a fixed ROM panel.
# Native CLI overrides require keys/sections to be declared here first.
worker_path = None
max_failures = 3
trainer_path = build/mario_fpg_time/puffer
evaluator_path = build/mario_fpg_time/sim2rom
eval_bank = build/mario_fpg_time/curriculum
eval_depths = 3,8,16,32,64,80,96,128,192,256,320,425
eval_episodes = 16
eval_seed = 137
eval_max_frames = 1800

[sweep.env.time_bonus]
distribution = uniform
min = 0
max = 2
scale = auto

[sweep.env.time_target_scale]
distribution = log_normal
min = 0.5
max = 2
scale = auto

[sweep.env.time_slack_frames]
distribution = uniform
min = 0
max = 60
scale = auto

[sweep.env.time_power]
distribution = log_normal
min = 0.25
max = 4
scale = auto

# The broad-sweep overlay expands these otherwise fixed dimensions.
[sweep.train.anneal_lr]
distribution = int_uniform
min = 0
max = 0
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0
max = 0
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 0
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = uniform
min = 0.1
max = 0.1
scale = auto

[sweep.env.curriculum_window]
distribution = uniform_pow2
min = 16
max = 16
scale = auto

[sweep.env.curriculum_confirmations]
distribution = int_uniform
min = 2
max = 2
scale = auto

[sweep.env.curriculum_threshold]
distribution = uniform
min = 0.8
max = 0.8
scale = auto

[sweep.env.curriculum_replay]
distribution = uniform
min = 0.2
max = 0.2
scale = auto
