[base]
env_name = mario_sim
load_model_path = None
checkpoint_interval = 64
eval_episodes = 0
async = 0
cudagraphs = 1
seed = 73
reset_every_horizon = 0

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 4
num_policies = 1

[policy]
hidden_size = 64
num_layers = 2

[env]
reset_bank = build/mario_sim/runtime/generated/bank.bin
engine_module = build/mario_sim/runtime/cuda_replay.cubin
# 0 free play, 1 flagpole glitch, 2 level completion.
task = 1
max_frames = 240
seed = 73
fixed_stage = -1
world_variants = 16
# Reset variation: 1 clock, 2 subpixels, 4 actors, 8 player form.
generation_knobs = 3

[train]
total_timesteps = 1048576
learning_rate = 0.001
anneal_lr = 0
gamma = 0.995
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
reward_clip = 0
max_grad_norm = 1
ent_coef = 0.01
anneal_ent_coef = 0
momentum = 0.9
minibatch_size = 4096
horizon = 32
gpus = 1

[sweep]
metric = perf
