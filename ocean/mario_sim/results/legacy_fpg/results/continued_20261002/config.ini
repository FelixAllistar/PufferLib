[base]
env_name = mario_fpg
# Continue the tested 67.1m policy. Set None only for a fresh experiment.
# Loading retains learned weights; optimizer and sampler estimates restart.
load_model_path = checkpoints/mario_fpg/1790957064845/0000000067108864.bin
checkpoint_dir = checkpoints
log_dir = logs
checkpoint_interval = 64
eval_episodes = 0
async = 0
cudagraphs = 1
seed = 73
reset_every_horizon = 0

[vec]
total_agents = 256
num_buffers = 1
num_threads = 4
num_policies = 1

[policy]
hidden_size = 64
num_layers = 2

[env]
reset_bank = ocean/mario_fpg/data/reset_bank.bin
max_frames = 240
seed = 73
# 0 training, 1 validation, 2 held-out procedural seed bank.
split = 0
# 40% uniform retention, 60% earliest weak stage. Reconsidered every episode.
adaptive = 1
# -1 adaptive mix; 0 contact, 1 approach, 2 jump, 3 whole stair setup.
fixed_tier = -1
# Random subpixel/acceleration phases, accepted only if the suffix still works.
augment = 1
# Exactly one frame per decision. Success +1; everything else 0. No shaping.

[train]
# Additional frames after loading: 67,108,864 + 268,435,456 = 335,544,320.
total_timesteps = 268435456
learning_rate = 0.001
anneal_lr = 0
gamma = 0.995
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
reward_clip = 0
max_grad_norm = 1
ent_coef = 0.01
anneal_ent_coef = 0
momentum = 0.9
minibatch_size = 4096
horizon = 128
gpus = 1

[sweep]
metric = perf
