# Optional launcher overlay. Search ranges live in config/mario_sim.ini so
# ./puffer sweep and sweep.py use the same 15-dimensional search.
[base]
load_model_path = None
checkpoint_interval = 1024
eval_episodes = 0

[env]
mode = mixed

[fpg]
curriculum_resume = 0

[train]
total_timesteps = 2000000000

[sweep]
max_runs = 128

[sweep.train.total_timesteps]
distribution = log_normal
min = 2000000000
max = 2000000000
scale = time
