# Overlay for sweep.py. Every trial starts with new weights and a new curriculum.
# The normal training config continues the existing semantic checkpoint.
[base]
load_model_path = None
checkpoint_interval = 0
eval_episodes = 0
seed = 73

[vec]
total_agents = 2048

[env]
mode = fpg

[fpg]
curriculum_resume = 0

[train]
horizon = 32
gamma = 0.995
total_timesteps = 67108864

[sweep]
max_runs = 128
gpus = 1
downsample = 1
max_failures = 3
# Suggestion cost is a search preference, not a wall-clock kill timer.
max_suggestion_cost = 2400
early_stop_quantile = 0.3
metric = curriculum_frames
metric_distribution = linear
goal = maximize
# The worker returns fixed-panel FPG rate; curriculum_frames is a training log.
eval_depths = 3,8,16,32,64,80,96,128,192,256,320,425
eval_episodes = 16
eval_seed = 137
eval_max_frames = 1800
trainer_path = build/mario_sim/puffer
evaluator_path = build/mario_sim/fpg/sim2rom
eval_bank = build/mario_sim/fpg/curriculum

# Equal training budgets. sweep.py --steps changes all three values together.
[sweep.train.total_timesteps]
distribution = log_normal
min = 67108864
max = 67108864
scale = time

# Bound the largest model and rollout for the local 3GB card.
[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 512
max = 2048
scale = auto

# All combinations satisfy the trainer's divisibility constraints.
[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 64
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 512
max = 4096
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00003
max = 0.003
scale = auto

[sweep.train.anneal_lr]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0
max = 0.3
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.04
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.97
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.99
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 3
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.3
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 1
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.1
max = 1.5
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.25
max = 2
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.8
max = 0.99
scale = auto

[sweep.fpg.time_bonus]
distribution = uniform
min = 0
max = 0.3
scale = auto

[sweep.fpg.time_target_scale]
distribution = log_normal
min = 0.5
max = 1.5
scale = auto

[sweep.fpg.time_slack_frames]
distribution = int_uniform
min = 0
max = 16
scale = auto

[sweep.fpg.time_power]
distribution = log_normal
min = 0.5
max = 2
scale = auto

[sweep.fpg.curriculum_window]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.fpg.curriculum_confirmations]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.fpg.curriculum_threshold]
distribution = uniform
min = 0.65
max = 0.9
scale = auto

[sweep.fpg.curriculum_replay]
distribution = uniform
min = 0
max = 0.4
scale = auto
