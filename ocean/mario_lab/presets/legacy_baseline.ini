[base]
env_name = mario_lab
load_model_path = None
checkpoint_dir = checkpoints/mario_lab_experiments
log_dir = logs/mario_lab
checkpoint_interval = 50
eval_episodes = 0
async = 0
cudagraphs = 1
seed = 73

[vec]
total_agents = 1024
num_buffers = 1
num_threads = 4
num_policies = 1

[policy]
# First baseline: semantic grid/entity/ego inputs -> MLP -> MinGRU.
hidden_size = 128
num_layers = 2

[env]
physics_mode = 0
walk_accel = 10
brake_accel = 32
player_width = 12
player_height = 16
jump_fast_speed = 1280
jump_fast_threshold = 512
gravity_fast_hold = 40
gravity_fast_release = 144
pipe_min_height = 0
pipe_max_height = 0
stair_height = 0
# 0 mixed, 1 flat, 2 gaps, 3 pipes, 4 stairs, 5 walkers, 6 underground, 7 composite.
course = 0
difficulty = 1
length = 96
max_frames = 2400
require_pipe = 0
seed = 73
# 0 training, 1 validation, 2 held-out test; independent procedural seed streams.
split = 0
completion_reward = 10
death_penalty = 1
speed_bonus = 2
# Optional episode-local frontier shaping. This is not potential-based shaping.
progress_reward = 0.001
# Optional authored practice starts; a miss always uses the full root course.
practice_prob = 0
practice_gap = 1
practice_entry = 1
practice_exit = 1
practice_route = 1
practice_frames = 600
# 0 keeps the original finish line after a practice reset; 1 uses local goals.
practice_short_goals = 1
# Full root-course mixture when course=0. Equal weights preserve uniform sampling.
mix_flat = 1
mix_gaps = 1
mix_pipes = 1
mix_stairs = 1
mix_walkers = 1
mix_underground = 1
mix_composite = 1

[train]
total_timesteps = 10000000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.997
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
reward_clip = 0
max_grad_norm = 1
ent_coef = 0.01
anneal_ent_coef = 0
momentum = 0.9
minibatch_size = 4096
horizon = 64
gpus = 1

[sweep]
metric = perf
