# FPG curriculum: start very close, then move backward after sustained success.
# See ocean/mario_fpg_time/README.md. Starts follow a real successful ROM route.
[base]
env_name = mario_fpg_time
load_model_path = None
checkpoint_interval = 64
eval_episodes = 0
async = 0
cudagraphs = 1
seed = 73
reset_every_horizon = 0

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 4
num_policies = 1

[policy]
hidden_size = 64
num_layers = 2

[env]
reset_bank = build/mario_fpg_time/curriculum/bank.bin
engine_module = build/mario_sim/runtime/cuda_replay.cubin
engine_cpu_archive = build/mario_sim/runtime/logic_cpu.a
max_frames = 1800
seed = 73
fixed_stage = 0
world_variants = 1
# All states come from actual ROM gameplay, with no synthetic RAM edits.
generation_knobs = 0
# Each actor advances one band after two qualifying windows of frontier episodes.
# Easier practice episodes do not count toward promotion. Failure stays put.
curriculum = 1
curriculum_adaptive = 1
curriculum_start_frames = 3
curriculum_window = 16
curriculum_confirmations = 2
curriculum_threshold = 0.8
curriculum_replay = 0.2
# Preserve actor progress in a sidecar with each checkpoint; 0 starts it afresh.
curriculum_resume = 1
# Evaluation is always fixed. 0 uses the checkpoint's median frontier.
curriculum_eval_frames = 0
# Every reset has a verified successful continuation; this table is required.
time_table = build/mario_fpg_time/curriculum_targets.bin
# Success: 1 + time_bonus * min(1, target / actual_frames)^time_power.
# Failure: 0. Set time_bonus=0 for the sparse-reward comparison.
# target = time_target_scale * estimate + time_slack_frames.
time_bonus = 0.5
time_target_scale = 1.0
time_slack_frames = 8
time_power = 1.0
time_fallback_speed = 2.5
time_fallback_setup = 24

[train]
total_timesteps = 268435456
learning_rate = 0.001
anneal_lr = 0
gamma = 0.995
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
# Preserve the timing bonus instead of clipping every success back to 1.
reward_clip = 0
max_grad_norm = 1
ent_coef = 0.01
anneal_ent_coef = 0
momentum = 0.9
minibatch_size = 4096
horizon = 32
gpus = 1

[sweep]
# Rank progress into harder starts; raw success rates span different difficulties.
metric = curriculum_frames

[sweep.env.time_bonus]
distribution = uniform
min = 0
max = 2
scale = auto

[sweep.env.time_target_scale]
distribution = log_normal
min = 0.5
max = 2
scale = auto

[sweep.env.time_slack_frames]
distribution = uniform
min = 0
max = 60
scale = auto

[sweep.env.time_power]
distribution = log_normal
min = 0.25
max = 4
scale = auto
