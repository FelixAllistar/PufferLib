# Small prey around people (critters.h, critters.c). Read by solo play, the
# listen host and the dedicated server at start (CRET_CRITTERS_INI overrides
# the path, CRET_CRITTERS=0 turns them off); the trainer has no people, so it
# never runs critters. Defaults are in cret_critter_defaults.
[critters]
enabled = 1
# Critters around one person, and around a person who spawned as a hatchling
# (growth below 0.5) for its first fresh_seconds.
per_person = 80
fresh_per_person = 128
fresh_seconds = 240
# Spawn ring (m from the person; a fresh hatchling's is closer) and the
# distance from every person past which a critter is gone.
ring_min = 25
ring_max = 120
fresh_ring_min = 12
fresh_ring_max = 70
despawn = 160
# Multipliers on each kind's density (Damuth's law, mass^-0.75, before habitat).
density_mouse = 1
density_badger = 1
density_lizard = 1
density_bird = 1
density_fish = 1
