# A raptor walks in a straight line over open ground, seen from the side: for
# looking at its feet against the ground (the artist's walk against the physics
# walk: CRET_PHYS=0 or 2 with a raptor.dino that has walk_phys, tools/loco_bake.c;
# CRET_SCN_CAM_DIST=5 CRET_GRASS=0 CRET_CARPET=0 for a close look at bare ground).
[scenario]
title = Raptor walking
seconds = 10
hour = 10
weather = clear
place = open
camera = side
end = time

[player]
species = raptor
at = -12 0
facing = 0
control = walk 60 0
abilities = off
