# Knockdown: a raptor goes for an adult stegosaur's flank; the stegosaur
# turns its tail to it and swings, and a blow that connects knocks the raptor
# off its feet (sim.h, CRET_KD_*). It falls onto its side, lies there for
# about 0.6 s (up to 1 s after the wide sweep), gets up over 0.4 s and comes
# back. The
# raptor cannot die (god), so it keeps coming and falls again and again. The
# side camera shows the fall, the dust where it lands and the roll back up.
[scenario]
title = Knockdown: a stegosaur's tail on a raptor
seconds = 30
hour = 11
weather = clear
place = open
camera = side
end = time

[player]
species = stego
at = 0 0
facing = 0
control = bot

[actor raptor]
species = raptor
at = -12 4
facing = player
behaviour = hostile
target = player
god = on
