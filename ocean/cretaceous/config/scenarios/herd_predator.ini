# A sauropelta herd grazes (game AI); a hostile T. rex walks in from the side
# and goes for the herd. The player is an idle onlooker in god mode.
[scenario]
title = Herd reacting to a predator
seconds = 60
hour = 18
weather = clear
place = open
camera = high
end = time

[player]
species = galli
at = 0 -90
facing = 90
control = idle
god = on

[actor herd]
species = sauropelta
count = 5
at = 0 0
spread = 12
behaviour = bot

[actor rex]
species = trex
at = -70 0
facing = herd
behaviour = hostile
target = herd
