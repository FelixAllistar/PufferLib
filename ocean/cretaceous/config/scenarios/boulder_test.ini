# Movable props: a tyrannosaur sprints through a 7.8 t boulder and shoves it
# into a pachycephalosaur: crush damage, credited to the pusher. A log lies
# off to the side to push by hand (Esc menu, or M takes over the player).
# In normal play the console's `prop boulder [kg]` drops one at the crosshair.
[scenario]
title = Boulder shove
seconds = 20
hour = 11
weather = clear
place = open
camera = side
end = time
prop = boulder -4 0 7800
prop = log 4 -10 150 90

[player]
species = trex
at = -26 0
facing = 0
control = walk 30 0 run

[actor target]
species = pachy
at = 7 0
facing = 90
behaviour = dummy
