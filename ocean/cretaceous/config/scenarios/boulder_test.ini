# Movable props: a tyrannosaur sprints (away from a gallimimus behind it)
# through a 2 t boulder and shoves it into a raptor: crush damage, credited
# to the pusher.
# A log lies off to the side to push by hand (M takes over the player).
# In normal play the console's `prop boulder` drops one at the crosshair.
[scenario]
title = Boulder shove
seconds = 25
hour = 11
weather = clear
place = open
camera = side
end = time
prop = boulder -4 0 2000
prop = log 4 -10 150 90

[player]
species = trex
at = -24 0
facing = 0
control = flee behind

[actor target]
species = raptor
count = 1

at = 6 0
facing = 180
behaviour = dummy

[actor behind]
species = galli
at = -60 0
behaviour = dummy
