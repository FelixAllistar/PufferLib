# A pack of four raptors (game AI) hunts a herd of gallimimus with young (game AI).
# Healthy adult galli outrun raptors, so the pack goes for the young.
[scenario]
title = Raptor pack hunting gallimimus
seconds = 60
hour = 8
weather = clear
place = open
camera = high
end = death young

[player]
species = raptor
at = -30 6
facing = galli
control = bot

[actor pack]
species = raptor
count = 3
at = -30 -6
spread = 6
facing = galli
behaviour = bot

[actor galli]
species = galli
count = 4
at = 20 0
spread = 14
facing = 180
behaviour = bot

[actor young]
species = galli
count = 3
at = 20 4
spread = 8
growth = 0.45
facing = 180
behaviour = bot
