# Wounds and blood trails (sim.h, CRET_WOUND_*): a gallimimus with a bad leg
# wound and a body wound walks away from its grazing herd, 120 m to the east.
# It limps (the lurching gait of a broken bone, render/dino.c) at 70% of its
# walk, and drips blood on its trail every 3 m. A hungry raptor (game AI)
# starts 40 m behind it. Take over the raptor with M and hold V to sniff:
# the blood shows as red marks along the wounded animal's way
# (render/scentfx.c), lasting four minutes where the rest of a trail lasts
# 45 s, and the scent panel lists its trail as a "blood trail" in red.
[scenario]
title = Wounds: a limping gallimimus and its blood trail
seconds = 90
hour = 9
weather = clear
place = open
camera = high
end = time

[player]
species = raptor
at = -40 10
facing = hurt
control = bot

[actor hurt]
species = galli
at = 0 0
facing = 0
control = walk 120 0
wound = leg 0.8
wound = body 0.6

[actor herd]
species = galli
count = 4
at = -10 -25
spread = 10
behaviour = bot
