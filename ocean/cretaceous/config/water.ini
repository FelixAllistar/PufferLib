; Water look (render/water_look.h, shaders/water.fs). Edit while the game
; runs and press F5: the shaders and this file are reread. Missing keys keep
; their built-in defaults (the values below); CRET_WATER_INI=path uses
; another file.

[flow]
flow_speed = 1.2         ; m/s of surface drift per unit of steepness (x2.5 on the steepest creeks)
max_speed = 2.2          ; soft cap on the drift, m/s
fast_gloss = 0.55        ; 0..1: fast water flattens along the current into smooth glossy streaks
foam = 0.35              ; rapids foam on the fastest water (shore foam is separate)

[ripples]
ripple_scale = 1.0       ; size multiplier (bigger: broader ripples)
ripple_strength = 1.0    ; slope multiplier (smaller: calmer, more mirror-like)

[sparkle]
sparkle = 1.0            ; near-field (within ~60 m) glint brightness
sparkle_size = 1.4       ; metres: wavelength of the fine chop that makes the glints
sparkle_peak = 6         ; cap on one near glint (lower: dimmer, never a white disc)

[colour]
colour = 0.012 0.075 0.085   ; in-scatter of clear water (linear RGB)
silt = 0.075 0.07 0.045      ; in-scatter of silty water past river mouths
turbidity = 0.8              ; 0..1: how silty a river plume gets
clarity = 1.0                ; absorption divisor (2: light reaches twice as deep)
