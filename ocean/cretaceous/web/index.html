<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Phones: no pinch or double-tap zoom, and the page fills the screen round a notch (viewport-fit). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0c0a">
<title>Cretaceous</title>
<style>
  :root { --bg: #0b0c0a; --ink: #e8e2d4; --dim: #9a948a; --accent: #c9a25a; }
  /* The game takes every touch: no scrolling, pull-to-refresh, zoom, text
     selection, long-press menu or tap highlight. */
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
               position: fixed; inset: 0; overscroll-behavior: none; touch-action: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
               font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
  /* Held upright, a phone gets a hint to turn sideways; a tap puts it away. */
  #turn { display: none; position: fixed; inset: 0; z-index: 2; align-items: center; justify-content: center; padding: 24px;
          text-align: center; background: rgba(11, 12, 10, 0.82); }
  #turn p { margin: 0; max-width: 18em; font-size: 17px; }
  #turn svg { display: block; margin: 0 auto 14px; }
  @media (orientation: portrait) and (pointer: coarse) { body:not(.upright) #turn { display: flex; } }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 14px; padding: 16px; text-align: center; background: var(--bg); }
  #loading h1 { margin: 0; font-weight: 600; letter-spacing: 0.04em; font-size: 40px; }
  #loading p { margin: 0; color: var(--dim); max-width: 34em; }
  #track { width: min(420px, 90vw); height: 6px; border-radius: 3px; background: #24231f; overflow: hidden; }
  #bar { width: 0; height: 100%; background: var(--accent); transition: width 0.2s; }
  body.running #loading { display: none; }
  body.failed #track { display: none; }
  body.failed #status { color: var(--ink); }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading">
  <h1>Cretaceous</h1>
  <p>A dinosaur survival game. Single player in the browser (WebGL2); the first visit downloads the island.</p>
  <div id="track"><div id="bar"></div></div>
  <p id="status">Starting</p>
</div>
<div id="turn" onclick="document.body.classList.add('upright')">
  <div>
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <rect x="20" y="8" width="24" height="44" rx="4"/><path d="M50 40a16 16 0 0 1-14 14m0 0 5-4m-5 4 5 4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p>Turn your phone sideways to play. The game is laid out for a wide screen.</p>
    <p style="color: var(--dim); font-size: 14px; margin-top: 10px">Tap to continue anyway</p>
  </div>
</div>
<script src="loader.js"></script>
</body>
</html>
