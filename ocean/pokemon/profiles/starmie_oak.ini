# One fresh learner per trial; all imported opponents remain frozen.
# Catalog 421/366/389/395/512/445. Human-style fixed sets, NOT a claim that
# this moveset was statistically best among the old policy's sampled drafts.
# Exeggutor uses catalog Stun Spore + Explosion (the source sample had Mega Drain).
[base]
seed = 73
async = 0
load_model_path = None
checkpoint_interval = 0
eval_episodes = 0

[vec]
total_agents = 16384
num_buffers = 2
num_threads = 4

[env]
force_core_combos = 0
force_core_prob = 0
reset_state_prob = 0
learner_team = 421,366,389,395,512,445
learner_lead = 121
opponent_team = None
opponent_lead = None
native_league = saved/pokemon/starmie_sweep/native.ini
expert_fraction = 0.5
team_selection = 1

[policy]
hidden_size = 64
num_layers = 2

[train]
# 16384 rows * 2048 timesteps. 75% are learner rows with a 50/50 game mix:
# 33,554,432 counted agent steps = 25,165,824 learner steps.
total_timesteps = 33554432
horizon = 32
minibatch_size = 8192

[sweep]
live = 1
gpus = 1
max_runs = 500
history_path = saved/pokemon/starmie_sweep/sweep.history
metric = oak_score
goal = maximize
downsample = 1
max_failures = 1
max_suggestion_cost = 14400

[oak]
enabled = 1
games = 128
budget = 4096
workers = 3
seed = 20261015

# Agent count/model/budget and unlisted ranges are locked by sweep.py. These
# PPO parameters vary; trial zero is the existing default configuration.
[sweep.train.horizon]
min = 32
max = 64

[sweep.train.minibatch_size]
min = 8192
max = 32768

[sweep.train.learning_rate]
min = 0.0001
max = 0.003

[sweep.train.ent_coef]
min = 0.0001
max = 0.02

[sweep.train.gamma]
min = 0.97
max = 0.9999

[sweep.train.gae_lambda]
min = 0.9
max = 0.995

[sweep.train.replay_ratio]
min = 1
max = 4

[sweep.train.clip_coef]
min = 0.1
max = 0.3

[sweep.train.vf_coef]
min = 0.25
max = 1

[sweep.train.max_grad_norm]
min = 0.25
max = 1.5
