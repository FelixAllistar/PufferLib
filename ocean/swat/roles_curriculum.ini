# Role task training curriculum (roles_curriculum.h; CONTRACT.md "Curriculum").
# One [section] per stage, in order; roles_stage = N in config/swat.ini runs
# stage N (0-based) and its keys override [env]. Only difficulty keys are
# allowed: rewards stay in [env] and the held-out evaluation suite
# (roles_eval.h, make roles-eval) is fixed and independent of these stages.
# Promote to the next stage when promote_metric, averaged over
# promote_window training episodes, reaches promote_at. Stages control
# different rosters; set roles_agents = 8 in [env] so every stage presents the
# same agent count and one checkpoint continues across stages.

# Movement and doors: officers only. Occupants stay under the sim's own
# control, which hostile_fire = 0 disarms (a policy- or baseline-driven
# suspect would still fire), so officers learn to move through the annex door
# to the suspect and back to extraction without a threat.
[locomotion_doors]
roles_mission = annex
hostile_fire = 0
roles_suspects = 0
roles_civilians = 0
roles_scripted = none
max_ticks = 1200
promote_metric = perf
promote_at = 0.6
promote_window = 2000

# Weapon handling: scripted suspects return fire.
[weapon_handling]
roles_mission = annex
hostile_fire = 1
roles_scripted = suspects+civilians
max_ticks = 1800
promote_metric = perf
promote_at = 0.5
promote_window = 2000

# Target discrimination: the motel's mix of suspects and civilians across
# training layouts; occupants are the sim's and do not fire.
[target_discrimination]
roles_mission = motel
motel_occupancy = 2
roles_layouts = 4096
hostile_fire = 0
roles_suspects = 0
roles_civilians = 0
roles_scripted = none
max_ticks = 3600
promote_metric = perf
promote_at = 0.3
promote_window = 2000

# Cover: dispersed occupants who shoot back.
[cover]
roles_mission = motel
motel_occupancy = 1
roles_layouts = 4096
hostile_fire = 1
roles_scripted = suspects+civilians
max_ticks = 3600
promote_metric = perf
promote_at = 0.3
promote_window = 2000

# Extraction and self-play: suspects may flee to the staging point; 80% of
# episodes are self-play, 20% keep scripted occupants as a fixed reference.
[extraction_selfplay]
roles_mission = motel
motel_occupancy = 0
roles_layouts = 4096
hostile_fire = 1
suspect_escape = 1
roles_scripted = suspects+civilians
roles_scripted_rate = 0.2
max_ticks = 3600
promote_metric = scripted_perf
promote_at = 0.5
promote_window = 2000
