# Kaggriculture training and sweep configuration; current values below are authoritative.
# Updated 2026-09-21 from the user's active Vast config: multi-intent 2/2.
# Cleaned retired reward entries; all active values and sweep ranges preserved.
# Trial 0 uses the defaults below; later trials search the listed ranges.
# Optimizer/reward search only: budgets, batch geometry, architecture, and
# gameplay rules stay fixed. This file does not launch or resume a job.

# Checkpoint loading follows load_model_path below; run_id=None creates a new output ID.
# 2048 x 720 = 1,474,560 steps/update: checkpoints roughly every 35.4M.
[base]
env_name = kaggriculture
rank = 0
world_size = 1
gpu_id = 0
gpu_offset = 0
nccl_id = None
profile = 0
checkpoint_dir = checkpoints
log_dir = logs
checkpoint_interval = 24
eval_episodes = 10
num_games = 50
burnin_games = 0
eval_agents = 16
load_model_path = None
load_enemy_model_path = None
enemy_hidden_size = 0
enemy_num_layers = 0
run_id = None
result_fd = 0
wandb = 0
slowly = 0
eval_deterministic = 0
trace_steps = 12
ppo_debug = 0
cudagraphs = 1
seed = 5
eval_epoch_mult = 1
reset_every_horizon = 0
async = 0

# Network dimensions below are fixed across sweep trials.
[policy]
hidden_size = 512
num_layers = 3
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

# Preserve the user's 2048-agent setup for the 16 GiB GPU.
# Do not sweep geometry alongside optimizer/reward settings.
[vec]
total_agents = 2048
num_buffers = 1
num_threads = 8
num_frozen_banks = 8
frozen_bank_hidden_size = 512
frozen_bank_num_layers = 3
frozen_bank_pct = 0.75
action_mask_size = 1978
gpu_env = 1
seat_balance = 0

# Selfplay configuration. Learner loading is controlled by base.load_model_path.
# Saved intermediate policies enter each run's own history. Final panel money
# is not a common external-league rating across different trials.
[selfplay]
enabled = 1
max_size = 8
seed = 707
opponent_pool = None
opponent_league = None
opponent_pool_weights = None
opponent_pool_prob = 1
pfsp_mode = variance
pfsp_alpha = 1
pfsp_uniform_mix = 0.1
payoff_ema = 0.1
opp_timeout_steps = 1000000
eval_pool_size = 8
eval_games = 50
eval_metric = money
eval_agents = 64
snapshot_interval = 50000000
magnet_path = None

[league]
mode = matrix
policy_manifest = None
candidate_manifest = None
opponent_manifest = None
output = None
games = 16
min_agents = 0
focal_count = 0

# Multi-intent 2/2, entity observation v3, policy ABI v5.
# Preserve the old 2/1 rewards, optimizer, architecture and reset-bank mixture.
# The deliberate controller changes are executor 2 and no land-buy delay.
# Old 2/1 checkpoints are retained but cannot load into this policy ABI.
[env]
dr = 0
num_agents = 1
num_bots = 0
macro_mode = 2
frozen_macro_mode = -1
macro_executor_version = 2
frozen_macro_executor_version = -1
observation_version = 3
frozen_observation_version = 3
macro_decision_interval = 1
macro_score_scale = 10000
frozen_macro_decision_interval = -1
macro_score_features = 0
frozen_macro_score_features = -1

# Direct cash: 0 = terminal-only, 1 = per-step cash changes.
# Terminal amount = money_scale * (ending_cash - starting_cash) / starting_money.
# This does NOT switch off PBRS, growth, alive, or quality rewards below.
# Edits apply on a NEW launch, not to an already-running process.
# Sweep trials can override timing because it remains in sweep_only.
# Replace the reward values inside your existing [env] section with these.

reward_money_scale = 5.17355394
reward_money_timing = 1

reward_growth_land = 1
reward_growth_crop = 1
reward_growth_animal = 2.79234052
reward_alive_daily = 0

reward_target_plots = 3
reward_target_animals = 15
reward_target_crops = 45

reward_quality_scale = 0.397192657
reward_quality_timing = 0
reward_quality_idle_cost = 0.587967753

reward_pbrs_scale = 0
pbrs_cash_weight = 5.70411777
pbrs_stock_weight = 4.93069267
pbrs_crop_weight = 0
pbrs_animal_weight = 3.03336596


episode_steps = 720
board_size = 10
starting_money = 3000
max_market_orders_per_turn = 10
policy_market_slots = 10
policy_max_hands = 16
land_buy_min_days = 0
opening_turns = 0
reset_opening_turns = 0
reset_opening_min = 0
reset_opening_prob = 0.1
reset_state_bank = /workspace/PufferLib/ocean/kaggriculture/state_bank/diverse_20260913/full.kgb
reset_state_prob = 0.8
curriculum_enabled = 0
curriculum_window = 64
curriculum_success_rate = 0.60
curriculum_rehearsal_prob = 0.50
curriculum_root_prob = 0.05
curriculum_reward = 10
turns_per_day = 24
shed_capacity = 100
weed_spawn_chance = 0.005
town_shop_unlock_interval = 3
town_shop_sell_interval = 4
town_center_sell_interval = 24
farm_hand_cost_mult = 1
seed = 707

bot_opponent_fraction = 0.4
bot_pass_fraction = 0
bot_first = 0.1
bot_top_fraction = 0.1
bot_rules_fraction = 0.1
bot_script_fraction = 0.1
bot_adaptive_fraction = 0.1

# Training budget and optimizer settings below are authoritative.
# 2880 = 4 x 720; minibatches preserve complete recurrent sequences.
# Baseline annealing remains on. Both switches and their floors are swept.
# Native annealing duration is still tied to total_timesteps; no code change.
[train]
gpus = 1
total_timesteps = 30000000

learning_rate = 0.00407826758
ent_coef = 4.52631284e-05
gamma = 0.999338269
gae_lambda = 0.976201832
replay_ratio = 1.94187546
clip_coef = 0.30380863
vf_clip_coef = 1
vf_coef = 2.00000024
max_grad_norm = 0.818861365
momentum = 0.904293656

anneal_lr = 1
min_lr_ratio = 0.119832993
anneal_ent_coef = 1
min_ent_coef_ratio = 0.259882718

reward_clip = 0
emag_kl_coef = 0
emag_tau = 0
emag_cutoff = 1

minibatch_size = 2880
horizon = 720
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0
prio_beta0 = 0.6
epoch_sampling = 1

# Replay BC is a separate executable, not a ./puffer subcommand.
# Use the episode split stored in the entity-v3/policy-v5 dataset.
# Each launch must use a new output path; no old checkpoints are overwritten.
[bc]
mode = train
profile = ocean/kaggriculture/bc_2_2_baseline_20260921.ini
steps = 720
epochs = 100
learning_rate = 0.00005
output = saved/kaggriculture_2_2_policy5_bc.bin
load_model_path = None
seed = 7
batch = 1
momentum = 0.9
validation_games = 0
report_interval = 5
anchor_l2 = 0.0
opening_steps = 1
opening_weight = 1.0
root_weight = 1.0
detailed_stats = 0
argmax_margin = 0.0
opening_argmax_coef = 0.0
macro_class_balance = 0
macro_class_weight_cap = 8
zero_reset_source = 0
data = /workspace/PufferLib/data/entity_2_2_policy5_baseline_64g_v1.bc
verify_only = 0
task_mode = 0
task_class_balance = 0
task_class_weight_cap = 8
value_coef = 0

# Fixed per-trial budget: total_timesteps, horizon and minibatch_size are NOT swept.
# Log 21 curve points instead of only the endpoint. Selfplay still passes
# one final score to Protein; downsample>1 also disables its optional
# success-probability acquisition model in the existing native trainer.
# Runtime cap is an acquisition filter, not an early-stop timer, and
# prune_pareto=False does not make acquisition score-only.
[sweep]
metric = money
metric_distribution = linear
goal = maximize
max_suggestion_cost = 21600
max_runs = 500
gpus = 0
downsample = 21
use_gpu = True
prune_pareto = False
early_stop_quantile = 0.25
random_samples = 24
global_random_fraction = 0
global_candidate_fraction = 0
sweep_only = train.learning_rate,train.gamma,train.gae_lambda,train.ent_coef,env.reward_money_scale,env.reward_money_timing,env.reward_growth_land,env.reward_growth_crop,env.reward_growth_animal,env.reward_alive_daily,env.reward_quality_scale,env.reward_quality_timing,env.reward_quality_idle_cost,env.reward_pbrs_scale,env.pbrs_cash_weight,env.pbrs_stock_weight,env.pbrs_crop_weight,env.pbrs_animal_weight

# Include the current lower LR and the earlier winning LR.
[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.01
scale = auto

# Long return discounts for the fixed 720-step game.
[sweep.train.gamma]
distribution = logit_normal
min = 0.999
max = 0.99999
scale = auto

# Broad credit-assignment range; uniform avoids concentrating most draws near one.
[sweep.train.gae_lambda]
distribution = uniform
min = 0.90
max = 0.999
scale = auto

# Explore low through materially higher entropy, with timing swept separately.
[sweep.train.ent_coef]
distribution = log_normal
min = 0.000001
max = 0.003
scale = auto

# PPO policy clipping; contains the requested baseline and the old winner.
[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.6
scale = auto

# Value-loss weight; requested baseline is 0.749999985.
[sweep.train.vf_coef]
distribution = log_normal
min = 0.1
max = 2
scale = auto

# Value clipping; requested baseline is 0.51161955.
[sweep.train.vf_clip_coef]
distribution = log_normal
min = 0.1
max = 1
scale = auto

# Gradient-norm cap.
[sweep.train.max_grad_norm]
distribution = uniform
min = 0.25
max = 1.5
scale = auto

# PPO data reuse: fixed environment-step budget, variable optimizer work.
[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 3
scale = auto

# Optimizer momentum.
[sweep.train.momentum]
distribution = uniform
min = 0.8
max = 0.99
scale = auto

# Compare constant LR with the native cosine schedule over the configured training budget.
[sweep.train.anneal_lr]
distribution = int_uniform
min = 0
max = 1
scale = auto

# LR floor relative to initial LR; inert when anneal_lr=0.
[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.02
max = 0.5
scale = auto

# Compare constant entropy coefficient with cosine annealing.
[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

# Entropy floor relative to initial coefficient; inert when anneal_ent_coef=0.
[sweep.train.min_ent_coef_ratio]
distribution = uniform
min = 0
max = 0.5
scale = auto

# Cash reward strength, including its off ablation.
[sweep.env.reward_money_scale]
distribution = uniform
min = 0
max = 10
scale = auto

# 0=terminal cash; 1=dense cash. Both are now swept at the full budget.
[sweep.env.reward_money_timing]
