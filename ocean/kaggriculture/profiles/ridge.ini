# Actor-only BC, terminal cash plus optional frozen ridge PBRS.
# Beta zero is the first sweep trial / terminal-only control, not a learned potential.
# Pass --env.potential_path=PATH for the selected validated offline fit.
[base]
load_model_path = saved/kaggriculture/initial_bc.bin

[policy]
critic_mode = 0
hidden_size = 256
num_layers = 2

[vec]
hist_policy_hidden_size = 256
hist_policy_num_layers = 2

[env]
reward_win_loss_draw = 0
reward_money = 0.266805351
potential_beta = 0
potential_path = saved/kaggriculture/potential.bin
reward_growth_land = 0
reward_growth_crop = 0
reward_growth_animal = 0
reward_alive_daily = 0
reward_quality_scale = 0

[train]
gamma = 0.999989986
reward_clip = 0
anneal_lr = 0
anneal_ent_coef = 0

[sweep.env.potential_beta]
distribution = uniform
min = 0
max = 2
scale = auto
