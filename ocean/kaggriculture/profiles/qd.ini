# Reward-only CMA-MAE. PPO settings come from --config and are frozen at prepare.
# Every training job restarts the same BC weights. No elite-to-child weight loading.
[qd]
max_trials = 500
batch_size = 10
archive_bins = 8,8
archive_alpha = 0.1
sigma = 0.25
seed = 93030
# Per opponent, balanced seats; all candidates see the same seeds and opponents.
eval_games = 64
eval_seed = 93031
display_seconds = 5

# These are the ONLY candidate-dependent training settings.
# Money=1, land bonus=0, PBRS=0, and reward clipping=0 are enforced.
# Counts/targets, resets, LR, entropy, GAE, replay ratio and architecture stay fixed.
[rewards]
reward_growth_crop = 0,0.2
reward_growth_animal = 0,0.5
reward_alive_daily = 0,0.2
reward_quality_scale = 0,2
reward_quality_idle_cost = 0,1
