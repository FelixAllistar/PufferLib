[base]
env_name = box3d_hover

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
agents_per_env = 64
arena_half = 8.0
arena_stride = 22.0
ball_radius = 0.35
target_radius = 0.55
obstacle_radius = 0.85
force = 18.0
boost_mult = 1.65
brake_mult = 0.55
max_speed = 8.0
max_steps = 360
substeps = 1

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 30000000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.01
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 16384
horizon = 128
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[sweep]
method = Protein
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 16
gpus = 1
downsample = 5
use_gpu = False
prune_pareto = True
early_stop_quantile = 0.3
sweep_only = learning_rate,ent_coef,gamma,horizon,force,substeps

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.003
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.999
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.env.force]
distribution = uniform
min = 10.0
max = 28.0
scale = auto

[sweep.env.substeps]
distribution = int_uniform
min = 1
max = 4
scale = auto
