[base]
# Launcher/runtime settings. These are not gameplay geometry.
env_name = arpg
gpu = 1
cudagraphs = -1
checkpoint_interval = 100
eval_episodes = 10
load_model_path = None
async=1

[vec]
# Vectorization settings used by training.
total_agents = 4096
num_buffers = 1
num_threads = 20
gpu_env = 1
async = 1

[env]
# Slice 2+: PPO drives the avatar (move + summon class + order + ability).
# Avatar obs is 84 floats (player 12 + 4 pets x 8 + 8 enemies x 5).
arena_size = 32.0
max_steps = 18000
wave_length_steps = 600
enemy_cap = 64
pet_cap = 4
obstacle_count = 6

# Avatar (summoner). Speeds are world units/sec at 60 Hz sim.
player_radius = 0.5
player_speed = 5.0
player_health = 20.0
invuln_steps = 30
summon_cooldown = 3.0

# Pets: 3 classes (wisp balanced, fang fast/fragile, aegis tanky blocker).
# Shared behavior knobs below the tables.
pet_radius_wisp = 0.35
pet_radius_fang = 0.3
pet_radius_aegis = 0.5
pet_health_wisp = 10.0
pet_health_fang = 6.0
pet_health_aegis = 22.0
pet_speed_wisp = 5.5
pet_speed_fang = 7.0
pet_speed_aegis = 4.0
pet_damage_wisp = 1.0
pet_damage_fang = 2.0
pet_damage_aegis = 0.7
pet_attack_range = 1.2
pet_attack_cooldown = 0.8
pet_aggro_range = 8.0
pet_leash_range = 14.0
pet_follow_distance = 2.0
pet_invuln_steps = 30

# Enemies: grunts first, brutes join from enemy_kind_switch_wave on.
enemy_radius_grunt = 0.4
enemy_radius_brute = 0.6
enemy_hp_grunt = 3.0
enemy_hp_brute = 8.0
enemy_speed_grunt = 3.0
enemy_speed_brute = 2.2
enemy_damage_grunt = 1.0
enemy_damage_brute = 2.0
enemy_hp_growth_per_wave = 0.05
enemy_speed_growth_per_wave = 0.01
enemy_growth_wave_cap = 20
enemy_kind_switch_wave = 3

# Spawning (ring around the player, interval shrinks per wave).
enemy_spawn_radius = 10.0
spawn_interval = 120
spawn_batch = 3
spawn_min_interval = 30
spawn_interval_per_wave = 4

# Avatar abilities (action head 4: none/dash/nova/frost).
dash_cooldown = 4.0
dash_distance = 5.0
dash_iframes = 0.6
nova_cooldown = 7.0
nova_radius = 4.0
nova_damage = 3.0
frost_cooldown = 9.0
frost_range = 6.0
frost_half_angle = 0.5
frost_damage = 1.0
frost_slow_mult = 0.5
frost_slow_time = 2.0

# RTS economy: harvest shards, spend on summons and buildings.
start_shards = 8.0
kill_shards = 1.0
summon_cost_wisp = 3.0
summon_cost_fang = 5.0
summon_cost_aegis = 8.0
build_cost_totem = 10.0
build_cost_wall = 4.0
build_hp_totem = 15.0
build_hp_wall = 30.0
build_radius_totem = 0.5
build_radius_wall = 0.8
totem_radius = 3.5
totem_damage = 1.5
totem_period = 1.0
shard_trickle_period = 5.0
shard_trickle_cap = 10

# Static pillar obstacles (floor-aware placement inside the dungeon).
obstacle_radius_min = 1.0
obstacle_radius_max = 2.0
obstacle_center_clearance = 4.0

# Reward shaping v0 (tune after first runs).
reward_survival = 0.0002
reward_kill = 1.0
reward_damage = 0.05
reward_hurt = -0.05
reward_summon = 0.1
reward_pet_lose = -0.3
reward_death = 0.0
reward_success = 1.0

show_hitboxes = 0

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 200000000
learning_rate = 0.0005
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.985
gae_lambda = 0.99
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.02
momentum = 0.95
minibatch_size = 4096
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[keys]
# Human-play bindings for ./arpg (comma-separated, e.g. "up = W, UP").
# Orders: 1 follow, 2 attack, 3 guard, 4 focus. Class: Z/X/C select summon.
up = W, UP
down = S, DOWN
left = A, LEFT
right = D, RIGHT
summon = SPACE
dash = Q
nova = E
frost = F
build_totem = G
build_wall = V
class_wisp = Z
class_fang = X
class_aegis = C
order_follow = 1
order_attack = 2
order_guard = 3
order_focus = 4
reset = R
hitboxes = H
autoplay = T
