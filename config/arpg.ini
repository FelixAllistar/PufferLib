[base]
# Launcher/runtime settings. These are not gameplay geometry.
env_name = arpg
gpu = 1
cudagraphs = -1
checkpoint_interval = 100
eval_episodes = 10
load_model_path = None
async=1

[vec]
# Vectorization settings used by training.
total_agents = 4096
num_buffers = 1
num_threads = 20
gpu_env = 1
async = 1

[env]
# Homestead v2: calm renewable economy, territorial camps, four independent pet tasks.
# Observation/action ABI changed: 237 floats, 9 action heads. Retrain v1 policies.
arena_size = 64.0
# Training episodes are five-minute segments. Interactive play has no timeout.
max_steps = 18000
enemy_cap = 32
pet_cap = 4
obstacle_count = 8

# Avatar (summoner). Speeds are world units/sec at 60 Hz sim.
player_radius = 0.5
player_speed = 4.5
player_health = 30
invuln_steps = 30
summon_cooldown = 3.0

# Start with a wisp and porter. Tech advances through production and cleared camps.
pet_radius_wisp = 0.35
pet_radius_fang = 0.3
pet_radius_aegis = 0.5
pet_radius_mule = 0.3
pet_health_wisp = 16
pet_health_fang = 12
pet_health_aegis = 30
pet_health_mule = 14
pet_speed_wisp = 5.5
pet_speed_fang = 7.0
pet_speed_aegis = 4.0
pet_speed_mule = 7.0
pet_damage_wisp = 2
pet_damage_fang = 3
pet_damage_aegis = 0.7
pet_damage_mule = 0.0
pet_attack_range = 1.2
pet_attack_cooldown = 0.8
pet_aggro_range = 5
pet_leash_range = 16
pet_follow_distance = 2.2
pet_invuln_steps = 30

# Enemies: grunts first, brutes join from enemy_kind_switch_level on.
enemy_radius_grunt = 0.4
enemy_radius_brute = 0.6
enemy_hp_grunt = 6
enemy_hp_brute = 14
enemy_speed_grunt = 2.1
enemy_speed_brute = 1.6
enemy_damage_grunt = 1.0
enemy_damage_brute = 2.0
enemy_hp_growth_per_level = 0.02
enemy_speed_growth_per_level = 0
enemy_growth_level_cap = 20
enemy_kind_switch_level = 2


# Avatar abilities (action head 4: none/dash/nova/frost).
dash_cooldown = 4.0
dash_distance = 5.0
dash_iframes = 0.6
nova_cooldown = 7.0
nova_radius = 4.0
nova_damage = 3.0
frost_cooldown = 9.0
frost_range = 6.0
frost_half_angle = 0.5
frost_damage = 1.0
frost_slow_mult = 0.5
frost_slow_time = 2.0

# The home clearing is safe. Deposits renew; pets and extractors work autonomously.
home_radius = 8.0
home_regen = 1.2
enemy_aggro_range = 6.0
enemy_territory_range = 9.0
gather_period = 4.0
resource_regen = 0.10
reward_harvest = 0.15
reward_build = 0.25
start_shards = 24
kill_shards = 1.0
summon_cost_wisp = 3.0
summon_cost_fang = 5.0
summon_cost_aegis = 8.0
summon_cost_mule = 4.0
build_cost_totem = 14
build_cost_wall = 6
build_cost_harvester = 10
build_hp_totem = 15.0
build_hp_wall = 30.0
build_hp_harvester = 20.0
build_radius_totem = 0.5
build_radius_wall = 0.8
build_radius_harvester = 0.5
totem_radius = 3.5
totem_damage = 1.5
totem_period = 1.0
harvest_radius = 3.5
harvest_period = 2
nest_hp = 55
nest_radius = 1.2
nest_period = 16
nest_shards = 8.0
nest_count = 4
unlock_level_fang = 1
unlock_level_aegis = 2
unlock_level_harvester = 0

# Static rocks (floor-aware placement outside the homestead).
obstacle_radius_min = 1.0
obstacle_radius_max = 2.0
obstacle_center_clearance = 10

# Production/build rewards above plus combat, loss, and episode rewards.
reward_survival = 0
reward_kill = 0.4
reward_damage = 0.05
reward_hurt = -0.05
reward_summon = 0
reward_pet_lose = -0.3
reward_death = 0.0
reward_success = 0.5

show_hitboxes = 0

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 200000000
learning_rate = 0.0005
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.995
gae_lambda = 0.99
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.02
momentum = 0.95
minibatch_size = 4096
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[keys]
# Human-play bindings for ./arpg (comma-separated, e.g. "up = W, UP").
# Orders: 1 follow, 2 attack, 3 guard, 4 focus. Class: Z/X/C select summon.
up = W, UP
down = S, DOWN
left = A, LEFT
right = D, RIGHT
summon = SPACE
dash = Q
nova = E
frost = F
build_totem = G
build_wall = V
build_harvester = B
class_wisp = Z
class_fang = X
class_aegis = C
class_mule = M
order_follow = 1
order_attack = 2
order_guard = 3
order_focus = 4
reset = R
hitboxes = H
autoplay = T
