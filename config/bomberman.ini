[base]
env_name = bomberman
async = 1
# Sweep trial 73 settings: fresh policy trained against the fixed champion.
load_model_path = latest
load_enemy_model_path = None
checkpoint_interval = 10
num_games = 4096
eval_agents = 512

[vec]
# Rules:
#   total_agents % num_buffers == 0
#   total_agents % env.num_agents == 0
#   num_threads % num_buffers == 0
#
# Tuned for ~3GB VRAM + 4-core CPU (GTX 10xx 3G class).
# Canonical obs is 1200 standard float values; rollout storage uses the
# configured PufferLib precision. Start at 1024 agents on a 3GB GTX 1060.
total_agents = 1024
num_buffers = 2
num_threads = 4
action_mask_size = 6
num_frozen_banks = 1
frozen_bank_pct = 0.5
frozen_bank_hidden_size = 128
frozen_bank_num_layers = 2
gpu_env = 0

[selfplay]
enabled = 1
max_size = 32
seed = 42
# Keep the champion in the permanent pool as new learner snapshots accumulate.
opponent_league = config/bomberman_league.ini
opponent_pool_prob = 1
pfsp_alpha = 1
payoff_ema = 0.1
opp_timeout_steps = 5_000_000
eval_pool_size = 1
# Seat-balanced matches against the fixed champion supply the sweep score.
eval_games = 256
eval_metric = winrate
eval_agents = 512

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[env]
num_agents = 2
width = 13
height = 11
# Validated curriculum deadline. Visual play/watch remains longer.
max_ticks = 1600
bomb_timer = 18
flame_duration = 4
frames_per_cell = 2
soft_density = 0.55
item_chance = 0.35
# Credited kills and kill-confirmed wins shape reward; uncredited deaths do not
# award the survivor a win bonus. Puffer clamps each combined step to [-1, 1].
reward_soft = 0
reward_pickup = 0
reward_kill = 1
reward_death = -0.261736369
reward_self_kill = -0.5
reward_win = 0.645779014
reward_alive = 0
reward_timeout = 0
# Bonuses are paid only on a credited kill; reward_bomb_escape additionally
# requires the killer to survive. Stage 2 separately uses it for its one-shot
# escape lesson. Harmless bomb placement cannot farm either reward.
reward_bomb_threat = 0.0
reward_bomb_escape = 0.0
# Tactical-only bridge rewards. These make the delayed bomb/escape and
# L-pocket breakout sequences learnable; they are disabled automatically on
# ordinary full-game resets.
reward_curriculum_aim = 8.0
reward_curriculum_escape = 12.0
reward_curriculum_progress = 0.0
reverse_curriculum = 0
# Safety fallback only. Graduation reaches ordinary games through mastery gates
# instead of an abrupt time-based jump.
curriculum_steps = 1000000000
curriculum_window = 32
curriculum_success_rate = 0.45
pillar_mode = 1

[train]
total_timesteps = 200000000
learning_rate = 0.003
ent_coef = 0.01
anneal_lr = 1
anneal_ent_coef = 1

gamma = 0.997528911
gae_lambda = 0.964117408
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 5.0
max_grad_norm = 1.0

momentum = 0.9
# Keep minibatches modest on 3GB VRAM; the 1200-wide recurrent input still dominates.
minibatch_size = 4096
horizon = 32
prio_alpha = 0
prio_beta0 = 0.6
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0
gpus = 1
epoch_sampling = 1


# Kill-confirmed wins against the fixed champion rank the sweep; draws count
# half, while surviving an opponent suicide does not count as a sweep win.
[sweep]
metric = slot_0_clean_score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 7200
max_runs = 100
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
sweep_only = env.reward_soft, env.reward_kill, env.reward_death, env.reward_win, env.reward_alive, env.reward_timeout, train.learning_rate, train.gamma, train.gae_lambda, train.minibatch_size, vec.total_agents, train.horizon

# reward.soft
[sweep.env.reward_soft]
distribution = uniform
min = 0.0
max = 0.02
scale = auto

# reward.kill
[sweep.env.reward_kill]
distribution = uniform
min = 0.0
max = 0.2
scale = auto

# reward.death
[sweep.env.reward_death]
distribution = uniform
min = -0.8
max = -0.3
scale = auto

# reward.win
[sweep.env.reward_win]
distribution = uniform
min = 0.5
max = 0.8
scale = auto

# reward.alive (applied every tick, so keep this range small)
[sweep.env.reward_alive]
distribution = uniform
min = -0.0005
max = 0.0
scale = auto

# reward.timeout
[sweep.env.reward_timeout]
distribution = uniform
min = -0.9
max = -0.3
scale = auto

[sweep.env.max_ticks]
distribution = int_uniform
min = 200
max = 800
scale = auto

# Keep rollout storage within the existing 3 GB GPU budget.
[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.003
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.97
max = 0.999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.90
max = 0.99
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 4096
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 512
max = 1024
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 64
scale = auto
