[base]
env_name = bomberman
load_model_path = None
# Keep the final checkpoint of each trial; learning curves remain in the logs.
checkpoint_interval = 0
eval_episodes = 0
eval_agents = 512
async = 1

[vec]
total_agents = 1024
num_buffers = 2
num_threads = 4
num_policies = 1

[selfplay]
# Fresh-start mirror baseline; frozen-league assets are a separate preset.
enabled = 0
eval_games = 0
eval_bot_games = 0

[policy]
hidden_size = 128
num_layers = 2

[env]
num_agents = 2
width = 13
height = 11
max_ticks = 1600
bomb_timer = 18
flame_duration = 4
frames_per_cell = 2
soft_density = 0.55
item_chance = 0.35
reward_soft = 0
reward_pickup = 0
reward_kill = 1
# Small per-tick proximity bonus; at the sweep maximum, <=0.16 over 1600 ticks.
reward_near_opponent = 0.00002
# Extra credited-kill bonus: coefficient * max(0, 1 - tick/max_ticks).
reward_early_kill = 0.25
reward_death = -0.261736369
reward_self_kill = -0.5
reward_win = 0
reward_alive = 0
reward_timeout = 0
# Bounded opening reward for new personal closest-distance records.
reward_approach = 0.25
reward_approach_horizon = 400
reward_bomb_threat = 0
reward_bomb_escape = 0
reward_curriculum_aim = 8
reward_curriculum_escape = 12
reward_curriculum_progress = 0
reverse_curriculum = 0
curriculum_steps = 1000000000
curriculum_window = 32
curriculum_success_rate = 0.45
pillar_mode = 1

[train]
# Preserve differences between base kill reward and the early-kill bonus.
# The sweep still explores both unclipped (0) and clipped (1) rewards.
reward_clip = 0
total_timesteps = 20000000
learning_rate = 0.003
ent_coef = 0.01
anneal_lr = 1
anneal_ent_coef = 1
gamma = 0.997528911
gae_lambda = 0.964117408
replay_ratio = 1
clip_coef = 0.2
vf_coef = 1
vf_clip_coef = 5
max_grad_norm = 1
momentum = 0.9
minibatch_size = 4096
horizon = 32
gpus = 1

# Raw kills per agent episode, independent of the reward coefficients.
# CPU environment; one trial at a time on this 3 GB GPU, four env threads.
# Game rules and disabled curriculum stay fixed for comparable kill rates.
[sweep]
metric = kills
metric_distribution = linear
goal = maximize
max_runs = 300
gpus = 1
max_suggestion_cost = 7200
downsample = 5
prune_pareto = 1
early_stop_quantile = 0.3

# Override the inherited variable-budget sweep: 20M target for every trial.
[sweep.train.total_timesteps]
distribution = log_normal
min = 20000000
max = 20000000
scale = time

# Powers of two keep every agent/horizon/minibatch combination divisible.
# Even the smallest rollout with replay_ratio=0.5 performs an update.

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 1024
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 4
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 512
max = 4096
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 8
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 1e-05
max = 0.03
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 1e-05
max = 0.1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.9
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.999
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.4
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.1
max = 4
scale = auto

[sweep.train.vf_clip_coef]
distribution = log_normal
min = 0.05
max = 5
scale = auto

[sweep.train.max_grad_norm]
