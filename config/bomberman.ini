[base]
env_name = bomberman
async = 1
# Fresh five-stage reverse-combat experiment. bomberman5 remains the preserved
# parent for any future fine-tune branch.
load_model_path = None
load_enemy_model_path = None
checkpoint_interval = 10
num_games = 4096
eval_agents = 4096

[vec]
# Rules:
#   total_agents % num_buffers == 0
#   total_agents % env.num_agents == 0
#   num_threads % num_buffers == 0
#
# Tuned for ~3GB VRAM + 4-core CPU (GTX 10xx 3G class).
# Canonical obs is 1200 standard float values; rollout storage uses the
# configured PufferLib precision. Start at 1024 agents on a 3GB GTX 1060.
total_agents = 1024
num_buffers = 2
num_threads = 4
action_mask_size = 6
num_frozen_banks = 1
frozen_bank_pct = 0.5
frozen_bank_hidden_size = 128
frozen_bank_num_layers = 2
gpu_env = 0

[selfplay]
enabled = 1
max_size = 32
seed = 42
opp_timeout_steps = 5_000_000
eval_pool_size = 8
eval_games = 64
eval_agents = 1024

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[env]
num_agents = 2
width = 13
height = 11
# Long enough for normal games while still producing useful timeout experience.
max_ticks = 1000
bomb_timer = 18
flame_duration = 4
frames_per_cell = 2
soft_density = 0.55
item_chance = 0.35
# Puffer hard-clamps each learner-visible step reward to [-1, 1]. These values
# keep all primary two-player terminal outcome sums inside that range.
# Safe credited kill: +0.849. Timeout: -0.301. Killed: -0.401.
# Mutual credited kill: -0.441. Unproductive self-kill: -0.991.
reward_soft = 0.01
reward_pickup = 0.02
# Optional signed potential shaping: + for reducing nearest-foe Manhattan
# distance, - for increasing it. Zero keeps the pivot experiment unshaped.
reward_closer = 0.0
reward_kill = 0.50
reward_death = -0.40
reward_self_kill = -0.59
# Survival alone is not a win; opponent suicide therefore pays no win bonus.
reward_win = 0.0
# Immediate time pressure, totaling -1.0 undiscounted over 1000 ticks.
reward_alive = -0.001
reward_timeout = -0.30
# In ordinary games these bonuses are paid only on a credited kill, and the
# escape component additionally requires the killer to survive. Harmless bomb
# placement cannot farm either reward.
reward_bomb_threat = 0.05
reward_bomb_escape = 0.30
# Tactical-only one-shot bridge rewards for aiming at the curriculum target and
# leaving that aimed bomb safely; disabled on ordinary full-game resets.
reward_curriculum_aim = 0.15
reward_curriculum_escape = 0.25
reward_curriculum_progress = 0.0
# Begin one move before a stationary kill and expand backward to full games.
reverse_curriculum = 1
# Safety fallback only. Graduation reaches ordinary games through mastery gates
# instead of an abrupt time-based jump.
curriculum_steps = 1000000000
curriculum_window = 64
curriculum_success_rate = 0.45
pillar_mode = 1

[train]
total_timesteps = 1000000000
learning_rate = 0.001
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 5.0
max_grad_norm = 1.0
ent_coef = 0.01
momentum = 0.9
# Keep minibatches modest on 3GB VRAM; the 1200-wide recurrent input still dominates.
minibatch_size = 4096
horizon = 64
prio_alpha = 0
prio_beta0 = 0.6
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0
gpus = 1

# Reward and episode-length sweep: ./puffer sweep bomberman
[sweep]
metric = slot_0_kills
metric_distribution = linear
goal = maximize
max_suggestion_cost = 7200
max_runs = 40
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
sweep_only = env.reward_soft, env.reward_kill, env.reward_death, env.reward_win, env.reward_alive, env.reward_timeout, env.max_ticks

# reward.soft
[sweep.env.reward_soft]
distribution = uniform
min = 0.0
max = 0.03
scale = auto

# reward.kill
[sweep.env.reward_kill]
distribution = log_normal
min = 0.30
max = 0.60
scale = auto

# reward.death
[sweep.env.reward_death]
distribution = uniform
min = -0.40
max = -0.20
scale = auto

# reward.win
[sweep.env.reward_win]
distribution = uniform
min = 0.0
max = 0.05
scale = auto

# reward.alive (applied every tick, so keep this range small)
[sweep.env.reward_alive]
distribution = uniform
min = -0.002
max = 0.0
scale = auto

# reward.timeout
[sweep.env.reward_timeout]
distribution = uniform
min = -0.50
max = -0.10
scale = auto

[sweep.env.max_ticks]
distribution = int_uniform
min = 500
max = 2000
scale = auto
