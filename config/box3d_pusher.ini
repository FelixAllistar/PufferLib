[base]
env_name = box3d_pusher

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
agents_per_env = 64
arena_half = 8.0
arena_stride = 22.0
player_radius = 0.38
puck_radius = 0.32
goal_radius = 0.85
bumper_radius = 0.72
goal_local_x = 6.65
goal_z_range = 4.4
player_start_x = -1.2
puck_start_shift = 0.0
puck_start_scale = 1.0
force = 23.0
boost_mult = 1.65
brake_mult = 0.45
max_speed = 9.0
approach_reward = 0.04
push_reward = 0.05
progress_reward = 0.08
contact_reward = 0.004
goal_reward = 2.25
target_goals = 5
max_steps = 720
substeps = 1

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 30000000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.01
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 16384
horizon = 128
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[sweep]
method = Protein
metric = perf
metric_distribution = linear
goal = maximize
max_runs = 16
gpus = 1
downsample = 5
use_gpu = False
prune_pareto = True
early_stop_quantile = 0.3
sweep_only = learning_rate,ent_coef,gamma,horizon,force,goal_reward,progress_reward,approach_reward,push_reward,contact_reward,substeps

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.003
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.999
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 64
max = 512
scale = auto

[sweep.env.force]
distribution = uniform
min = 12.0
max = 34.0
scale = auto

[sweep.env.goal_reward]
distribution = uniform
min = 1.0
max = 3.5
scale = auto

[sweep.env.progress_reward]
distribution = uniform
min = 0.03
max = 0.16
scale = auto

[sweep.env.approach_reward]
distribution = uniform
min = 0.01
max = 0.10
scale = auto

[sweep.env.push_reward]
distribution = uniform
min = 0.01
max = 0.12
scale = auto

[sweep.env.contact_reward]
distribution = uniform
min = 0.0
max = 0.02
scale = auto

[sweep.env.substeps]
distribution = int_uniform
min = 1
max = 4
scale = auto
