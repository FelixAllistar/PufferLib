[base]
env_name = swat
seed = 42
load_model_path = None
async = 0
checkpoint_interval = 50
eval_episodes = 32

[vec]
total_agents = 128
num_buffers = 1
num_threads = 4

[env]
# One shared game simulation for player, scripted actors, and policy control.
max_ticks = 1800
randomize = 1
hostile_fire = 1

[policy]
hidden_size = 64
num_layers = 2

[train]
gpus = 1
total_timesteps = 2000000
learning_rate = 0.0003
anneal_lr = 1
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.005
horizon = 64
minibatch_size = 2048
reward_clip = 0

[sweep]
# Compare fixed task success, not returns across changing reward definitions.
metric = perf
goal = maximize
