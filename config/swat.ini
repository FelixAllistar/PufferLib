[base]
env_name = swat
seed = 42
load_model_path = latest
async = 1
checkpoint_interval = 50
eval_episodes = 40
cudagraphs = 1
[vec]
total_agents = 8192
num_buffers = 2
num_threads = 4

[env]
# Training contract: movement, annex or roles. Rebuild puffer after changing task.
# roles also needs build.sh to map it to -DSWAT_ROLES_TRAINING (CONTRACT.md).
# Annex now uses perception contract v3; start fresh annex weights, not v1.
# Existing movement v2 weights/settings are unaffected.
task = movement
# Movement curriculum: -1 mixes stages/roles.
# Stages: 0 goal, 1 stairs, 2 crouch clearance, 3 door, 4 pre-breached wall.
# Roles: 0 officer, 1 suspect.
seed = 2718
stage = -1
role = -1
max_steps = 300
progress_reward = 0.15
step_cost = 0.002
success_reward = 2
fall_penalty = 2
# Shared player settings and the annex combat task.
max_ticks = 1800
randomize = 1
motel_occupancy = 0
hostile_fire = 1
# Role task contract v1 (task = roles): learned officers, suspects and
# civilians with learned-gaze rays; CONTRACT.md "Role task contract v1".
# Controlled actors = officers + controlled suspects + civilians (annex default
# 4, motel standard 7). roles_agents is the agents per env: 0 pads the roster
# with inactive agents (zero obs/reward, fully masked) up to the next power of
# two (4 stays 4, motel 7 -> 8); a positive value is the exact count. Each
# buffer's share of vec.total_agents must be a multiple of it.
# Network size is fixed: run roles at --policy.hidden_size=256 for tests and
# 1024 for real runs; [policy] below stays 64x2 for the movement checkpoints.
roles_mission = annex
roles_officers = 2
roles_suspects = 1
roles_civilians = 1
roles_agents = 0
roles_repeat = 4
suspect_escape = 0
# Reward magnitudes; costs are subtracted.
roles_time_cost = 0.001
officer_success = 5
officer_failure = 5
officer_arrest = 1.5
officer_neutralize = 1
officer_secure_civilian = 0.25
officer_civilian_harm = 0.1
officer_roe = 0.1
officer_damage = 0.01
officer_down = 1
officer_shot = 0.0005
suspect_officer_damage = 0.01
suspect_harm = 0.05
suspect_damage = 0.01
suspect_free = 1
suspect_arrested = 1
suspect_down = 2
suspect_escape_reward = 2
civilian_damage_cost = 0.02
civilian_down = 2
civilian_safe = 1
civilian_comply = 0.1
civilian_survive = 1

[policy]
hidden_size = 64
num_layers = 2

[train]
gpus = 1
total_timesteps = 100000000
learning_rate = 0.0003
anneal_lr = 1
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.005
horizon = 64
minibatch_size = 2048
reward_clip = 0

[sweep]
# Compare fixed task success, not returns across changing reward definitions.
metric = perf
goal = maximize
