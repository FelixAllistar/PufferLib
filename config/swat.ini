[base]
env_name = swat
seed = 42
load_model_path = latest
async = 1
checkpoint_interval = 50
eval_episodes = 40
cudagraphs = 1
[vec]
total_agents = 8192
num_buffers = 2
num_threads = 4

[env]
# Training contract: movement or annex. Rebuild puffer after changing task.
# Annex now uses perception contract v3; start fresh annex weights, not v1.
# Existing movement v2 weights/settings are unaffected.
task = movement
# Movement curriculum: -1 mixes stages/roles.
# Stages: 0 goal, 1 stairs, 2 crouch clearance, 3 door, 4 pre-breached wall.
# Roles: 0 officer, 1 suspect.
seed = 2718
stage = -1
role = -1
max_steps = 300
progress_reward = 0.15
step_cost = 0.002
success_reward = 2
fall_penalty = 2
# Shared player settings and the annex combat task.
max_ticks = 1800
randomize = 1
hostile_fire = 1

[policy]
hidden_size = 64
num_layers = 2

[train]
gpus = 1
total_timesteps = 100000000
learning_rate = 0.0003
anneal_lr = 1
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.005
horizon = 64
minibatch_size = 2048
reward_clip = 0

[sweep]
# Compare fixed task success, not returns across changing reward definitions.
metric = perf
goal = maximize
