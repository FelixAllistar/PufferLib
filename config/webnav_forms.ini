[base]
env_name = webnav_forms
load_model_path = None
eval_episodes = 0
async = 0
checkpoint_interval = 10

[vec]
total_agents = 256
num_buffers = 2
num_threads = 2
num_policies = 1
action_mask_size = 34

[env]
# Eight checked CPU Bend forms tasks. Bit i selects task i.
task_mask = 255
seed_offset = 0
# 0: original two-field table task; 1: one field prefilled for table-only
# curriculum; 2: mix both. Other forms tasks ignore this setting.
data_mode = 0
# 1 adds potential-based public table progress feedback to PPO rewards.
# Benchmark scores continue to use Bend's raw reward; leave 0 for eval.
progress_reward = 0

[policy]
hidden_size = 64
num_layers = 1

[train]
total_timesteps = 1_000_000
learning_rate = 0.015
minibatch_size = 4096
horizon = 32
ent_coef = 0.002
gamma = 0.95
replay_ratio = 1
