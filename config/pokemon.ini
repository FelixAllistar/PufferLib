[base]
env_name = pokemon
seed = 73
async = 0
checkpoint_interval = 100
# Saved checkpoints also populate the native historical-opponent pool.
eval_deterministic = 0
load_model_path = latest

[vec]
total_agents = 4096
num_buffers = 1
num_threads = 4
action_mask_size = 160
gpu_env = 0
num_frozen_banks = 2
frozen_bank_pct = 0.5
frozen_bank_hidden_size = 128
frozen_bank_num_layers = 2

[selfplay]
enabled = 0
magnet_path = None
max_size = 16
opp_timeout_steps = 1000000
pfsp_mode = variance
pfsp_alpha = 1
pfsp_uniform_mix = 0.1
payoff_ema = 0.1
eval_pool_size = 4
eval_games = 256
eval_agents = 256
eval_metric = winrate
opponent_pool = None
opponent_pool_prob = 0.5

[policy]
hidden_size = 128
num_layers = 2

[env]
# Ordinary training consumes a frozen exported roster; None opts out.
native_league = leagues/pokemon/named_roster/native_two_20260910.ini
seed = 42
generation = 1
abi_version = 2
# 0: sourced Smogon RBY OU sets; no arbitrary format strings yet.
format = 0
# 0: sample species then variants; 1: six private species/variant pick pairs.
team_selection = 1
# Includes forced-switch decisions. Reaching the cap adjudicates a draw.
max_updates = 512
# Zero-sum terminal win/loss magnitude; draws remain zero.
reward_win = 1
# Optional discounted potential shaping (defaults off). Normalized team HP
# advantage and fainted-opponent advantage, each in [-1,1].
reward_hp_scale = 0
reward_ko_scale = 0
# Synchronized to train.gamma by the native Pokemon configuration hook.
reward_gamma = 0.999
# Sample exact completed teams: first episode and every N episodes per env.
# Metrics always report learner team/lead frequencies. 0 disables JSONL.
team_log_interval = 0
team_log_path = logs/pokemon/teams.jsonl
# Hard append cap; existing oversized files are left untouched.
team_log_max_bytes = 8388608
# Six catalog set IDs, in draft/lead order, or None (unrestricted).
# League scripts resolve human-readable species/moves to these IDs.
learner_team = None
opponent_team = None

[train]
total_timesteps = 1000000000
horizon = 128
minibatch_size = 8192
learning_rate = 0.01
gamma = 0.999
gae_lambda = 0.98
ent_coef = 0.001
# Provisional EMAG regularization toward an exponentially moving policy.
emag_kl_coef = 0.05
emag_tau = 0.001
emag_cutoff = 1.0
anneal_lr = 1
min_lr_ratio = 0.1
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
# Keep shaping unclipped to preserve its telescoping potential difference.
reward_clip = 0
prio_alpha = 0
prio_beta0 = 0
# Shuffle learner trajectories without replacement. Avoid the replay CDF's
# rounding tail selecting zero-probability frozen rows (NaN importance weights).
epoch_sampling = 1

[league]
mode = matrix
games = 256
policy_manifest = None
output = None

[sweep]
metric = score
goal = maximize
