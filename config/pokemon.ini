[base]
env_name = pokemon
seed = 73
async = 1
checkpoint_interval = 100
# Saved checkpoints also populate the native historical-opponent pool.
eval_deterministic = 0
# Start a new policy; resuming requires an explicit checkpoint override.
load_model_path = None

[vec]
total_agents = 4096
num_buffers = 1
num_threads = 4
action_mask_size = 168
gpu_env = 0
num_frozen_banks = 2
frozen_bank_pct = 0.5
frozen_bank_hidden_size = 128
frozen_bank_num_layers = 2

[selfplay]
enabled = 0
magnet_path = None
max_size = 16
opp_timeout_steps = 1000000
pfsp_mode = variance
pfsp_alpha = 1
pfsp_uniform_mix = 0.1
payoff_ema = 0.1
eval_pool_size = 4
eval_games = 256
eval_agents = 256
eval_metric = winrate
opponent_pool = None
opponent_pool_prob = 0.5

[policy]
hidden_size = 64
num_layers = 2

[env]
; Experiment 1: every three-species core once per shuffled deck, then repeat.
; Policy learns all movesets, draft order, the other 3 slots, and battle play.
force_core_combos = 0
; Per-episode probability: 0 = all normal drafts; 1 = all forced cores.
force_core_prob = 0
core_pool = all
core_seed = 76102
; Optional curriculum cursor for weight-only continuation. League rounds carry it.
core_start_assigned = 0
core_start_drafted = 0
; Written by the checkpoint hook; not used as a starting cursor directly.
core_next_assigned = 0
core_next_drafted = 0
core_observation_version = 1
; Snapshot resets are a separate, mutually exclusive option (disabled here).
reset_state_bank = runs/pokemon_states_20260913/states.pks
reset_state_prob = 0
reset_observation_version = 1
; Optional capped event objectives; zero leaves win-only/default behavior intact.
behavior_sleep = 0
behavior_paralysis = 0
# Opponent mixture: fraction of concurrent environments facing frozen experts.
# Remaining environments play the current learner against itself.
expert_fraction = 0.5
# Set native_league = None (or expert_fraction = 0) for pure current self-play.
# native_league = leagues/pokemon/named_roster/native_two_20260910.ini
# Export ABI-3 experts with league.sh; see ocean/pokemon/FREEPICK.md.
# Historical ocean/pokemon/experts_three.ini uses incompatible checkpoints.
native_league = None
seed = 42
generation = 1
abi_version = 3
policy_version = 3
rules_sha = None
# 0: Gen 1 OU species and fully validated individual move choices.
format = 0
# 0: random legal construction; 1: private species then individual move drafting.
team_selection = 1
# Includes forced-switch decisions. Reaching the cap adjudicates a draw.
max_updates = 512
# Zero-sum terminal win/loss magnitude; draws remain zero.
reward_win = 1
# Optional discounted potential shaping (defaults off). Normalized team HP
# advantage and fainted-opponent advantage, each in [-1,1].
reward_hp_scale = 0
reward_ko_scale = 0
# Species-blind, terminal-zero potential weights. Total absolute weight <= 1.
# Native ./puffer only. See ocean/pokemon/QD.md; defaults preserve old behavior.
personality_paralysis = 0
personality_sleep = 0
personality_offense = 0
personality_defense = 0
personality_reserve = 0
# Synchronized to train.gamma by the native Pokemon configuration hook.
reward_gamma = 0.999
# Sample exact completed teams: first episode and every N episodes per env.
# Metrics always report learner team/lead frequencies. 0 disables JSONL.
team_log_interval = 0
team_log_path = logs/pokemon/teams.jsonl
# Hard append cap; existing oversized files are left untouched.
team_log_max_bytes = 8388608
# species: followed by 1..6 required names/IDs; moves remain freely chosen.
learner_team = None
opponent_team = None
learner_lead = None
opponent_lead = None

[train]
total_timesteps = 1000000000
horizon = 32
minibatch_size = 8192
learning_rate = 0.001
gamma = 0.999
gae_lambda = 0.98
ent_coef = 0.001
# Provisional EMAG regularization toward an exponentially moving policy.
emag_kl_coef = 0.05
emag_tau = 0.001
emag_cutoff = 1.0
anneal_lr = 1
min_lr_ratio = 0.1
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
# Keep shaping unclipped to preserve its telescoping potential difference.
reward_clip = 0
prio_alpha = 0
prio_beta0 = 0
# Shuffle learner trajectories without replacement. Avoid the replay CDF's
# rounding tail selecting zero-probability frozen rows (NaN importance weights).
epoch_sampling = 1

[league]
mode = matrix
games = 256
policy_manifest = None
output = None

[sweep]
metric = score
goal = maximize
