# Broad native Metamon sweep: 64–256 wide, 1–3 layers, 25M–500M steps.
# Normal ./puffer train shows periodic Metamon scores in the native dashboard.
[base]
env_name = pokemon
seed = 73
async = 0
checkpoint_interval = 0
checkpoint_dir = reports/pokemon_experiments/20261019_broad256/checkpoints
log_dir = reports/pokemon_experiments/20261019_broad256/logs
eval_episodes = 0
# Evaluation action selection is unchanged from the winning trial.
eval_deterministic = 0
# Start a new policy; resuming requires an explicit checkpoint override.
load_model_path = None

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 4
action_mask_size = 168
num_policies = 15
hist_policy_percent = 0.5
hist_policy_hidden_size = 64
hist_policy_num_layers = 2

[selfplay]
enabled = 1
max_size = 16
initial_opponents = saved/pokemon/starmie_sweep/opponents.txt
# Frozen banks never rotate or receive learner checkpoint updates.
opp_timeout_steps = 0
eval_pool_size = 0
eval_games = 0

[policy]
hidden_size = 256
num_layers = 2
; Per-Pokemon embedding width and entity-MLP width of the semantic encoder.
pokemon_embed = 32
pokemon_mid = 64
pokemon_attention_layers = 0
pokemon_attention_width = 128
pokemon_attention_heads = 4

[env]
; Fixed catalog sets below; no forced-core or snapshot-reset curriculum.
force_core_combos = 0
; Per-episode probability: 0 = all normal drafts; 1 = all forced cores.
force_core_prob = 0
; Fraction of training at which the forced-core share reaches 0 (0 = constant share).
force_core_until = 0
core_pool = all
core_seed = 76102
; Optional curriculum cursor for weight-only continuation. League rounds carry it.
core_start_assigned = 0
core_start_drafted = 0
; Written by the checkpoint hook; not used as a starting cursor directly.
core_next_assigned = 0
core_next_drafted = 0
core_observation_version = 1
; Snapshot resets are a separate, mutually exclusive option (disabled here).
reset_state_bank = runs/pokemon_states_20260913/states.pks
reset_state_prob = 0
reset_observation_version = 1
; Optional capped event objectives; zero leaves win-only/default behavior intact.
behavior_sleep = 0
behavior_paralysis = 0
# Opponent mixture: fraction of concurrent environments facing frozen experts.
# Remaining environments play the current learner against itself.
expert_fraction = 0.5
; Opponent-randomness curriculum (training only): frozen-bank actions are random with
; probability eps, linear from expert_random_start to 0 at expert_random_until of training.
expert_random_start = 0
expert_random_until = 0.5
; Move exploration (training only): per learner game, probability that each drafted Pokemon is dealt
; 2 random legal moves for its first slots (it picks the other 2), annealed to 0 at
; force_move_pairs_until of training (0 = constant share). Frozen opponents draft freely.
force_move_pairs_prob = 0
force_move_pairs_until = 0
; OMNI training: a league manifest whose bank teams the learner plays, one chosen uniformly per learner
; game (training only; the policy still drafts moves). None = always learner_team.
learner_team_pool = None
# Use the exact 14 frozen opponents from the sweep, including the OU master.
# Fixed ABI-3 roster format: ocean/pokemon/README.md, Fixed named opponents.
# Historical ocean/pokemon/experts_three.ini uses incompatible checkpoints.
native_league = saved/pokemon/starmie_sweep/native.ini
seed = 42
generation = 1
abi_version = 3
policy_version = 3
rules_sha = None
# 0: Gen 1 OU species and fully validated individual move choices.
format = 0
# 0: random legal construction; 1: private species then individual move drafting.
team_selection = 1
# Includes forced-switch decisions. Reaching the cap adjudicates a draw.
max_updates = 512
# Zero-sum terminal win/loss magnitude; draws remain zero.
reward_win = 1
# Optional discounted potential shaping (defaults off). Normalized team HP
# advantage and fainted-opponent advantage, each in [-1,1].
reward_hp_scale = 0
reward_ko_scale = 0
# Species-blind, terminal-zero potential weights. Total absolute weight <= 1.
# Native ./puffer only. See ocean/pokemon/QD.md; defaults preserve old behavior.
personality_paralysis = 0
personality_sleep = 0
personality_offense = 0
personality_defense = 0
personality_reserve = 0
# Synchronized to train.gamma by the native Pokemon configuration hook.
reward_gamma = 0.999899983
# Sample exact completed teams: first episode and every N episodes per env.
# Metrics always report learner team/lead frequencies. 0 disables JSONL.
team_log_interval = 0
team_log_path = logs/pokemon/teams.jsonl
# Hard append cap; existing oversized files are left untouched.
team_log_max_bytes = 8388608
# Exact fixed catalog sets: Starmie / Exeggutor / Rhydon / Chansey / Snorlax / Tauros.
# Current-policy self-play mirrors this team; frozen banks use their bound teams.
learner_team = 421,366,389,395,512,445
opponent_team = 421,366,389,395,512,445
learner_lead = 121
opponent_lead = 121

[train]
# Fresh 100M-step starting trial; subsequent trials range 25M–500M.
# Counted agent steps include frozen slots; expert_fraction=.5 gives 75% learner slots.
total_timesteps = 100000000
horizon = 32
minibatch_size = 4096
learning_rate = 0.0005
gamma = 0.999899983
gae_lambda = 0.899999976
ent_coef = 0.01
anneal_lr = 1
min_lr_ratio = 0.1
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
replay_ratio = 2
clip_coef = 0.12561436
vf_coef = 0.52888006
vf_clip_coef = 0.2
max_grad_norm = 0.338345766
# Keep shaping unclipped to preserve its telescoping potential difference.
reward_clip = 0

[league]
mode = matrix
games = 256
policy_manifest = None
output = None
[sweep]
live = 1
gpus = 1
max_runs = 500
history_path = reports/pokemon_experiments/20261019_broad256/sweep.history
metric = metamon_score
goal = maximize
downsample = 1
max_failures = 8
max_suggestion_cost = 14400

# Native trainer, fresh history: no external sweep worker.
# 25 varying dimensions. Team/rules/benchmark remain fixed for comparison.
# Expert fractions use a discrete grid so all learner minibatch layouts divide.

[sweep.train.total_timesteps]
distribution = log_normal
min = 25000000
max = 500000000
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 4096
max = 16384
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 8192
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.003
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.05
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 6
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.4
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.1
max = 2
scale = auto

[sweep.train.vf_clip_coef]
distribution = log_normal
min = 0.05
max = 1
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.25
max = 3
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.8
max = 0.99
scale = auto

[sweep.train.min_lr_ratio]
distribution = log_normal
min = 0.01
max = 0.5
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = log_normal
min = 0.01
max = 1
scale = auto

[sweep.train.vtrace]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1
max = 2
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.5
max = 1
scale = auto

[sweep.env.expert_fraction]
distribution = uniform
min = 0
max = 1
scale = auto
step = 0.25

[sweep.env.reward_hp_scale]
distribution = uniform
min = 0
max = 0.5
scale = auto
step = 0.25

[sweep.env.reward_ko_scale]
distribution = uniform
min = 0
max = 0.5
scale = auto
step = 0.25

# In-training Metamon checks, shown in the ordinary PufferLib dashboard.
# Training briefly waits for each check, then resumes with unchanged optimizer state.
# Counts are PER opponent team: 2 interim = 6 total; 24 final = 72 total.
# Final score alone ranks trials. Interim best is a noisy monitoring statistic.
[metamon]
enabled = 1
interval_fraction = 0.1
games = 2
final_games = 24
min_free_gb = 2
python = build/pokemon/metamon-eval-env-cu128/bin/python
device = cuda
seed = 20261025
timeout = 600

# Legacy perfect-information Oak benchmark, opt-in only. Metamon takes precedence.
[oak]
enabled = 0
python = build/pokemon/oak-benchmark-env/bin/python
games = 128
budget = 4096
workers = 6
seed = 20261015
