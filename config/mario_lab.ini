# Training hold: full-game feasibility/fidelity audit, 2026-10-03.
# Do not start a new run based on historical simulator-dependent conclusions.
# See ocean/mario_sim/EXPERIMENT_AUDIT.md.
# Optional GEN002 long-generator ablation, retained for comparison.
# The later precision experiment is also under this training hold.
[base]
env_name = mario_lab
load_model_path = None
checkpoint_dir = checkpoints
log_dir = logs
checkpoint_interval = 100
eval_episodes = 0
async = 0
cudagraphs = 1
seed = 73
# Carry recurrent memory throughout each complete level.
reset_every_horizon = 0

[vec]
total_agents = 256
num_buffers = 1
num_threads = 4
num_policies = 1

[policy]
# First baseline: semantic grid/entity/ego inputs -> MLP -> MinGRU.
hidden_size = 128
num_layers = 2

[env]
physics_mode = 2
accel = 14
friction = 13
walk_speed = 384
run_speed = 640
jump_speed = 1024
gravity_hold = 32
gravity_release = 112
max_fall = 1024
hold_frames = 60
walk_accel = 10
brake_accel = 32
player_width = 10
player_height = 12
jump_fast_speed = 1280
jump_fast_threshold = 512
gravity_fast_hold = 40
gravity_fast_release = 144
pipe_min_height = 2
pipe_max_height = 4
stair_height = 8
# 0 preserves the earlier short generator; 1 generates complete varied levels.
generator_mode = 1
# Length is sampled once per episode, in tiles, between length_min and length.
length_min = 256
section_min = 40
section_max = 96
# Ground clearance between motifs, in tiles; stairs also reserve their width.
spacing_min = 8
spacing_max = 24
# 0 mixed, 1 flat, 2 gaps, 3 pipes, 4 stairs, 5 walkers, 6 underground, 7 composite.
course = 0
difficulty = 2
length = 512
max_frames = 8000
require_pipe = 0
seed = 73
# 0 training, 1 validation, 2 held-out test; independent procedural seed streams.
split = 0
completion_reward = 10
death_penalty = 1
speed_bonus = 2
# Optional episode-local frontier shaping. This is not potential-based shaping.
progress_reward = 0.001
# Optional authored practice starts; a miss always uses the full root course.
practice_prob = 0
practice_gap = 1
practice_entry = 1
practice_exit = 1
practice_route = 1
practice_frames = 600
# 0 keeps the original finish line after a practice reset; 1 uses local goals.
practice_short_goals = 1
# Full generator: section/motif weights. Legacy generator: whole-course weights.
mix_flat = 1
mix_gaps = 1
mix_pipes = 1
mix_stairs = 1
mix_walkers = 1
mix_underground = 1
mix_composite = 1

[train]
total_timesteps = 500000000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.9995
gae_lambda = 0.99
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
reward_clip = 0
max_grad_norm = 1
ent_coef = 0.01
anneal_ent_coef = 0
momentum = 0.9
minibatch_size = 4096
horizon = 256
gpus = 1

[sweep]
metric = perf
