[base]
env_name = poker
seed = 73
checkpoint_interval = 0

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 4
num_policies = 1
hist_policy_percent = 0

[policy]
architecture = puffernet
hidden_size = 64
num_layers = 2

[env]
num_agents = 1
num_players = 6
starting_stack = 20000
bot_policy = 1
# Zero uses bot_policy. Otherwise bit i enables native style i, sampled once per
# table/opponent seat. 23 mixes 0/1/2/4 and requires compiled Fullhouse weights.
native_baseline_mask = 0
# Public table statistics persist across hands; only range styles 7/8 use them.
native_history = 0
seed = 73
native_league = None
rules_fraction = 0.25

[selfplay]
# Native acting-opponent banks are frozen per stint by ocean/poker/league.py.
# Keep the trainer's simultaneous-row selfplay pool off for this adapter.
enabled = 0

[train]
total_timesteps = 1000000
gamma = 1.0
reward_clip = 0
horizon = 32
minibatch_size = 4096
replay_ratio = 1
learning_rate = 0.0003
