[base]
env_name = poker
seed = 73
checkpoint_interval = 40
# gen4 (2026-10-28, poker box 58025673): gen3 trial 0's recipe (the sweep's best was its own center point, these
# defaults) plus the trapper bot (id 11) as opponent and panel type, and state sets: env.state_fraction of hands start
# from a stored mid-hand spot (ocean/poker/states.h, gen_states.c) to break the shove-or-fold loss minimization.
# A/B: the same run with state_fraction = 0. Previous: config/poker.ini.gen3_sweep.
# gen3 sweep (2026-10-27, poker box 58025673): cash tables, 256x3 from scratch. Stacks carry over 200-hand sessions
# with random depths (20-250 BB, rebuy on bust, leave above 500 BB); opponents: all five bot styles, ramping to the
# trial's own snapshots (league_pool_dir = auto); 20% panel tables; score panel_worst. 500 trials, replay pinned to 1.
# Previous: config/poker.ini.gen2_sweep. gen2 sweep (2026-10-26): from gen1 (leagues/poker/gen1/gen1.bin), vs a fixed league (gen1 + 15 snapshots of its self-play
# history, leagues/poker/gen2/opponents.txt) and all five bot types (Rules, Range, maniac, station, tight), 20% panel
# tables; score panel_worst (BB/hand vs the hardest bot type). Earlier: gen1 sweep, from scratch. The observation gained card features (ocean/poker/core.h
# POKER_CARD_FEATURES), so gen0 (106 inputs) cannot be loaded. The gen0 league sweep config is
# config/poker.ini.gen0_league_sweep.
load_model_path = None
async = 1
cudagraphs = 1

[vec]
total_agents = 16384
num_buffers = 1
num_threads = 24
num_policies = 1
hist_policy_percent = 0

[policy]
architecture = puffernet
hidden_size = 256
num_layers = 3

[env]
# Panel tables: this share of tables seats five copies of one panel bot (rules, range, maniac, station, tight, trapper); logged as panel_<type> and panel_worst.
panel_fraction = 0.2
num_agents = 1
num_players = 6
starting_stack = 20000
# Cash sessions (ocean/poker/poker.h): stacks carry over this many hands; depth uniform in [stack_min_bb, stack_max_bb]
# at each session start, after a bust and above stack_cap_bb. 0 = fresh starting_stack every hand (gen0-gen2).
session_hands = 200
stack_min_bb = 20
stack_max_bb = 250
stack_cap_bb = 500
bot_policy = 7
# Active IDs: 1 rules control, 4 Fullhouse, 7 range. Zero uses bot_policy;
# otherwise bit i enables policy i once per seat. 146 mixes all three.
# gen1: each opponent seat is Rules or Range (130), no frozen networks.
# gen4: 3970 = rules, range, maniac, station, tight, trapper (1922 in gen3, without trapper).
native_baseline_mask = 3970
# 0 uses the build default. 32, 64 and 128 choose the range sampling budget.
equity_samples = 0
# Public table statistics persist across hands; only the range policy uses them.
native_history = 0
seed = 73
# gen0 league: each opponent seat is the range bot (bot_policy 7) with probability rules_fraction,
# otherwise gen0 (leagues/poker/gen0). Frozen opponents run on CPU, so all trainer rows are learner rows.
native_league = leagues/poker/gen3/empty.txt
# 1: league seats run as one batched GPU forward per round (ocean/poker/poker.h); 0: inline on CPU.
league_gpu = 1
# Live pool: this run's checkpoint directory; each new checkpoint joins the opponent pool (up to 128, oldest
# replaced). Needs league_gpu = 1 and a native_league manifest (it may list 0 banks).
league_pool_dir = auto
# Live pool: opponents come from this many snapshots at a time (the newest plus a random sample, redrawn every
# 20 s), which keeps the GPU league fast as the pool grows.
league_active = 8
# Live pool ramp: the bot share of opponent seats falls from 1 to rules_fraction as the pool grows to this many
# snapshots (0 = off).
league_ramp = 40
rules_fraction = 0.3
# State sets (ocean/poker/states.h): a file from gen_states.c and the share of non-panel hands that start from one of
# its states (learner to act, reward from the restore point; logged as state_bb and state_share). None = off.
state_file = None
state_fraction = 0

[selfplay]
# Native acting-opponent banks are frozen per stint by ocean/poker/league.py.
# Keep the trainer's simultaneous-row selfplay pool off for this adapter.
enabled = 0

[train]
# gen1 sweep: trial 0 is the gen0 recipe (mega-sweep trial 99, LR/entropy/magnet annealing on), from scratch
# with card features against Rules + Range bots.
total_timesteps = 300000000
anneal_lr = 1
learning_rate = 0.001
gamma = 0.95
gae_lambda = 0.989157677
reward_clip = 0
horizon = 16
minibatch_size = 1024
replay_ratio = 1
clip_coef = 0.391240656
vf_clip_coef = 0.938034117
vf_coef = 0.275439382
max_grad_norm = 0.25
momentum = 0.940657675
ent_coef = 0.002
anneal_ent_coef = 1
min_ent_coef_ratio = 0.5
magnet_coef = 0.05
magnet_tau = 0.00130456768
magnet_reverse = 1
anneal_magnet_coef = 0
[sweep]
# skill = BB/hand vs the bots + 2 * card_sense (ocean/poker/poker.h). Score alone picks card-blind
# aggression: gen0 wins +2.5 BB/hand vs Range and Rules while playing every hand alike.
metric = panel_worst
goal = maximize
max_runs = 500
downsample = 1
max_suggestion_cost = 3600
history_path = leagues/poker/gen3/sweep.history

# --- searched (ranges widened 2026-10-23 where the mega sweep's best trials sat on a bound) ---
[sweep.train.learning_rate]
distribution = log_normal
min = 0.00003
max = 0.003
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.1
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = log_normal
min = 0.001
max = 1
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.6
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.1
max = 2
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 1
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.1
max = 3
scale = auto

# Pinned at 256x3 for gen3 (user: start at 256). The league manifest (leagues/poker/gen3/empty.txt) must match.
[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 256
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 3
max = 3
scale = auto

# --- also searched (ranges keep every batch layout valid: agents*horizon >= max minibatch) ---
[sweep.train.gamma]
distribution = uniform
min = 0.9
max = 1.0
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 32768
scale = auto

[sweep.train.vf_clip_coef]
distribution = log_normal
min = 0.05
max = 2
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.8
max = 0.99
scale = auto

# --- EMAgnet (magnet KL toward an EMA of the learner) ---
[sweep.train.magnet_coef]
distribution = log_normal
min = 0.001
max = 1
scale = auto

[sweep.train.magnet_tau]
distribution = log_normal
min = 0.0001
max = 0.1
scale = auto

[sweep.train.magnet_reverse]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.anneal_magnet_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

# --- budget: training length is swept too (user, 27 Oct) ---
[sweep.train.total_timesteps]
distribution = log_normal
min = 100000000
max = 1000000000
scale = auto


num_buffers = 1