[base]
# gen12 (2026-11-05): gen11 with the lessons of lineup.c (duplicate six-max evaluation, reports/poker_gen11/
# RESEARCH_NOTES.md). Bots: range and Fullhouse only (trapper, tight, maniac, station, rules out: donors or nits that
# teach loose play), no panel tables. Deeper stacks: sessions start at 20-500 BB and a seat leaves above 600 BB (the
# compact chip limit), so deep play (the web table reaches 600 BB) is in training. Frozen league and score field: the strongest gen11 trials
# and gen10. Score: money only, against strong opponents. Defaults: gen11 trial 9 (+40 BB/100 vs the strong field, the
# best). Sweep: length up to 4B steps, trial cost cap 10 h. Build: -DPOKER_ZS_CRITIC -DPOKER_FULLHOUSE_MODEL.
# gen11 (2026-11-04): league of models with few bots. Position inputs (seat from the button, players to act, players in
# the pot), the zero-sum critic build (-DPOKER_ZS_CRITIC) with seat occupants, 5% rake, PFSP over frozen gen10-era
# models + the run's own snapshots (half the model seats are the newest), bots only range / tight / trapper at 15% of
# league seats, 5% panel tables. Sweep from these defaults, training length included. Previous: gen10 below.
# gen10 (2026-10-30): 1024x2 from scratch, started deliberately high (32,768 agents x horizon 32, minibatch 32,768,
# LR 0.003 with the EMAgnet), the floors low enough for Protein to come down (agents >= 2,048); replay_ratio pinned 1.
# Probe (RTX 5060 Ti 16 GB): 32,768 agents 459K SPS, 11 GB; 65,536 agents runs the league GPU state out of memory, so
# 32,768 is the ceiling; minibatch 65,536 used 14.1 GB and ran out of memory in sweep trial 17, so 32,768 is its cap.
# Live pool of the run's own snapshots + 20% bots + 20% panel tables + 20% state-set hands, reward_scale 0.01.
# Metric poker_score (ocean/poker/poker.h, 2026-11-05): BB/hand vs the frozen models + range/tight/trapper tables. Steps >= 500M. Previous: config/poker.ini.gen8.
env_name = poker
seed = 73
checkpoint_interval = 20
# Post-training eval on fewer tables: at 32,768 agents it rebuilt the league GPU state on top of the training run's
# unfreed league buffers and ran out of memory (gen10 sweep trial 0, after all 1B steps).
eval_agents = 4096
# gen11: 100,000 hands (10,000 left ~0.1 BB/hand of noise in the score), at the [score_eval] tables below.
eval_episodes = 100000
# gen4 (2026-10-28, poker box 58025673): gen3 trial 0's recipe (the sweep's best was its own center point, these
# defaults) plus the trapper bot (id 11) as opponent and panel type, and state sets: env.state_fraction of hands start
# from a stored mid-hand spot (ocean/poker/states.h, gen_states.c) to break the shove-or-fold loss minimization.
# A/B: the same run with state_fraction = 0. Previous: config/poker.ini.gen3_sweep.
# gen3 sweep (2026-10-27, poker box 58025673): cash tables, 256x3 from scratch. Stacks carry over 200-hand sessions
# with random depths (20-250 BB, rebuy on bust, leave above 500 BB); opponents: all five bot styles, ramping to the
# trial's own snapshots (league_pool_dir = auto); 20% panel tables; score panel_worst. 500 trials, replay pinned to 1.
# Previous: config/poker.ini.gen2_sweep. gen2 sweep (2026-10-26): from gen1 (leagues/poker/gen1/gen1.bin), vs a fixed league (gen1 + 15 snapshots of its self-play
# history, leagues/poker/gen2/opponents.txt) and all five bot types (Rules, Range, maniac, station, tight), 20% panel
# tables; score panel_worst (BB/hand vs the hardest bot type). Earlier: gen1 sweep, from scratch. The observation gained card features (ocean/poker/core.h
# POKER_CARD_FEATURES), so gen0 (106 inputs) cannot be loaded. The gen0 league sweep config is
# config/poker.ini.gen0_league_sweep.
load_model_path = None
async = 1
cudagraphs = 1

[vec]
total_agents = 4096
# gen11: 2 buffers, so one buffer's frozen-model rounds overlap the other's step (263K vs 204K SPS, TF32 league).
num_buffers = 2
num_threads = 24
num_policies = 1
hist_policy_percent = 0

[policy]
hidden_size = 1024
num_layers = 2

[env]
# Panel tables: this share of tables seats five copies of one panel bot (rules, range, maniac, station, tight, trapper); logged as panel_<type> and panel_worst.
# gen11 (2026-11-04): 0.05, kept as the bot score; the weak bots barely train the learner any more.
# gen12: 0 (panel tables cycle all six panel bots, donors included).
panel_fraction = 0
num_agents = 1
num_players = 6
# House rake (2026-11-04, ocean/poker/core.h): 5% of the contested pot, capped at 3 BB, no flop no drop (a hand that
# ends before the flop without a showdown is not raked unless rake_preflop = 1). The reward already pays it.
rake = 0.05
rake_cap_bb = 3
rake_preflop = 0
# Zero-sum critic builds only (-DPOKER_ZS_CRITIC): 1 hides opponents' hole cards from the critic (ablation).
critic_hide_cards = 0
starting_stack = 20000
# Cash sessions (ocean/poker/poker.h): stacks carry over this many hands; depth uniform in [stack_min_bb, stack_max_bb]
# at each session start, after a bust and above stack_cap_bb. 0 = fresh starting_stack every hand (gen0-gen2).
session_hands = 200
stack_min_bb = 20
stack_max_bb = 500
# gen12: 600 (compact trainer chips assert cap <= 600 BB; deeper needs a -DPOKER_WIDE_CHIPS trainer, untested).
stack_cap_bb = 600
bot_policy = 7
# Active IDs: 1 rules control, 4 Fullhouse, 7 range. Zero uses bot_policy;
# otherwise bit i enables policy i once per seat. 146 mixes all three.
# gen1: each opponent seat is Rules or Range (130), no frozen networks.
# gen4: 3970 = rules, range, maniac, station, tight, trapper (1922 in gen3, without trapper).
# gen11 (2026-11-04): 3200 = range, tight, trapper, the bots we still lose to. The learner's own newest snapshot
# plays the maniac's part; station (+70 BB/hand) taught nothing.
# gen12: 144 = range + Fullhouse (needs -DPOKER_FULLHOUSE_MODEL), the two bots that hold their own against strong
# models (about +24 BB/100 each in lineup.c tables; trapper -62, maniac -1723, station -3140).
native_baseline_mask = 144
# 0 uses the build default. 32, 64 and 128 choose the range sampling budget.
equity_samples = 0
# Public table statistics persist across hands; only the range policy uses them.
native_history = 0
seed = 73
# gen0 league: each opponent seat is the range bot (bot_policy 7) with probability rules_fraction,
# otherwise gen0 (leagues/poker/gen0). Frozen opponents run on CPU, so all trainer rows are learner rows.
# gen11: gen10 sweep trials 7 and 9 and the critic A/B's two 2B models (all 175 inputs, before the position block).
native_league = leagues/poker/gen12/league.txt
# 1: league seats run as one batched GPU forward per round (ocean/poker/poker.h); 0: inline on CPU.
league_gpu = 1
# 1: frozen bank GEMMs on TF32 tensor cores (ocean/poker/poker.h env.league_tf32); 0: fp32, bit-comparable with CPU.
league_tf32 = 1
# Live pool: this run's checkpoint directory; each new checkpoint joins the opponent pool (up to 128, oldest
# replaced). Needs league_gpu = 1 and a native_league manifest (it may list 0 banks).
league_pool_dir = auto
# Live pool: opponents come from this many snapshots at a time (the newest plus a random sample, redrawn every
# 20 s), which keeps the GPU league fast as the pool grows.
league_active = 8
# Live pool slots in all, manifest banks included (each new snapshot replaces the oldest snapshot once full). gen11:
# 40 (1 GB of GPU weights at 1024x2; 128 slots ran a 32,768-agent trial's final eval out of memory).
league_pool_max = 40
# PFSP (gen11): BB/hand scale of the win-probability sigmoid; model seats lean (1 - p)^2 toward the banks the learner
# loses to (0 = uniform). league_newest: share of model seats that always take the newest snapshot (self-play).
league_pfsp = 2
league_newest = 0.5
# Live pool ramp: the bot share of opponent seats falls from 1 to rules_fraction as the pool grows to this many
# snapshots (0 = off).
# gen11: 0, the manifest's frozen models fill the model seats from the start.
league_ramp = 0
# Bot share of opponent seats at league tables (gen11: 0.15, the rest are models).
rules_fraction = 0.15
# State sets (ocean/poker/states.h): a file from gen_states.c and the share of non-panel hands that start from one of
# its states (learner to act, reward from the restore point; logged as state_bb and state_share). None = off.
# gen11: None (states_gen10.bin was lost with box 57608917; gen4's A/B found no gain from state sets).
state_file = None
state_fraction = 0.2
# Training reward = BB won x reward_scale (logs stay in BB). 1 = raw BB (gen0-gen4); see ocean/poker/poker.h.
reward_scale = 0.01

# Sweep score eval (gen11, 2026-11-04; ocean/poker/poker.h poker_configure): a sweep trial's final eval swaps these
# [env] values in, so poker_score's league_bb is BB/hand against the same 8 frozen 1024x2 models for every trial
# (4 from the training manifest, 4 never trained against), no bots or own snapshots at those tables; 20% panel tables
# keep the bot floor. Manual ./puffer eval runs are not affected.
[score_eval]
native_league = leagues/poker/gen12/score.txt
league_pool_dir = None
league_pfsp = 0
league_newest = 0
league_ramp = 0
# gen12: strong opponents only. 30% of opponent seats range or Fullhouse, the rest the frozen models; no panel tables;
# fixed 100 BB stacks every hand (lineup.c's setting), so the score is skill, not a session's swings.
rules_fraction = 0.3
native_baseline_mask = 144
panel_fraction = 0
session_hands = 0
starting_stack = 10000
state_fraction = 0

[selfplay]
# Native acting-opponent banks are frozen per stint by ocean/poker/league.py.
# Keep the trainer's simultaneous-row selfplay pool off for this adapter.
enabled = 0

[train]
# gen12 defaults: gen11 sweep trial 9 (sweep_1793867274085_0009), the best against the strong field.
# gen1 sweep: trial 0 is the gen0 recipe (mega-sweep trial 99, LR/entropy/magnet annealing on), from scratch
# with card features against Rules + Range bots.
total_timesteps = 600000000
anneal_lr = 1
learning_rate = 0.00186846
gamma = 0.939739
gae_lambda = 0.830311
reward_clip = 0
horizon = 32
minibatch_size = 8192
replay_ratio = 1
clip_coef = 0.578892
vf_clip_coef = 0.0646777
vf_coef = 1.48237
max_grad_norm = 0.151931
momentum = 0.977242
ent_coef = 0.000107935
anneal_ent_coef = 1
min_ent_coef_ratio = 0.00276553
magnet_coef = 0.0240869
magnet_tau = 0.0354555
magnet_reverse = 0
anneal_magnet_coef = 1
[sweep]
# gen11: no early stopping; a trial still behind strong frozen models at 30% of its steps can finish well.
early_stop_quantile = 0
# skill = BB/hand vs the bots + 2 * card_sense (ocean/poker/poker.h). Score alone picks card-blind
# aggression: gen0 wins +2.5 BB/hand vs Range and Rules while playing every hand alike.
metric = poker_score
goal = maximize
max_runs = 500
downsample = 1
max_suggestion_cost = 36000
history_path = leagues/poker/gen12/sweep.history

# --- searched (ranges widened 2026-10-23 where the mega sweep's best trials sat on a bound) ---
[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.01
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.1
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = log_normal
min = 0.001
max = 1
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.6
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.1
max = 2
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 1
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.1
max = 3
scale = auto

# Pinned at 256x3 for gen3 (user: start at 256). The league manifest (leagues/poker/gen3/empty.txt) must match.
[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 1024
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 2
max = 2
scale = auto

# --- also searched (ranges keep every batch layout valid: agents*horizon >= max minibatch) ---
[sweep.train.gamma]
distribution = uniform
min = 0.9
max = 1.0
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 2048
max = 16384
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 64
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 32768
scale = auto

[sweep.train.vf_clip_coef]
distribution = log_normal
min = 0.05
max = 2
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.8
max = 0.99
scale = auto

# --- EMAgnet (magnet KL toward an EMA of the learner) ---
[sweep.train.magnet_coef]
distribution = log_normal
min = 0.001
max = 1
scale = auto

[sweep.train.magnet_tau]
distribution = log_normal
min = 0.0001
max = 0.1
scale = auto

[sweep.train.magnet_reverse]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.anneal_magnet_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

# --- budget: training length is swept too (user, 27 Oct) ---
[sweep.train.total_timesteps]
distribution = log_normal
min = 500000000
max = 4000000000
scale = auto


num_buffers = 1