# Cretaceous locomotion mode: a physics ragdoll of a dinosaur learns to walk by
# imitating its walk clip (ocean/cretaceous/loco/, docs: ocean/cretaceous/docs/locomotion/README.md).
#
# The trainer always reads config/cretaceous.ini for the cretaceous env, so this
# file is applied on top of it as command-line overrides by
#   ocean/cretaceous/loco/train.sh            (builds with NVCC_EXTRA=-DCRET_LOCO and trains)
# Every key below is passed as --section.key=value; anything after the script's
# arguments overrides these again (for example --train.total_timesteps=1e8).

[base]
checkpoint_interval = 50
eval_episodes = 256

[vec]
# 64 envs of 64 ragdolls; each env is one Box3D world stepped on one thread.
total_agents = 4096
num_buffers = 2
num_threads = 8

[env]
dino = ocean/cretaceous/assets/dinos/raptor.dino
clip = walk
num_agents = 64
policy_hz = 30
sim_hz = 120
substeps = 4
episode_seconds = 15
# Residual action scale (radians) around the clip's pose.
action_scale = 0.5
# Imitation reward: weights (sum to 1) and scales of exp(-k * error) (DeepMimic's values).
reward_pose = 0.65
reward_vel = 0.1
reward_ee = 0.15
reward_com = 0.1
k_pose = 2
k_vel = 0.1
k_ee = 40
k_com = 10
# PD springs (Box3D joint springs): stiffness in Hz, damping ratio.
hertz_leg = 100
hertz_body = 60
hertz_tail = 40
damping = 1
# 1: the tail has no actions, only springs toward its mean pose (the passive-tail experiment).
passive_tail = 0
hertz_passive_tail = 20
damping_passive_tail = 0.4
friction = 0.9
# Fallen when the pelvis drops below this share of the clip's pelvis height.
fall_height = 0.5

[policy]
# The game's structured encoder reads the game's observations; loco mode needs the default one.
cretaceous_net = 0
hidden_size = 512
num_layers = 2

[train]
# DeepMimic trained its skills with ~60-150 M samples per skill at gamma 0.95 (README, "Training").
total_timesteps = 300_000_000
learning_rate = 0.0003
gamma = 0.95
gae_lambda = 0.95
horizon = 64
minibatch_size = 32768
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 0.5
max_grad_norm = 0.5
# Continuous actions: entropy comes from the learned log std; a bonus only inflates it.
ent_coef = 0.0
