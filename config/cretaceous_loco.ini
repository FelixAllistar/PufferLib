# Cretaceous locomotion mode: a physics ragdoll of a dinosaur learns to walk by
# imitating its walk clip (ocean/cretaceous/loco/, docs: ocean/cretaceous/docs/locomotion/README.md).
#
# ocean/cretaceous/loco/train.sh builds the trainer with -DCRET_LOCO and the env
# name cretaceous_loco, so the trainer reads config/default.ini and then this
# file (not config/cretaceous.ini). Command-line --section.key=value arguments
# override it as usual (for example --train.total_timesteps=1e8).

[base]
seed = 42
checkpoint_interval = 50
eval_episodes = 256

[vec]
# 64 envs of 64 ragdolls; each env is one Box3D world stepped on one thread.
# Physics is the bottleneck (about 3,300 agent steps/s per core on the raptor),
# so set num_threads to the cores the machine really has (4 on Felix's desktop).
total_agents = 4096
num_buffers = 2
num_threads = 4

[env]
dino = ocean/cretaceous/assets/dinos/raptor.dino
clip = walk
num_agents = 64
policy_hz = 30
sim_hz = 120
substeps = 4
episode_seconds = 15
# Residual actions around the clip's pose: action_unit radians per policy
# output unit (the trainer's initial noise is std 1, so this is the starting
# exploration), clamped to +-action_scale radians.
action_scale = 0.5
action_unit = 0.1
# Imitation reward: weights (sum to 1) and scales of exp(-k * error) (DeepMimic's, except k_ee and the COM term).
reward_pose = 0.65
reward_vel = 0.1
reward_ee = 0.15
reward_com = 0.1
k_pose = 2
k_vel = 0.1
# k_ee: DeepMimic's 40 suits a 1.7 m human; on the 3 m raptor (head and tail tip far
# from the pelvis) 19 cm of error already scored 0.003, so 10. k_com is per (m/s)^2:
# the COM term compares velocities (loco_env.h, loco_com_vel).
k_ee = 10
k_com = 10
# PD springs (Box3D joint springs): stiffness in Hz, damping ratio.
hertz_leg = 100
hertz_body = 60
hertz_tail = 40
damping = 1
# 1: the tail has no actions, only springs toward its mean pose (the passive-tail experiment).
passive_tail = 0
hertz_passive_tail = 20
damping_passive_tail = 0.4
friction = 0.9
# Fallen when the pelvis drops below this share of the clip's pelvis height.
fall_height = 0.5
# Joints the clips move less than this (rad) are welded to their parents; 0 keeps every joint.
weld_range = 0.035
# Tail joints kept from the base; the segments beyond are welded into one rigid
# rod (0 keeps them all). A raptor's tail is flexible at the base and stiffened
# by bony rods beyond; the full chain of ever lighter segments whips (its tip
# spun at ~1000 deg/s against the clip's 40 with the passive tail).
tail_flex = 0
# The tail's springs this many times stiffer at the tip than at the base (1: even).
tail_stiffen = 1
# Shoves (0: none): a push every push_interval seconds on average, at a random
# heading, on the pelvis, spine or chest for push_seconds, changing the whole
# animal's speed by push_min..push_max m/s. The policy learns to recover into
# its clip; tools/loco_bake.c bakes the recoveries into game clips.
push_interval = 0
push_min = 0.5
push_max = 1.5
push_seconds = 0.1

[policy]
# The game's structured encoder reads the game's observations; loco mode needs the default one.
cretaceous_net = 0
# Network size is fixed, never swept: 64x2 (Felix, 2026-11-17).
hidden_size = 64
num_layers = 2

[train]
# PufferLib 5.0's optimizer wants learning rates near 1e-2, not Adam's 3e-4: run 1
# (2026-11-17, 300M steps at 3e-4, gamma 0.95) learned nothing (up 1.2 s, as the
# untrained baseline). These are config/drone.ini's swept values (also 64x2,
# continuous); in 40M steps they took the raptor from 0.7 s to 1.7 s up, still rising.
total_timesteps = 300_000_000
learning_rate = 0.0087
gamma = 0.99
gae_lambda = 0.99
momentum = 0.884
horizon = 64
minibatch_size = 32768
replay_ratio = 1.0
clip_coef = 0.32
vf_coef = 0.35
vf_clip_coef = 4.1
max_grad_norm = 0.5
# Continuous actions: entropy comes from the learned log std; a bonus only inflates it.
ent_coef = 0.0

[sweep]
metric = perf

# The house rules pin these in every sweep: replay ratio 1 and a fixed network.
[sweep.train.replay_ratio]
min = 1
max = 1

[sweep.policy.hidden_size]
min = 64
max = 64

[sweep.policy.num_layers]
min = 2
max = 2
