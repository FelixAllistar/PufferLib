[train]
total_timesteps = 100_000_000
# Best completed 4.0 optimizer sweep: xs4faggx, perf=117.0311.
gamma = 0.994740046877038
learning_rate = 0.001313852466215362
minibatch_size = 4096
ent_coef = 0.005669198753967953
anneal_ent_coef = 0
min_ent_coef_ratio = 0.15729385341148264

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_suggestion_cost = 1200
max_runs = 8
gpus = 1
downsample = 20
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

[sweep.train.gamma]
distribution = logit_normal
min = 0.97
max = 0.9999
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.005
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 65536
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.02
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = log_normal
min = 0.005
max = 0.5
scale = auto
