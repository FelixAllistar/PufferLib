[base]
env_name = abyss

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 4
gpu_env = 0
action_mask_size = 397

[policy]
hidden_size = 128
num_layers = 2

[env]
max_steps = 1200
# Weather mapping: 0 Dark, 1 Electrical, 2 Exotic, 3 Firestorm, 4 Gamma.
filament_tier = 0
weather_type = 0
boundary_radius = 100000
boundary_damage = 150

# Resolved ship profile: all values are final, post-skill/post-fit attributes.
# See ocean/abyss/SHIP_PROFILE.md before adapting this block to another fit.
# Physics are deterministic; only observed position age is randomized for latency.
ship_mass_kg = 1650000
prop_mass_addition_kg = 500000
inertia_modifier = 2.2132
base_speed = 306
prop_speed = 1545.8
distance_observation_lag_min_ticks = 0
distance_observation_lag_max_ticks = 2

ship_shield_hp = 735
ship_armor_hp = 1080
ship_hull_hp = 920
shield_resist_em = 0.00
shield_resist_thermal = 0.20
shield_resist_kinetic = 0.40
shield_resist_explosive = 0.50
armor_resist_em = 0.50
armor_resist_thermal = 0.35
armor_resist_kinetic = 0.25
armor_resist_explosive = 0.20
hull_resist_em = 0.33
hull_resist_thermal = 0.33
hull_resist_kinetic = 0.33
hull_resist_explosive = 0.33
cap_capacity = 717
cap_recharge_time = 227
signature = 62
prop_signature_multiplier = 6
scan_resolution = 578
lock_range = 33000

# Eight grouped pulse lasers. Activation cost is per turret, per cycle.
weapon_volley = 537
weapon_cycle = 2.2008
weapon_count = 8
weapon_cap_cost_each = 2.64
weapon_optimal = 15900
weapon_falloff = 2880
weapon_tracking = 276
weapon_damage_em = 0.8181818182
weapon_damage_thermal = 0.1818181818
weapon_damage_kinetic = 0
weapon_damage_explosive = 0

# Repair layer: 0 shield, 1 armor, 2 hull.
# Effect timing: 0 cycle start (shield booster), 1 cycle end (armor repairer).
rep_layer = 1
rep_effect_timing = 1
rep_amount = 79
rep_cycle = 4.8
rep_cap_cost = 40

# 5MN Y-T8 Compact MWD, resolved to 4.05 GJ/s over a 10-second cycle.
prop_cycle = 10
prop_cap_cost = 40.5
# Train rewards. Completion of all three rooms and looting all three caches
# dominates speed; speed remains only a small tie-breaker.
reward_hostile_kill = 0.3054794553108046
reward_cache_kill = 0.1548603940718151
reward_loot = 1.1276229448541502
reward_room_clear = 0.7554667084904679
reward_success = 25
reward_completion_speed = 0.1
reward_failure = -25
reward_wasted_rep = -0.25
reward_invalid_loot = -0.0042195486840792
reward_cargo_open = -0.009698312082327902
reward_step = -0.001
reward_pointer_action = -0.005
# Module toggles themselves are neutral. Necessary actions earn their value from
# damage, repair, movement, and completion; capacitor is their shared cost.
# reward_cap_spent is the cost of spending one complete 717 GJ capacitor pool.
reward_cap_spent = -0.25
# Below this reserve, apply a quadratic per-second penalty. At zero capacitor the
# full reward_low_cap value applies; at the threshold it is zero.
cap_reserve_fraction = 0.30
reward_low_cap = -0.02

[train]
total_timesteps = 600_000_000
# Best completed 4.0 optimizer sweep: xs4faggx, perf=117.0311.
gamma = 0.994740046877038
learning_rate = 0.001313852466215362
minibatch_size = 4096
ent_coef = 0.005669198753967953
anneal_ent_coef = 0
min_ent_coef_ratio = 0.15729385341148264

[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_suggestion_cost = 1200
max_runs = 24
gpus = 1
downsample = 20
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.998
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0005
max = 0.0025
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.008
scale = auto
