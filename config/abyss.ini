[base]
env_name = abyss
# Keep the trainer's existing evaluation path, but do not spend 10,000 episodes
# on the built-in post-train check. Standalone eval can override this explicitly.
eval_episodes = 100
load_model_path = latest
[vec]
total_agents = 512
num_buffers = 4
num_threads = 4
num_policies = 1

[selfplay]
enabled = 0

[policy]
hidden_size = 128
num_layers = 2

[env]
# Shared observation ABI v2 and NPC mechanics for every supported tier.
observation_version = 2
cap_neut_resistance = 0.22
prop_is_mwd = 0
encounter_archetype = -1
episode_logs = 0
ewar_strength_variation = 0.1
ewar_activation_probability = 0.9
ewar_sensor_dropout_probability = 0.05
max_steps = 1200
scenario_episode = -1
# Emit one compact stderr record per failed episode for controlled diagnosis.
debug_failures = 0
# Uniform empirical templates: old hard indices came from a different Dark fit.
# Balance 30/50% Electrical for robustness, not as an estimated live frequency.
hard_scenario_probability = 0
weather_high_penalty_probability = 0.5
# Weather mapping: 0 Dark, 1 Electrical, 2 Exotic, 3 Firestorm, 4 Gamma.
filament_tier = 0
weather_type = 1
boundary_radius = 100000
boundary_damage = 150

# Resolved ship profile: all values are final, post-skill/post-fit attributes.
# See ocean/abyss/SHIP_PROFILE.md before adapting this block to another fit.
# Physics are deterministic; only observed position age is randomized for latency.
ship_mass_kg = 1190000
prop_mass_addition_kg = 500000
inertia_modifier = 2.3171
base_speed = 426
prop_speed = 969.53
distance_observation_lag_min_ticks = 0
distance_observation_lag_max_ticks = 2

ship_shield_hp = 367
# Final passive shield recharge time after Shield Operation skills.
shield_recharge_time = 531
ship_armor_hp = 600
ship_hull_hp = 517
shield_resist_em = 0
shield_resist_thermal = 0.20
shield_resist_kinetic = 0.40
shield_resist_explosive = 0.50
armor_resist_em = 0.65
armor_resist_thermal = 0.54
armor_resist_kinetic = 0.47
armor_resist_explosive = 0.44
hull_resist_em = 0.33
hull_resist_thermal = 0.33
hull_resist_kinetic = 0.33
hull_resist_explosive = 0.33
cap_capacity = 611
cap_recharge_time = 136
signature = 37
prop_signature_multiplier = 1
scan_resolution = 704
lock_range = 27500

# Punisher: four Small Focused Beam Laser II with Imperial Navy Xray S.
# Screenshot provenance/rounding: ocean/abyss/PUNISHER_ELECTRICAL_INTAKE.md.
# Cycle estimated from displayed group volley/DPS; gun UI shows rounded 3.0 s.
# Activation cost is resolved per turret, per cycle (do not apply ammo bonus twice).
weapon_volley = 433
weapon_cycle = 3.0322
weapon_count = 4
weapon_cap_cost_each = 3.25
weapon_optimal = 11880
weapon_falloff = 2875
weapon_tracking = 124.20
weapon_damage_em = 0.60
weapon_damage_thermal = 0.40
weapon_damage_kinetic = 0
weapon_damage_explosive = 0

# Repair layer: 0 shield, 1 armor, 2 hull.
# Effect timing: 0 cycle start (shield booster), 1 cycle end (armor repairer).
rep_layer = 1
rep_effect_timing = 1
rep_amount = 119.59
rep_cycle = 4.8
rep_cap_cost = 40

# 1MN Y-S8 Compact Afterburner: 14 GJ per 8.5-second cycle.
prop_cycle = 8.5
prop_cap_cost = 14
# Puffer clips each learner-visible step reward to [-1, 1]. Keep the terminal
# success tick at or below +1 and every failure at -1 so dashboard returns and
# PPO optimize the same hierarchy: survival/completion first, then all caches,
# then speed and efficiency.
reward_hostile_kill = 0.04
reward_cache_kill = 0.05
reward_loot = 0.07
reward_room_clear = 0.3
reward_success = 0.6
reward_completion_speed = 0.25
reward_failure = -1
reward_wasted_rep = 0
# A repairable low layer under active threat becomes quadratically urgent. The
# penalty is negligible near this threshold and reaches its configured magnitude
# near zero HP, avoiding both a reward cliff and excessive early repair cycling.
rep_urgency_fraction = 0.60
reward_rep_idle_urgent = 0
reward_invalid_loot = -0.001
reward_cargo_open = -0.001
reward_step = 0
reward_pointer_action = 0
# Capacitor is already a physical constraint on weapons, repair, propulsion, and
# survival. Do not tax useful cycles or reward waiting by charging it again here.
reward_cap_spent = 0
cap_reserve_fraction = 0.30
reward_low_cap = 0
# Once all room requirements are complete, activating a conduit auto-approaches it.
# Waiting is mildly wasteful between rooms and strictly wasteful at the final exit.
reward_gate_ready_idle = 0
reward_final_gate_ready_idle = 0
# Any locked damageable target with enough capacitor is ready to receive damage.
# Penalize leaving the weapon intentionally idle, including the cache and no-intent
# states. Hostile-only combat diagnostics remain separate.
reward_weapon_idle_ready = 0

[train]
reward_clip = 1
# Fresh 100M trials with NPC repair. Extend the chosen trial for final training.
total_timesteps = 50000000
gamma = 0.997255921
learning_rate = 0.0000230384851
anneal_lr = 1
replay_ratio = 1
minibatch_size = 4096
horizon = 512
ent_coef = 0.000943052641
anneal_ent_coef = 1
min_ent_coef_ratio = 0.01
gae_lambda=.995
[sweep]
metric = perf
metric_distribution = linear
goal = maximize
max_suggestion_cost = 1200
max_runs = 24
gpus = 1
downsample = 20
prune_pareto = 1
early_stop_quantile = 0.3

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 512
max = 1024
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 4096
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 2.0
scale = auto

# Fixed trial budget must equal train.total_timesteps (native sweep requirement).
[sweep.train.total_timesteps]
min = 50000000
max = 50000000

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 128
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00003
max = 0.001
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.01
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.995
max = 0.9995
scale = auto

# Keep remaining PPO/optimizer settings fixed; do not sweep ship physics/rewards.
[sweep.train.gae_lambda]
min = 0.90
max = 0.90

[sweep.train.clip_coef]
min = 0.2
max = 0.2

[sweep.train.vf_clip_coef]
min = 0.2
max = 0.2

[sweep.train.vf_coef]
min = 2.0
max = 2.0

[sweep.train.max_grad_norm]
min = 1.5
max = 1.5

[sweep.train.momentum]
min = 0.95
max = 0.95
