[base]
env_name = ptcg
checkpoint_dir = /puffertank/docker/kaggle-ptcg/models/checkpoints
log_dir = /puffertank/docker/kaggle-ptcg/logs/puffer

[vec]
total_agents = 512
num_buffers = 1
num_threads = 4
num_frozen_banks = 1
frozen_bank_pct = 0.25

[selfplay]
enabled = 0
max_size = 20
swap_winrate = 0.6
min_games = 16
elo_init = 0
elo_k = 16
seed = 0
snapshot_interval = 5000000
opp_timeout_steps = 20000000
registry_file = /puffertank/docker/kaggle-ptcg/opponents/registry.json
# Seed frozen banks from learned opponents in the registry.
# Use "same_deck" for compatible saved agents with deck_id == env.player_deck,
# "all" for every compatible saved agent, or explicit registry names/paths.
initial_opponent_names = same_deck
initial_same_deck_only = 1
# Extra explicit checkpoint/model paths or names, separated by spaces/commas/semicolons.
initial_opponents =
# Optional glob(s), e.g. /puffertank/docker/kaggle-ptcg/models/checkpoints/ptcg/run/*.bin
initial_opponent_glob =

[env]
# Learner/submission deck.
# 2/3/4 = original public decks. 5 = Dragapult. 6 = Crustle. 7 = Alakazam.
# 8/9 = Abomasnow variants. 10/11/12 = Lucario variants. 13 = Iono generic.
# 15 = Fire Charizard X Trolley test deck.
# 0/14 are sample/debug decks, not production defaults.
player_deck = 2
# -1 = curated mixed pool, no random/sample: exact 2/3/4 weighted + generic 5/6/7/9/10/11.
# -2 = legacy exact pool: 2/3/4 only. Useful for testing a new player deck against the old gauntlet.
# -3 = new generic pool: 5/6/7/9/10/11/12 only.
# -4 = meta generic pool: 5/6/7/13 only.
# -100 = native same-deck neural selfplay / frozen-bank league mode.
# 0 = starter random debug opponent only.
# 2/3/4 = exact Kiyota native scorer ports.
# 5+ = deck ports using the deterministic generic public scorer unless noted above.
# 15 = Fire Charizard X Trolley generic opponent, selectable but not in default pools.
opponent = -1
# Custom weighted rule-opponent pool used when opponent = -99.
# Use --env.opponent-pool-N and --env.opponent-weight-N from the GUI/CLI.
# Zero or negative weights are ignored. Empty custom pools fall back to the old mixed pool.
opponent_pool_0 = 2
opponent_weight_0 = 1.0
opponent_pool_1 = 3
opponent_weight_1 = 1.0
opponent_pool_2 = 4
opponent_weight_2 = 1.0
opponent_pool_3 = 6
opponent_weight_3 = 1.0
opponent_pool_4 = 0
opponent_weight_4 = 0.0
opponent_pool_5 = 0
opponent_weight_5 = 0.0
opponent_pool_6 = 0
opponent_weight_6 = 0.0
opponent_pool_7 = 0
opponent_weight_7 = 0.0
# Prize-taking attack bonus used for PPO reward shaping. Set 0 to disable.
ko_attack_reward = 0.05
# If enabled, legal action masks are narrowed to KO-taking attacks when one is available.
# This is a tactical rules prior, not reward shaping. Keep disabled for pure-policy runs.
ko_attack_mask = 0.0

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1
model_type = 0
option_embed_size = 64

[torch]
policy = PTCGPointerPolicy

[train]
total_timesteps = 20_000_000
learning_rate = 0.001
minibatch_size = 8192
horizon = 64
ent_coef = 0.02
gamma = 0.998
gae_lambda = 0.96

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_runs = 30
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
max_suggestion_cost = 3600
# Keep PTCG sweeps tight. The default Puffer config has a huge generic sweep
# space; this list prevents Protein from mutating irrelevant knobs.
sweep_only = total_timesteps,learning_rate,ent_coef,horizon,minibatch_size,gamma,gae_lambda,total_agents,num_buffers,ko_attack_reward,ko_attack_mask
match_enemy_model_path = ''
match_num_games = 1024
match_enemy_hidden_size = 0
match_enemy_num_layers = 0

[sweep.train.total_timesteps]
distribution = log_normal
min = 5_000_000
max = 50_000_000
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0002
max = 0.003
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.005
max = 0.08
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 64
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 8192
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.985
max = 0.9995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.85
max = 0.99
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 512
max = 4096
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 8
scale = auto

[sweep.env.ko_attack_reward]
distribution = uniform
min = 0.0
max = 0.10
scale = auto

[sweep.env.ko_attack_mask]
distribution = uniform
min = 0.0
max = 1.0
scale = auto
