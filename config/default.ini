[base]
env_name = None

# Multi-GPU (single GPU defaults)
rank = 0
world_size = 1
gpu_id = 0
gpu_offset = 0
nccl_id = 'None'
profile = False
checkpoint_dir = checkpoints
log_dir = logs
checkpoint_interval = 500
eval_episodes = 10000
num_games = 0
burnin_games = 0
eval_agents = 0
load_model_path = 'None'
load_enemy_model_path = 'None'
# Optional native match opponent architecture. Zero uses the primary policy.
enemy_hidden_size = 0
enemy_num_layers = 0
run_id = 'None'
result_fd = 0
wandb = False
slowly = False
# Evaluation entry points override this to 1 so native results match exported
# masked-argmax agents. It remains 0 for PPO data collection.
eval_deterministic = 0

# CUDA graphs (first real rollout/train use). >=0 enable, -1 disable.
cudagraphs = 1
seed = 73
# Multiplier on post-train eval length (default eval_epochs = train_epochs/2).
# >1 for longer eval / noise studies; 1 = default.
eval_epoch_mult = 1

# If true, zero RNN state every horizon (ablation). If false (default carry),
# state persists across horizons and resets only on terminal.
reset_every_horizon = 0

# Cleanba-style learner/actor pipelining: rollouts use a one-epoch-stale actor
# snapshot while the learner trains the previous horizon. Works with carry
# (reset_every_horizon=0) via per-slot initial_states.
async = 1

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16
num_frozen_banks = 0
# Required > 0 when num_frozen_banks > 0 (selfplay/match opponent arch).
frozen_bank_hidden_size = 0
frozen_bank_num_layers = 0
frozen_bank_pct = 0
action_mask_size = 0
gpu_env = 0
# Evaluation-only: alternate which seat is assigned policy bank zero inside
# each frozen-bank matchup group. Training leaves this disabled.
seat_balance = 0

# Selfplay-pool training. When enabled, frozen_bank_pct of environments (see
# [vec]) play against frozen opponents; the rest are live mirror selfplay.
# Frozen banks resample on fixed opp_timeout_steps intervals.
# At end of train, final policy is matched vs up to eval_pool_size opponents from
# the pool (mean A winrate becomes the sweep score when eval_games > 0).
[selfplay]
enabled = 0
max_size = 16
seed = 42
# Comma-separated checkpoints retained alongside the rolling history pool.
opponent_pool = 'None'
# Optional standalone league INI. Each enabled [policy.NAME] section provides
# path and train_weight; these are loaded natively without a comma list.
opponent_league = 'None'
# Optional comma-separated sampling weights aligned with opponent_pool.
opponent_pool_weights = 'None'
# Probability that a frozen-bank swap samples opponent_pool instead of history.
opponent_pool_prob = 0.5
# PFSP priority shape. Hard emphasizes low learner scores; variance emphasizes
# competitive matchups around 50% learner score.
pfsp_mode = 'hard'
# Prioritized fictitious self-play exponent. 0 disables payoff priority.
pfsp_alpha = 0
# Fraction of swaps sampled uniformly, bypassing payoff priority and explicit
# base weights so every opponent retains exploration probability.
pfsp_uniform_mix = 0
# EMA update rate for the recent payoff used by PFSP.
# Cumulative W/D/L and recent payoffs are written to the run's payoffs.tsv.
payoff_ema = 0.1
# Force an opponent swap if the current opponent has been active for this many
# global steps. 0 disables fixed-interval swapping.
opp_timeout_steps = 500_000_000
eval_pool_size = 8
eval_games = 0
# Fixed-panel sweep objective when eval_games > 0: winrate or money.
eval_metric = 'winrate'
eval_agents = 8192

# Persistent native population evaluation. Matrix mode evaluates every pair in
# policy_manifest; screen mode evaluates candidates against resident opponents.
[league]
mode = 'matrix'
policy_manifest = 'None'
candidate_manifest = 'None'
opponent_manifest = 'None'
output = 'None'
games = 16
# Screen mode only: raise games per opponent until the resident GPU batch has
# at least this many agents. Surplus agents run unique seeded games.
min_agents = 0
# Matrix mode only: evaluate pairs whose first manifest index is below this
# count. Zero evaluates the complete matrix. A caller can merge cached tail
# pairs to make population updates incremental.
focal_count = 0

# Args used by your env's binding.c go here
[env]
dr = 0
num_agents = 1
num_bots = 0
# Kaggriculture optionally uses this as discount-consistent dense shaping on
# normalized cash. Other environments ignore it. Zero preserves prior rewards.
reward_cash_scale = 0

[policy]
hidden_size = 128
num_layers = 4
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 10_000_000
learning_rate = 0.015
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
# Symmetric per-transition reward clamp. Positive values clamp to
# [-reward_clip, reward_clip]; zero disables clipping. Most legacy PufferLib
# environments are authored for [-1, 1], so preserve that default while
# allowing scale-sensitive economic environments to retain reward ordering.
reward_clip = 1.0
ent_coef = 0.001
emag_kl_coef = 0
# EMA update rate. Set to 0 with emag_kl_coef > 0 to keep a fixed reference
# policy (for example, a behavioral-cloning anchor).
emag_tau = 0.001
# Optional episode-progress prefix for a frozen magnet. Environments opt in by
# defining PUFFER_EPISODE_PROGRESS_OBS_INDEX; 1 preserves whole-game EMAg.
emag_cutoff = 1.0
# Cosine-anneal ent_coef like lr does. Off by default (matches old behavior).
# When on: ent_coef decays from its base value to min_ent_coef_ratio * ent_coef
# over total_timesteps. Useful late in training to let a learned policy commit
# harder on its preferences once the entropy bonus is no longer load-bearing.
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.95
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
epoch_sampling = 0

[sweep]
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 1200
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 1e11
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 16384
scale = auto

#[sweep.vec.num_buffers]
#distribution = uniform
#min = 1
#max = 8
#scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 512
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 65536
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

# Lower clip is sometimes better but less stable
[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.9
scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 4.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 1.5
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.prio_alpha]
distribution = uniform 
min = 0.0
max = 1.0
scale = auto

[sweep.train.prio_beta0]
distribution = uniform 
min = 0.0
max = 1.0
scale = auto
