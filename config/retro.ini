[base]
env_name = retro
async = 1
# Fresh-policy sweep. Set an explicit checkpoint here to fine-tune instead.
# Preserved remote parent: checkpoints/full_games/retro/1790504381476/0000000838860800.bin
load_model_path = None
checkpoint_dir = checkpoints/retro_balanced
log_dir = logs/retro_balanced
# Final weights plus their balanced-panel report; no rolling checkpoint pile.
checkpoint_interval = 0
eval_episodes = 0
cudagraphs = 1


[vec]
total_agents = 256
num_buffers = 4
num_threads = 16

[policy]
num_layers = 2
hidden_size = 256

[env]
#practice_replay = ocean/retro/practice/pipe_exit.inputs
# Verified World/NTSC ROM on the NTSC core. RTA = native frames / 60.0988139.
# Existing PAL-trained weights can warm-start; old timing results do not compare.
# Hold each action for four native frames; every frame is still emulated.
frameskip = 4
full_render = 0
idle_loop_skip = 1
# Native frames, NOT decisions: 30000 allows about 8m 19s at any frameskip.
max_frames = 30000
# Level transitions and castle completion pay once per source level/episode.
# The ROM continues naturally through flags, pipes, vines and wrong warps.
completion_reward = 2
# Pay on the SAME black-screen split shown by the viewer/dashboard.
# Completion speed shaping is disabled for exploration.
completion_on_rta_split = 1
completion_on_next_playable = 0
completion_time_bonus = 0
completion_time_min_frames = 0
completion_time_max_frames = 6000
# Once per 1-1 route segment: reset -> underground playable, then underground
# playable -> overworld playable. Extra = pipe_segment_bonus * clamp(1 - segment_frames/600,0,1).
# Already learned this route: do not pay early partial progress in this round.
pipe_segment_bonus = 0
pipe_segment_frames = 600
# Small penalty for failed attempts.
death_penalty = 0.05
checkpoint_distance = 128
checkpoint_reward = 0.125
score_scale = 0.0001
# All explicit reward components share reward_scale; no potential shaping.
# Idle penalties are per decision after idle_grace_decisions.
coin_reward = 0
idle_penalty = 0
idle_grace_decisions = 8
# Once per new playable destination within a level per episode, without timing.
# Starting areas/revisits do not pay. novel_areas logs the rewarded event count.
# Raw 1 = 0.0625 after reward_scale (eight checkpoint rewards).
novel_area_reward = 1
# Obsolete completion HUD TIME extra stays disabled.
completion_time_target_bonus = 0
# Episode-local checkpoint frontiers prevent repeat farming.
reward_scale = 0.0625
# All 32 starts are built and validated once; CSV/single levels also work.
spawn_levels = all
# One source level per episode, with natural lives and midpoint respawns.
# Evaluation pins equal attempts per level independently of training resets.
terminate_on_clear = 1
backend = quicknes
# Compiled ROM CPU with full-screen rendering.
cpu_backend = blocks
render_backend = wide
rom_path = ocean/retro/roms/smb1_ntsc.nes

[train]
gpus = 1
total_timesteps = 30000000
reward_clip = 0
# Trial-zero defaults; the broad fresh-policy search is below.
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.9999
gae_lambda = 0.997
replay_ratio = 2
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.001
anneal_ent_coef = 1
momentum = 0.9
minibatch_size = 4096
horizon = 256
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0

# Equal level weights, fixed per-attempt sampling seeds, first source-level clear.
# These controls are NOT swept. Training reward weights never enter the score.
[panel]
levels = all
repeats = 8
seed = 20260907
frames = 30000
frameskip = 4
workers = 16

[sweep]
metric = checkpoints
metric_distribution = linear
goal = maximize
max_runs = 500
gpus = 1
downsample = 1
max_suggestion_cost = 3600
prune_pareto = 1
early_stop_quantile = 0.3

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 128
max = 4096
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 64
max = 2048
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 65536
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.02
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.97
max = 0.99999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.85
max = 0.9999
scale = auto

[sweep.train.ent_coef]
distribution = uniform
min = 0
max = 0.02
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 8
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 2
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 4
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.base.async]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.base.cudagraphs]
distribution = int_uniform
min = -1
max = 1
scale = auto

[sweep.train.anneal_lr]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0
max = 0.5
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = uniform
min = 0
max = 0.5
scale = auto

[sweep.env.completion_reward]
distribution = log_normal
min = 0.25
max = 8
scale = auto

[sweep.env.death_penalty]
distribution = log_normal
min = 0.05
max = 5
scale = auto

[sweep.env.checkpoint_reward]
distribution = uniform
min = 0
max = 0.5
scale = auto

[sweep.env.novel_area_reward]
distribution = uniform
min = 0
max = 2
scale = auto

[sweep.env.completion_time_bonus]
distribution = uniform
min = 0
max = 4
scale = auto

[sweep.env.score_scale]
distribution = uniform
min = 0
max = 0.0002
scale = auto

[sweep.env.coin_reward]
distribution = uniform
min = 0
max = 0.2
scale = auto

[sweep.env.idle_penalty]
distribution = uniform
min = 0
max = 0.01
scale = auto

# Explicit fixed ranges also work on deployments without inherited sweep sections.
# To change trial length, change train.total_timesteps AND these two bounds.
[sweep.train.total_timesteps]
distribution = uniform
min = 30000000
max = 30000000
scale = auto

[sweep.policy.hidden_size]
distribution = uniform
min = 256
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 2
scale = auto
