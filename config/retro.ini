[base]
env_name = retro
async = 0
# OBS grew 160 -> 256 (glitch-capable RAM obs). Old 160-wide weights are
# incompatible, so start fresh until a 256-obs checkpoint exists.
load_model_path = None

[vec]
total_agents = 8192
num_buffers = 1
# 6 workers measured faster than 4 on a 4-core box for the fast backend
# (bench 4096: 43.6k vs ~22k env_steps/s with OMP_PROC_BIND=close).
# Worker teams are capped at vec.cpu_scale x online CPUs (default 1.5x
# when the key is absent). Raise cpu_scale to allow heavier
# oversubscription, or set it negative to use num_threads verbatim
# (no cap). Example: cpu_scale = 3.0 allows up to 12 workers here.
num_threads = 6
# cpu_scale: worker-team cap = cpu_scale x online CPUs. 1.5 = default
# behavior; 3.0 allows up to 12 workers on a 4-core box; negative disables
# the cap (num_threads used verbatim).
cpu_scale = 1.5
gpu_env = 0

[policy]
num_layers = 4
hidden_size = 128

[env]
frameskip = 4
# Potential-based progress shaping (see retro_obs.h). MUST equal train.gamma:
# Ng et al. policy invariance holds only when the shaping discount matches
# the learner discount.
potential_gamma = 0.99
# ---- Sparse-event reward weights (all tweakable, defaults = old hardcoded) ----
# coin_reward: per coin collected. Coins also pay 200 score points.
# kill_reward: per enemy killed (stomp/shell/fireball/star/brick). Kills ALSO
#   pay 100-8000 score points via score_scale, so 1.0 here stacks on top.
# score_scale: reward per score point (default 0.01 = old dscore/100).
# death_penalty: subtracted on death (and once for the dying animation).
# flag_reward: one-time bonus for touching the flagpole.
# area_reward: one-time bonus per world/stage/area advance (warps included).
# idle_penalty: subtracted per STEP that makes no forward progress during
#   normal gameplay (engine 08, not dying, not flag). 0 = off. SCALE WARNING:
#   the max PBRS progress gradient is ~0.003/step (0.99 * 10px / 3400). With
#   idle_penalty=0.02, camping cost -20/episode while death cost only -2.5,
#   so death became the OPTIMAL exit and the policy stopped valuing distance
#   entirely. Keep idle_penalty <= 0.003 unless death_penalty is also large;
#   note death_penalty=0 + idle>0 = "suicide charge" exploration recipe.
score_scale = 0.05
coin_reward = 0.1
kill_reward = 1.0
death_penalty = 0
flag_reward = 0
area_reward = 0
idle_penalty = 0.01
# Env backend: quicknes ( cycle-approx interpreter, exact preview + eval) or
# fast (native-C smbcore, ~50x, same ROM/RAM/obs ABI; train here, eval there).
# Override per-run: ./puffer train retro env.backend=fast
backend = quicknes
core_path = ocean/retro/cores/quicknes_libretro.so
rom_path = ocean/retro/roms/smb1.nes
gravity = 0.52
max_vx = 2.8
jump_v = -6.2
run_accel = 0.22
friction = 0.88

[train]
total_timesteps = 100_000_000
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 2
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.01
momentum = 0.9
minibatch_size = 32768
horizon = 32
prio_alpha = 0
prio_beta0 = 0.6
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0
