# Automatic ROM-state reset archive; independent trials from the 197/256 parent.
# Natural episodes: 108000 native frames (~30 minutes), no mid-episode teleport.
# Six reset-archive dimensions; PPO fixed at the strongest prior candidate.
# Evaluation disables archives: all 32 levels x8 plus 16 full games from 1-1.
# Objective = clear-first level panel score + 100*game win rate + mean game levels cleared.
[base]
env_name = retro
async = 1
load_model_path = saved/retro/pixel_197_20261018.bin
checkpoint_dir = checkpoints/retro_archive_20261019
log_dir = logs/retro_archive_20261019
checkpoint_interval = 192
eval_episodes = 0
cudagraphs = 1

[vec]
total_agents = 1024
num_buffers = 4
num_threads = 12

[policy]
architecture = puffernet
num_layers = 2
hidden_size = 256

[env]
practice_replay = None
frameskip = 4
full_render = 0
idle_loop_skip = 1
max_frames = 108000
completion_reward = 2
completion_on_rta_split = 1
completion_on_next_playable = 0
completion_time_bonus = 0
completion_time_min_frames = 0
completion_time_max_frames = 1800
pipe_segment_bonus = 0
pipe_segment_frames = 600
death_penalty = 0.05
checkpoint_distance = 128
checkpoint_reward = 0.125
score_scale = 0.0001
coin_reward = 0
idle_penalty = 0
idle_grace_decisions = 8
novel_area_reward = 1
# Castle mazes: penalty when a wrong-height maze check sends Mario back 1024 px.
maze_loop_penalty = 0
completion_time_target_bonus = 0
reward_scale = 0.0625
spawn_levels = all
terminate_on_clear = 0
backend = quicknes
cpu_backend = blocks
render_backend = wide
rom_path = ocean/retro/roms/smb1_ntsc.nes
archive_enabled = 1
archive_start = 0.6
archive_end = 0.1
archive_anneal_fraction = 0.8
archive_priority = 0.5
archive_level_focus = 0
# Pick lower cells (larger y band) more often: weight x (1 + depth * band/7).
archive_depth_priority = 0
# End-first curriculum: weight x exp(backward * (1 - phase) * (depth / deepest_in_level - 1)).
archive_backward = 0
# Optional starting archive for a fresh policy (.archive.gz); None disables.
archive_init_path = None
archive_capture_interval = 128
archive_cell_width = 128
archive_capacity_mb = 128

[train]
total_timesteps = 1000000000
reward_clip = 0
learning_rate = 0.0000493250518
anneal_lr = 0
min_lr_ratio = 1
gamma = 0.99993968
gae_lambda = 0.99000001
replay_ratio = 1.95590782
clip_coef = 0.182759717
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.356523246
ent_coef = 0.000113608752
anneal_ent_coef = 0
min_ent_coef_ratio = 1
momentum = 0.813407362
minibatch_size = 4096
horizon = 256
vtrace = 0
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0

[panel]
levels = all
repeats = 8
seed = 20260907
frames = 30000
frameskip = 4
workers = 12
game_repeats = 16

[sweep]
metric = curriculum
metric_distribution = linear
goal = maximize
max_runs = 500
gpus = 1
downsample = 1
max_suggestion_cost = 10800
prune_pareto = 1
early_stop_quantile = 0.3
live = 0
history_path = logs/retro_archive_20261019/sweep.history
trial_timesteps = 200015872
worker_path = ocean/retro/sweep_worker.py
trainer_path = puffer
max_failures = 1000
max_trial_seconds = 7200
startup_timeout = 600
eval_timeout = 1800
min_steps_per_second = 50000
speed_check_seconds = 30
memory_limit_mb = 15360
max_train_graph_work = 80000

