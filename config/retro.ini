# Automatic ROM-state reset archive with the curriculum teacher (2026-11-07, archive_teacher = 1;
# reports/retro/teacher_20261107/SPEC.md): archive starts are drawn by a bandit over groups (area sections) ranked by
# natural-play deaths, learning progress and staleness; 50% archive starts, 30% full games, 20% level starts.
# Independent trials from the 197/256 parent. Natural episodes: 108000 native frames (~30 minutes), no mid-episode
# teleport. archive_priority is ignored with the teacher on (its sweep range is pinned to 0).
# Evaluation disables archives: all 32 levels x8 plus 16 full games from 1-1.
# Objective = clear-first level panel score + 100*game win rate + mean game levels cleared.
[base]
env_name = retro
async = 1
load_model_path = saved/retro/pixel_197_20261018.bin
checkpoint_dir = checkpoints/retro_archive_20261019
log_dir = logs/retro_archive_20261019
checkpoint_interval = 192
eval_episodes = 0
cudagraphs = 1

[vec]
total_agents = 1024
num_buffers = 4
num_threads = 12

[policy]
num_layers = 2
hidden_size = 256

[env]
practice_replay = None
frameskip = 4
full_render = 0
idle_loop_skip = 1
max_frames = 108000
completion_reward = 2
completion_on_rta_split = 1
completion_on_next_playable = 0
completion_time_bonus = 0
completion_time_min_frames = 0
completion_time_max_frames = 1800
pipe_segment_bonus = 0
pipe_segment_frames = 600
death_penalty = 0.05
checkpoint_distance = 128
checkpoint_reward = 0.125
score_scale = 0.0001
coin_reward = 0
idle_penalty = 0
idle_grace_decisions = 8
novel_area_reward = 1
# Castle mazes: penalty when a wrong-height maze check sends Mario back 1024 px.
maze_loop_penalty = 0
# 1: a maze castle loop-back (ROM rewind on the wrong floor) ends the episode (ocean/retro/retro.h).
maze_loop_terminal = 0
archive_practice = 0
archive_practice_focus = 0
progress_gap_cap = 64
pipe_entry_reward = 0
completion_time_target_bonus = 0
reward_scale = 0.0625
spawn_levels = all
terminate_on_clear = 0
backend = quicknes
cpu_backend = blocks
render_backend = wide
rom_path = ocean/retro/roms/smb1_ntsc.nes
archive_enabled = 1
archive_start = 0.5
archive_end = 0.5
archive_anneal_fraction = 0.8
archive_priority = 0
archive_level_focus = 0
# Pick lower cells (larger y band) more often: weight x (1 + depth * band/7).
archive_depth_priority = 0
# End-first curriculum: weight x exp(backward * (1 - phase) * (depth / deepest_in_level - 1)).
archive_backward = 0
# Optional starting archive for a fresh policy (.archive.gz); None disables.
archive_init_path = None
archive_capture_interval = 128
archive_cell_width = 128
archive_capacity_mb = 512
# Curriculum teacher (ocean/retro/README.md "Curriculum teacher"); requires archive_enabled = 1, archive_practice = 0.
archive_teacher = 1
# px per group section (32..2048)
archive_group_width = 256
# snapshots per cell (1..64)
archive_variants = 8
# fixed full-game (mode 1) share with the teacher on
archive_full_game_share = 0.3
# px of same-area progress that count a practice start as a win
archive_success_distance = 512
archive_attempt_decisions = 600
archive_death_chain = 1
# decisions between death-chain snapshots
archive_chain_interval = 32
archive_chain_depth = 4
# decisions before a failure that are not deposited
archive_chain_skip = 16
# agent steps
archive_death_half_life = 20000000
archive_upstream_groups = 6
archive_lp_fast = 0.05
archive_lp_slow = 0.005
archive_lp_min_attempts = 5
archive_weight_deaths = 0.5
archive_weight_lp = 0.35
archive_weight_stale = 0.15
archive_rank_power = 1
archive_floor = 0.1

[train]
total_timesteps = 1000000000
reward_clip = 0
learning_rate = 0.0000493250518
anneal_lr = 0
min_lr_ratio = 1
gamma = 0.99993968
gae_lambda = 0.99000001
replay_ratio = 1.95590782
clip_coef = 0.182759717
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.356523246
ent_coef = 0.000113608752
