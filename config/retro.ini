[base]
env_name = retro
async = 1
# Ending curriculum: fixed black-screen return-pipe state; see PRACTICE.md.
# None starts a fresh random policy. A checkpoint path loads weights only.
load_model_path = None
checkpoint_dir = checkpoints/retro_cnn_64x60_pipe_exit
log_dir = logs/retro_pipe_exit
# Ordinary training saves every 10.49M decisions and on graceful Ctrl-C.
# Sweeps override this to final-only saves.
checkpoint_interval = 160
checkpoint_on_interrupt = 1
cudagraphs = 1


[selfplay]
enabled = 0
magnet_path = None
max_size = 16
opp_timeout_steps = 1000000
pfsp_mode = variance
pfsp_alpha = 1
pfsp_uniform_mix = 0.1
payoff_ema = 0.1
eval_pool_size = 4
eval_games = 256
eval_agents = 256
eval_metric = winrate
opponent_pool = None
opponent_pool_prob = 0.5

[vec]
total_agents = 256
num_buffers = 1
num_threads = 4
worker_wait = block
cpu_scale = 1
gpu_env = 0

[policy]
num_layers = 2
hidden_size = 256

[env]
practice_replay = ocean/retro/practice/pipe_exit.inputs
# Verified World/NTSC ROM on the NTSC core. RTA = native frames / 60.0988139.
# Existing PAL-trained weights can warm-start; old timing results do not compare.
# One-frame controls preserve arbitrary press/release timing. A frameskip=4
# speed experiment still emulates every frame, but restricts available inputs.
frameskip = 1
full_render = 0
idle_loop_skip = 1
max_frames = 1800
# Level transitions and castle completion pay once per source level/episode.
# The ROM continues naturally through flags, pipes, vines and wrong warps.
completion_reward = 1
# Pay on the SAME black-screen split shown by the viewer/dashboard.
# PRACTICE: counts from the fixed black screen, through pipe emergence,
# flag animation, timer conversion and fireworks. NOT full-run RTA.
# Independent of max_frames (the timeout); tune this range for other levels.
completion_on_rta_split = 1
completion_on_next_playable = 0
completion_time_bonus = 16
completion_time_min_frames = 0
completion_time_max_frames = 1800
# Once per 1-1 route segment: reset -> underground playable, then underground
# playable -> overworld playable. Extra = pipe_segment_bonus * clamp(1 - segment_frames/600,0,1).
# Already learned this route: do not pay early partial progress in this round.
pipe_segment_bonus = 0
pipe_segment_frames = 600
# Speed-first exploration: no explicit penalty for failed attempts.
death_penalty = 0.1
checkpoint_distance = 128
checkpoint_reward = 0.05
score_scale = 0
# All explicit reward components share reward_scale; no potential shaping.
# Idle penalties are per decision after idle_grace_decisions.
coin_reward = 0
idle_penalty = 0.1
idle_grace_decisions = 8
# Area transition rewards have been removed. area_transitions/novel_areas
# are diagnostic event counts only; neither pays reward.
# Obsolete completion HUD TIME extra stays disabled.
completion_time_target_bonus = 0
# Episode-local checkpoint frontiers prevent repeat farming.
reward_scale = 0.0625
# All 32 starts are built and validated once; CSV/single levels also work.
spawn_levels = 1-1
# Stop the episode at the configured first clear endpoint instead of playing
# on into the next level. Set 0 to keep the old continue-through behavior.
# The sweep panel always stops at the first source-level clear.
terminate_on_clear = 1
backend = quicknes
# Compiled ROM CPU with full-screen rendering.
cpu_backend = blocks
render_backend = wide
rom_path = ocean/retro/roms/smb1_ntsc.nes

[train]
total_timesteps = 83886080
reward_clip = 0
# Conservative fine-tuning; search narrow rates without changing architecture.
learning_rate = 0.0001
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.9999
gae_lambda = 0.997
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0
anneal_ent_coef = 1
momentum = 0.9
minibatch_size = 4096
horizon = 256
prio_alpha = 0
prio_beta0 = 0.6
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0
emag_kl_coef = 0.
emag_tau = 0.
emag_cutoff = 1.0

# Native entry: ./puffer sweep retro. Fixed budgets, panel on env.spawn_levels.
# One fixed-parent round. Re-anchor only a confirmed winner for the next round.
[sweep]
metric = speed
metric_distribution = linear
goal = maximize
trial_timesteps = 8388608
max_suggestion_cost = 3600
max_runs = 32
gpus = 1
downsample = 1
use_gpu = True
prune_pareto = False
early_stop_quantile = 0
random_samples = 8
global_random_fraction = 0
global_candidate_fraction = 0.1
# Only active learning/reward parameters are sampled; do not revive old shaping.
sweep_only = train.learning_rate,train.ent_coef,train.gamma
# Same seeded attempts at each selected level, using env.frameskip.
# speed ranks fastest clear first, mean successful time second; ignores clear %.
eval_frames = 1800
eval_repeats = 32
eval_seed = 20260907
eval_workers = 4

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.0005
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.003
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.999
max = 0.9999
scale = auto
