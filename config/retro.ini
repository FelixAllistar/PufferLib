[base]
env_name = retro
async = 1
# Fresh CNN training. Set latest explicitly only when continuing a CNN policy.
# checkpoints/retro_cnn_64x60_speed/retro/1789699132885/0000000483393536.bin
load_model_path = latest
checkpoint_dir = checkpoints/retro_cnn_64x60_speed
# Save every 5.24M decisions with the current batch, and on graceful Ctrl-C.
checkpoint_interval = 160
checkpoint_on_interrupt = 1
cudagraphs = 1


[selfplay]
enabled = 0
magnet_path = None
max_size = 16
opp_timeout_steps = 1000000
pfsp_mode = variance
pfsp_alpha = 1
pfsp_uniform_mix = 0.1
payoff_ema = 0.1
eval_pool_size = 4
eval_games = 256
eval_agents = 256
eval_metric = winrate
opponent_pool = None
opponent_pool_prob = 0.5

[vec]
total_agents = 256
num_buffers = 1
num_threads = 4
worker_wait = block
cpu_scale = 1
gpu_env = 0

[policy]
num_layers = 2
hidden_size = 256

[env]
# One-frame controls preserve arbitrary press/release timing. A frameskip=4
# speed experiment still emulates every frame, but restricts available inputs.
frameskip = 1
full_render = 0
idle_loop_skip = 1
max_frames = 3000
potential_gamma = 0.997764528
# Level transitions and castle completion pay once per source level/episode.
# The ROM continues naturally through flags, pipes, vines and wrong warps.
completion_reward = 10
# Only paid on a new clear: bonus * max(0, 1 - level_frames/max_frames).
completion_time_bonus = 100
death_penalty = .125
checkpoint_distance = 128
checkpoint_reward = 0
score_scale = 0.000
# Common scale: progress +0.0078125/128 new pixels; death -0.0625;
# clear +0.625, plus up to +0.3125 for an early clear. PBRS also applies.
# Each newly collected coin pays +0.00625; score remains disabled. After an
# eight-decision grace period without movement/events, idle costs -0.00125 per
# decision. These terms are decision-level (not one charge per native frame).
coin_reward = 0
idle_penalty = 0.0000
idle_grace_decisions = 8
# Confirmed same-level area loads (pipes, doors, vines, underwater entries)
# are logged as env/area_transitions. Keep reward off while inspecting routes;
# set this raw value above zero to pay once per novel destination per episode.
area_transition_reward = 1
# Fast-route milestones in the game's displayed HUD TIME units (not frames).
area_transition_timer_1 = 385
area_transition_timer_2 = 380
# Extra transition bonus scales smoothly from zero toward each target.
area_transition_timer_bonus = 5
# Extra completion bonus scales from TIME 365 up to full value at TIME 369.
completion_time_target = 365
completion_time_target_max = 369
completion_time_target_bonus = 100
# Earned rewards survive terminal PBRS; episode-local frontiers prevent repeat farming.
reward_scale = 0.0625
# All 32 starts are built and validated once; CSV/single levels also work.
spawn_levels = 1-1
backend = quicknes
# Compiled ROM CPU with full-screen rendering.
cpu_backend = blocks
render_backend = wide
rom_path = ocean/retro/roms/smb1.nes

[train]
total_timesteps = 150000000
reward_clip = 0
# Keep the user's successful 64x60/frameskip=4 learner settings fixed.
learning_rate = 0.001234825
gamma = 0.997764528
gae_lambda = 0.999004204
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.000749409432
momentum = 0.9
minibatch_size = 4096
horizon = 256
prio_alpha = 0
prio_beta0 = 0.6
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0
emag_kl_coef = 0.
emag_tau = 0.
emag_cutoff = 1.0

# Native entry: ./puffer sweep retro. Fixed budgets, panel on env.spawn_levels.
# Ordinary ./puffer train retro keeps the longer training budget above.
[sweep]
metric = speed
metric_distribution = linear
goal = maximize
trial_timesteps = 3000000
max_suggestion_cost = 3600
max_runs = 16
gpus = 1
downsample = 1
use_gpu = True
prune_pareto = False
early_stop_quantile = 0
random_samples = 4
global_random_fraction = 0.2
global_candidate_fraction = 0.2
# Only the ten learning/reward parameters listed below are sampled.
sweep_only = train.learning_rate,train.ent_coef,train.gamma,train.gae_lambda,env.completion_reward,env.completion_time_bonus,env.death_penalty,env.checkpoint_reward,env.idle_penalty,env.area_transition_reward
# Same seeded attempts at each selected level, using env.frameskip.
# speed ranks clears first, then fewer native frames per clear.
eval_frames = 3600
eval_repeats = 2
eval_seed = 20260907
eval_workers = 4

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.003
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0003
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.997
max = 0.9998
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.90
max = 0.9999
scale = auto

[sweep.env.completion_reward]
distribution = uniform
min = 0
max = 10
scale = auto

[sweep.env.completion_time_bonus]
distribution = uniform
min = 0
max = 100
scale = auto

[sweep.env.death_penalty]
distribution = uniform
min = 0
max = 0.5
scale = auto

[sweep.env.checkpoint_reward]
distribution = uniform
min = 0.001
max = 1
scale = auto

[sweep.env.idle_penalty]
distribution = uniform
min = 0
max = 0.0005
scale = auto

[sweep.env.area_transition_reward]
distribution = uniform
min = 0
max = 5
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.train.replay_ratio]
distribution = int_uniform
min = 1
max = 4
scale = auto
