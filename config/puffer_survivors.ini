bubble_target_area_range = 4.0
bubble_shot_spread = 0.35
bubble_projectile_ttl = 100
whirlpool_knockback = 0.06
whirlpool_ttl = 18
whirlpool_tick_rate = 99
orbit_area_distance_bonus = 0.5
orbit_knockback = 0.04
ink_target_range_ratio = 0.50
ink_pool_spread = 1.4
ink_pool_angle_jitter = 0.5
ink_pool_ttl_base = 140
ink_pool_ttl_per_level = 12
ink_pool_tick_rate = 8
ink_trail_min_speed2 = 0.0004
ink_trail_max_base = 14
ink_trail_max_per_level = 4
ink_trail_cadence_base = 6
ink_trail_cadence_level_divisor = 2
ink_trail_cadence_min = 3
ink_trail_radius_base = 0.88
ink_trail_radius_per_level = 0.10
ink_trail_radius_config_scale = 0.10
ink_trail_damage_multiplier = 0.36
ink_trail_ttl_base = 42
ink_trail_ttl_per_level = 8
ink_trail_offset = 0.95
ink_trail_tick_rate = 6
area_tick_knockback = 0.02
weapon_active_decay = 0.82
orbit_phase_speed = 0.045
orbit_phase_per_level = 0.006
sonar_knockback = 0.50
sonar_ttl = 24
sonar_tick_rate = 99
# Glacier (frost cone) and Spikes. Frost cone aims at nearest enemy, slows
# enemies inside the wedge by frost_slow, and applies light damage.
frost_slow = 0.2
frost_half_angle = 0.6
frost_range = 8.0
frost_slow_ttl = 60
spike_speed = 0.42
spike_range = 10.0
# Moving hazards: type order is anchor, submarine. They are sparse by design
# so the player can read and dodge them without creating a second enemy swarm.
moving_obstacle_cap = 4
moving_obstacle_start_wave = 3
moving_obstacle_spawn_interval = 720
moving_obstacle_ttl = 720
moving_obstacle_spawn_margin = 10.0
moving_obstacle_speed = 0.24, 0.30
moving_obstacle_half_width = 2.10, 3.25
moving_obstacle_half_height = 2.10, 1.90
moving_obstacle_damage = 2.0

# Fixed observation layout. Positions are player-relative and normalized to
# the observation radius. Upgrade cards are one-hot encoded; moving hazards
# expose active/type/player-relative-dx/player-relative-dy. Friendly weapon
# areas and derived danger summaries are omitted. This makes the policy input
# 337 floats. Changing it requires a fresh policy checkpoint.
free_upgrade = -1
free_upgrade_count = 0
show_hitboxes = 1

[policy]
hidden_size = 32
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 100000000
learning_rate = 0.0005
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.985
gae_lambda = 0.99
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.000822490646889698
momentum = 0.95
minibatch_size = 4096
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 1200
max_runs = 80
gpus = 1
downsample = 20
use_gpu = False
prune_pareto = True
early_stop_quantile = 0.3
# Winning throughput sweep (32/33 runs converged here, ~231k SPS, top score).
# Now sweep the reward shaping knobs to tune behavior without touching throughput.
sweep_only = env.reward_kill,env.reward_survival,env.reward_hurt,env.reward_pickup,env.reward_levelup,train.gamma,train.gae_lambda,train.learning_rate

# Sweep only the throughput knobs below. metric stays env/score; the sweep
# cost axis is uptime (= total_timesteps / SPS), so Protein's pareto front
# surfaces the highest-SPS configs that don't crater reward. The reward and
# lr/gamma sections below are now inert (excluded from sweep_only).

[sweep.train.gamma]
distribution = logit_normal
min = 0.98
max = 0.9995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.90
max = 0.995
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.02
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 512
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 512
max = 32768
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 2048
max = 65536
scale = auto

[sweep.env.reward_kill]
distribution = log_normal
min = 0.01
max = 0.1
scale = auto

[sweep.env.reward_survival]
distribution = log_normal
min = 0.003
max = 0.006
scale = auto

[sweep.env.reward_hurt]
distribution = uniform
min = -1.8
max = -0.005
scale = auto

[sweep.env.reward_pickup]
distribution = log_normal
min = 0.018
max = 1.0
scale = auto

[sweep.env.reward_levelup]
distribution = log_normal
min = 0.025
max = 0.2
scale = auto
