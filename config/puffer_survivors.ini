[base]
env_name = puffer_survivors

[vec]
total_agents = 5120
num_buffers = 5
num_threads = 20

[env]
arena_size = 48.0
max_steps = 24000
wave_length_steps = 600
enemy_cap = 256
projectile_cap = 512
drop_cap = 192
obstacle_count = 14
enemy_spawn_rate = 0.085
elite_spawn_rate = 0.006
player_speed = 0.18
player_health = 7
enemy_speed = 0.0875
enemy_hp_scale = 0.65
enemy_damage_scale = 1.0
spawn_ramp = 3.2
projectile_speed = 0.42
projectile_damage = 1.0
fire_cooldown = 22.0
pickup_radius = 0.65
magnet_radius = 3.4
health_drop_rate = 0.045
health_heal = 3
reward_xp = 0.05
reward_kill = 0.35
reward_damage = 0.008
reward_survival = 0.001
reward_hurt = -0.25
reward_death = -3.0
obstacle_penalty = -0.003
contact_damage = 1.0
invuln_steps = 36
enemy_obstacle_stride = 1
show_hitboxes = 0
cuda_sim = 1

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 1000000000
learning_rate = 0.00003
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.999
gae_lambda = 0.97
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.001
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 32768
horizon = 128
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[sweep]
method = Protein
metric = perf
metric_distribution = linear
goal = maximize
max_suggestion_cost = 1200
max_runs = 24
gpus = 1
downsample = 5
use_gpu = False
prune_pareto = True
early_stop_quantile = 0.3
sweep_only = total_timesteps,learning_rate,ent_coef,gamma,horizon,minibatch_size,hidden_size,num_layers
[sweep.train.total_timesteps]
distribution = log_normal
min = 5000000
max = 20000000
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.003
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0005
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.97
max = 0.999
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 512
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
scale = auto