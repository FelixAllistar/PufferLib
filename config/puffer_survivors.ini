enemy_speed_mult = 1.0, 1.28, 0.76, 0.92
enemy_base_damage = 1.0, 1.0, 2.0, 2.0

# Weapon curves, in weapon order above. Per-level cooldown values are negative.
weapon_base_cooldown = 16.0, 24.0, 10.0, 96.0, 135.0, 64.0, 40.0
weapon_cooldown_per_level = -0.8, -1.8, -0.7, -6.0, -7.0, -3.5, -2.0
weapon_base_damage = 1.15, 0.90, 1.15, 0.95, 1.00, 0.35, 0.55
weapon_damage_per_level = 0.22, 0.34, 0.42, 0.34, 0.38, 0.10, 0.16

# Enemy composition, scaling, and special-wave schedule.
enemy_mix_start_wave = 2
enemy_mix_phase_one_end_wave = 4
enemy_mix_phase_two_end_wave = 7
enemy_mix_phase_one_jelly_pct = 35
enemy_mix_phase_two_urchin_pct = 25
enemy_mix_phase_two_jelly_pct = 55
enemy_mix_late_urchin_pct = 20
enemy_mix_late_eel_pct = 55
enemy_mix_late_jelly_pct = 80
enemy_hp_growth_per_wave = 0.065
enemy_hp_progress_scale = 0.42
enemy_speed_growth_per_wave = 0.012
enemy_speed_growth_wave_cap = 18
# Extra speed growth per wave after the cap (0 = speed stays flat after the cap). At 0.06 late
# enemies outrun a player who walked away all game and never built up (2/18 such episodes
# survive, against 12/18 at 0); a player who fought and levelled is unaffected (24/24).
