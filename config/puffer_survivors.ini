weapon_orbit_radius_per_level = 0.04
weapon_ink_radius_per_level = 0.10
weapon_sonar_radius_per_level = 0.30
weapon_spikes_radius_per_level = 0.015
# Orbit distance is separate from pearl/hit radius.
weapon_orbit_distance = 2.25
weapon_orbit_distance_per_level = 0.10

