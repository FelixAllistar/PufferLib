wave_spawn_scale_min = 0.25
wave_spawn_scale_max = 3.0
wave_progress_spawn_scale = 0.12
wave_population_cap = 240
wave_tail_minimum_base = 210
wave_tail_minimum_step = 7
wave_tail_interval = 8
wave_min_spawn_interval = 5
progress_normal_wave_count = 7
weapon_min_cooldown = 3.0

# Weapon-specific gameplay effects.
