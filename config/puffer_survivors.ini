[base]
# Launcher/runtime settings. These are not gameplay geometry.
env_name = puffer_survivors
gpu = 1
cudagraphs = -1
checkpoint_interval = 100
eval_episodes = 10
load_model_path = None
async=0

[vec]
# Vectorization settings used by training.
total_agents = 8192
num_buffers = 1
num_threads = 20
gpu_env = 1
async = 1

[env]
# Arena and storage capacities.
arena_size = 48.0
max_steps = 24000
wave_length_steps = 600
enemy_cap = 256
projectile_cap = 512
drop_cap = 192
obstacle_count = 8
# Runtime active limit; values above backing storage are clamped.
area_cap = 96

# Main collision footprints. These also scale the matching renderer art.
# Enemy order: default, jelly, urchin, eel.
