obstacle_recycle_radius_ratio = 0.95
enemy_spawn_edge_margin = 10.0
enemy_spawn_along_ratio = 0.98
enemy_recycle_radius_ratio = 1.55
spawn_velocity_bias_probability = 0.14
special_ring_radius_ratio = 0.82
special_ring_enemy_count = 18
special_ring_speed_mult = 0.78
special_ring_wave_count = 3
