wave_interval = 74, 68, 48, 30, 68, 62, 40, 38, 88, 40, 34, 24, 24, 34, 18, 16, 15, 54, 34, 28, 16, 14, 13, 12

# Pacing, movement, and enemy scaling.
enemy_spawn_rate = 0.085
elite_spawn_rate = 0.006
player_speed = 0.18
player_health = 8
enemy_speed = 0.0875
enemy_hp_scale = 0.65
enemy_damage_scale = 1.0
spawn_ramp = 3.2
projectile_speed = 0.42
projectile_damage = 1.0
fire_cooldown = 22.0

# Pickup geometry. These are gameplay radii; pickup art has its own footprint.
pickup_radius = 0.65
magnet_radius = 3.4
health_drop_rate = 0.015
health_heal = 4

# Reward shaping used by training.
reward_xp = 0.1
reward_kill = 0.03
reward_damage = 0.0
