elite_hp_multiplier = 5.0
elite_speed_multiplier = 0.88
elite_damage_multiplier = 2.0
boss_hp_base = 32.0
boss_hp_per_wave = 8.0
boss_speed_multiplier = 0.62
boss_damage = 4.0
ari_k_hp_multiplier = 2.25
ari_k_speed_multiplier = 0.48
ari_k_damage = 6.0
elite_spawn_ramp_per_tick = 0.0000015
boss_period_steps = 900
ari_k_start_wave = 29
ari_k_wave_period = 5

# Score and drop contents.
kill_score_default = 5.0
kill_score_elite = 12.0
kill_score_boss = 24.0
drop_value_default = 1.0
drop_value_elite = 3.0
drop_value_boss = 8.0
health_drop_elite_bonus = 2.0
health_drop_boss_bonus = 5.0
health_drop_missing_hp_bonus = 1.1
health_drop_offset_x = 0.2
health_drop_offset_y = -0.2
# Wave tables are zero-based internally; first entry is the first HUD wave.
wave_minimum = 10, 16, 26, 36, 32, 26, 48, 58, 70, 46, 68, 86, 96, 108, 80, 104, 126, 94, 116, 138, 154, 168, 180, 192
wave_interval = 74, 68, 48, 30, 68, 62, 40, 38, 88, 40, 34, 24, 24, 34, 18, 16, 15, 54, 34, 28, 16, 14, 13, 12

# Pacing, movement, and enemy scaling.
enemy_spawn_rate = 0.085
elite_spawn_rate = 0.006
player_speed = 0.18
player_health = 8
enemy_speed = 0.0875
enemy_hp_scale = 0.65
enemy_damage_scale = 1.0
spawn_ramp = 3.2
projectile_speed = 0.42
projectile_damage = 1.0
fire_cooldown = 22.0

# Pickup geometry. These are gameplay radii; pickup art has its own footprint.
pickup_radius = 0.65
magnet_radius = 3.4
health_drop_rate = 0.055
health_heal = 4

# Reward shaping used by training.
reward_xp = 0.000530170451
reward_kill = 0
reward_damage = 0.0
reward_survival = 0.000251607969
# Until 2026-11-16: hurt -1.45, death 0. A hit cost more than a level-up paid, so the policy
# only fought with Poison Oil (kills from a safe distance) and otherwise walked away.
# Moving the penalty to dying (hurt -0.2, death -4), with the entropy bonus annealed: every
# episode fights and survives (48/48 greedy, 24/24 sampled); before, 25/48 fought.
reward_hurt = -0.2
reward_death = -4
reward_success = 1.0
reward_pickup = 0
reward_levelup = 1
obstacle_penalty = 0

contact_damage = 1.0
invuln_steps = 36
enemy_obstacle_stride = 4
# Movement, upgrade, and wave pacing constants.
movement_smoothing = 0.35
# Movement action 9. Timings are simulation ticks at 60 Hz.
dash_speed = 0.75
dash_duration = 12
dash_shrink = 0.20
# Dash cooldown in ticks: base + per_level * (player level - 1), times the Cooldown
# upgrade multiplier, never below dash_cooldown_min. Until 2026-11-15 per_level was -45
# with a 1-tick floor, so from player level 8 dashes chained: 4x walking speed and
# permanent invulnerability.
dash_cooldown = 300.0
dash_cooldown_per_level = 0.0
dash_cooldown_min = 120.0
pickup_magnet_speed = 0.28
weapon_max_level = 8
# Each passive (Speed, Magnet, Health, Might, Cooldown, Area, Pierce) can be taken this
# many times. Once every weapon and passive is maxed, a level-up heals health_heal instead.
upgrade_passive_max_level = 5
upgrade_speed_bonus = 0.10
upgrade_magnet_bonus = 0.25
upgrade_health_bonus = 1.0
upgrade_might_bonus = 0.18
upgrade_cooldown_multiplier = 0.91
# Was 0.12 until 2026-11-16.
upgrade_area_bonus = 0.06
xp_threshold_base = 6.0
xp_threshold_per_level = 4.0
wave_spawn_reference_rate = 0.085
wave_spawn_scale_min = 0.25
wave_spawn_scale_max = 3.0
wave_progress_spawn_scale = 0.12
wave_population_cap = 240
wave_tail_minimum_base = 210
wave_tail_minimum_step = 7
wave_tail_interval = 8
wave_min_spawn_interval = 5
progress_normal_wave_count = 7

# Weapon-specific gameplay effects.
bubble_target_range = 18.0
bubble_target_area_range = 4.0
bubble_shot_spread = 0.35
bubble_projectile_ttl = 100
whirlpool_knockback = 0.06
whirlpool_ttl = 18
whirlpool_tick_rate = 99
# Whirlpool drags circle enemies (not bosses) between its radius R and R * radius_scale
# toward the player by whirlpool_pull, never closer than 0.9 R, and marks them pulled for
# whirlpool_pull_ttl ticks (a kill while pulled is a combo kill).
whirlpool_pull = 0.9
whirlpool_pull_radius_scale = 2.0
whirlpool_pull_ttl = 45
orbit_area_distance_bonus = 0.5
orbit_knockback = 0.04
ink_target_range_ratio = 0.50
ink_pool_spread = 1.4
ink_pool_angle_jitter = 0.5
ink_pool_ttl_base = 140
ink_pool_ttl_per_level = 12
ink_pool_tick_rate = 8
ink_trail_min_speed2 = 0.0004
ink_trail_max_base = 14
ink_trail_max_per_level = 4
ink_trail_cadence_base = 6
ink_trail_cadence_level_divisor = 2
ink_trail_cadence_min = 3
ink_trail_radius_base = 0.88
ink_trail_radius_per_level = 0.10
ink_trail_radius_config_scale = 0.10
ink_trail_damage_multiplier = 0.36
ink_trail_ttl_base = 42
ink_trail_ttl_per_level = 8
ink_trail_offset = 0.95
ink_trail_tick_rate = 6
area_tick_knockback = 0.02
weapon_active_decay = 0.82
orbit_phase_speed = 0.045
orbit_phase_per_level = 0.006
sonar_knockback = 0.50
sonar_ttl = 24
sonar_tick_rate = 99
# A Sonar pulse turns every oil pool it touches into a one-hit detonation: radius and damage
# scaled, going off 1 + delay * min(1, distance / sonar radius) ticks later, shown for ttl.
oil_detonate_radius_scale = 1.6
oil_detonate_damage_scale = 4.0
oil_detonate_delay = 8
oil_detonate_ttl = 10
# Glacier (frost cone) and Spikes. Frost cone aims at nearest enemy, slows
# enemies inside the wedge by frost_slow (bosses and Ari K. by frost_boss_slow),
# and applies light damage. Until 2026-11-16: slow 0.2, half angle 0.7, range 8, ttl 60.
frost_slow = 1.0
frost_half_angle = 0.9
frost_range = 10.0
frost_slow_ttl = 90
frost_boss_slow = 0.3
# A frozen enemy that dies shatters: shatter_damage (times Might) in shatter_radius,
# shatter_delay ticks later, shown for shatter_ttl more. Shatters can chain.
shatter_damage = 1.5
shatter_radius = 1.6
shatter_delay = 4
shatter_ttl = 8
spike_speed = 0.42
spike_range = 10.0
# Spikes shots: base at level 1, plus per_level for each level above (8 to 36). Was 8 * level.
spikes_count_base = 8
spikes_count_per_level = 4
# Moving hazards: type order is anchor, submarine. They are sparse by design
# so the player can read and dodge them without creating a second enemy swarm.
moving_obstacle_cap = 4
moving_obstacle_start_wave = 3
moving_obstacle_spawn_interval = 720
moving_obstacle_ttl = 720
moving_obstacle_spawn_margin = 10.0
moving_obstacle_speed = 0.24, 0.30
moving_obstacle_half_width = 2.10, 3.25
moving_obstacle_half_height = 2.10, 1.90
moving_obstacle_damage = 2.0

# Fixed observation layout. Positions are player-relative and normalized to
# the observation radius. Upgrade cards are one-hot encoded; moving hazards
# expose active/type/player-relative-dx/player-relative-dy. Friendly weapon
# areas and derived danger summaries are omitted. This makes the policy input
# 337 floats. Changing it requires a fresh policy checkpoint.
free_upgrade = -1
free_upgrade_count = 0
show_hitboxes = 0

# Fun scorecard, logged per episode as fun (the product of nine scores), fun_<term> and,
# on CPU builds, raw_<term>. Each score is 1 when its raw value is in [lo, hi] and
# exp(-(d / soft)^2) at distance d outside. Raw values: tension = lowest hp / max_hp (0 if
# dead); damage = damage taken per minute; survival = ticks / max_steps; coverage = mean
# share of the view under weapon areas and orbit pearls; combo = share of kills made by
# chain reactions (oil detonations and shatters); burst = share of kills made in
# half-second windows with at least fun_burst_kills kills and fun_burst_ratio times the
# recent average window; growth = log2 of kills in the
# last full minute over the first; straight = mean net displacement over path walked per
# 600-tick window; crowd = enemies alive, averaged over the game.
fun_burst_kills = 10
fun_burst_ratio = 2.0
# World units the play window shows: ps_render.h c_render opens a 960x960 window drawn at
# min(width, height) * 1.25 / arena_size = 25 pixels per unit, so 960 / 25 = 38.4 each way.
fun_view_width = 38.4
fun_view_height = 38.4
fun_tension_lo = 0.15
fun_tension_hi = 0.50
fun_tension_soft = 0.30
fun_damage_lo = 1.0
fun_damage_hi = 4.0
fun_damage_soft = 1.5
fun_survival_lo = 0.85
fun_survival_hi = 1.0
fun_survival_soft = 0.30
fun_coverage_lo = 0.03
fun_coverage_hi = 0.25
fun_coverage_soft = 0.10
fun_combo_lo = 0.30
fun_combo_hi = 1.0
fun_combo_soft = 0.20
fun_burst_lo = 0.20
fun_burst_hi = 0.70
fun_burst_soft = 0.20
fun_growth_lo = 3.0
fun_growth_hi = 5.3
fun_growth_soft = 1.5
fun_straight_lo = 0.15
fun_straight_hi = 0.50
fun_straight_soft = 0.20
fun_crowd_lo = 200.0
fun_crowd_hi = 256.0
fun_crowd_soft = 60.0

[policy]
hidden_size = 128
num_layers = 2

[train]
gpus = 1
total_timesteps = 500000000
learning_rate = 0.0005
anneal_lr = 1
min_lr_ratio = 0.1
# 0.985 until 2026-11-16: about a one second horizon at 60 ticks/s. 0.997 (about 5.5 s):
# sampled play survives 83% of the game instead of 75%, mean level 38 vs 30.
gamma = 0.997
gae_lambda = 0.99
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
# Was 0.082 until 2026-11-16: at that size the entropy bonus (~0.28 per step) swamped the
# game's reward and held movement at uniform random for the whole run (entropy 3.39 of
# 3.40). 0.005: greedy play survives 93% of the game instead of 77%, mean level 39 vs 7.
ent_coef = 0.005
# Decays to min_ent_coef_ratio (0.1) of that over the run, so sampled play commits late on.
anneal_ent_coef = 1
momentum = 0.95
minibatch_size = 4096
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0

[sweep]
# Game-number sweep: the score is the fun scorecard (env/fun) of the policy trained under
# each setting. Trainer, model and reward dimensions are pinned; only the [sweep.env.*]
# game dimensions at the end of this file vary. downsample = 1 so the history file records
# every trial's final score. Launch with --base.eval_episodes=2048 --base.eval_agents=2048
# --base.eval_greedy=0: the score is then that many full games played by the final policy,
# sampling its actions (it takes two to three times the damage of greedy play, closer to a
# person than a bot that almost never gets hit). Without an evaluation the score is read
# from the last training log, which only holds the episodes that ended in the final seconds
# of training (mostly deaths).
# upgrade_area_bonus and whirlpool_pull are pinned: whether Area does anything and how hard
# Whirlpool pulls are design choices, and the first sweep drove both to their minimum.
metric = fun
metric_distribution = linear
goal = maximize
max_suggestion_cost = 1200
max_runs = 150
gpus = 1
downsample = 1
prune_pareto = 1
early_stop_quantile = 0.3

[sweep.train.gamma]
distribution = logit_normal
min = 0.997
max = 0.997
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.99
max = 0.99
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0005
max = 0.0005
scale = auto

[sweep.train.horizon]
