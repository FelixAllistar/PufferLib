enemy_radius_default = 0.32
enemy_radius_jelly = 0.35
enemy_radius_urchin = 0.4
enemy_radius_eel = 0.3
elite_radius = 0.8
boss_radius = 2
ari_k_radius = 4
ari_k_half_width = 4.65
ari_k_half_height = 4.65

# Obstacle footprints and obstacle placement spacing.
obstacle_radius_min = 1.5
obstacle_radius_max = 3
obstacle_spawn_clearance = 6

# Spawn envelopes/margins. These affect placement, not sprite size.
enemy_spawn_radius = 0.45
enemy_spawn_padding = 0.25
drop_spawn_radius = 0.25

# Spawn/layout tuning. Ratios are relative to half the arena width.
obstacle_player_spawn_clearance = 22.0
obstacle_spawn_min_ratio = 1.45
obstacle_spawn_max_ratio = 1.70
obstacle_fallback_min_ratio = 1.45
obstacle_fallback_max_ratio = 1.70
obstacle_fallback_angle_step = 2.3999632
