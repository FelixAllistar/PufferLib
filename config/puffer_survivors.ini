[base]
env_name = puffer_survivors
cudagraphs = 10
checkpoint_interval = 100
eval_episodes = 1000

[vec]
total_agents = 5120
num_buffers = 5
num_threads = 20
gpu_env = 1

[env]
arena_size = 48.0
max_steps = 24000
wave_length_steps = 600
enemy_cap = 256
projectile_cap = 512
drop_cap = 192
obstacle_count = 14
enemy_spawn_rate = 0.085
elite_spawn_rate = 0.006
player_speed = 0.18
player_health = 8
enemy_speed = 0.0875
enemy_hp_scale = 0.65
enemy_damage_scale = 1.0
spawn_ramp = 3.2
projectile_speed = 0.42
projectile_damage = 1.0
fire_cooldown = 22.0
pickup_radius = 0.65
magnet_radius = 3.4
health_drop_rate = 0.045
health_heal = 3
reward_xp = 0.0
reward_kill = 0.0271491
reward_damage = 0.0
reward_survival = 0.0051241
reward_hurt = -1.533688
reward_death = -1.0
reward_success = 1.0
reward_pickup = 0.0200598
reward_levelup = 0.0396332
obstacle_penalty = -0.01
contact_damage = 1.0
invuln_steps = 36
enemy_obstacle_stride = 1
# V9 preserves every v6 input and appends exact obstacle coordinates. Legacy
# 348-input checkpoints are migrated by zero-padding their new encoder columns.
observation_version = 9
free_upgrade = -1
free_upgrade_count = 0
show_hitboxes = 0

[policy]
hidden_size = 32
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 200000000
learning_rate = 0.001
anneal_lr = 0
min_lr_ratio = 0.1
gamma = 0.9924325996831389
gae_lambda = 0.97
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.000822490646889698
momentum = 0.95
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[sweep]
method = Protein
metric = perf
metric_distribution = linear
goal = maximize
max_suggestion_cost = 1200
max_runs = 8
gpus = 1
downsample = 20
use_gpu = False
prune_pareto = True
early_stop_quantile = 0.3

[sweep.env.reward_kill]
distribution = log_normal
min = 0.01
max = 0.03
scale = auto

[sweep.env.reward_survival]
distribution = log_normal
min = 0.003
max = 0.006
scale = auto

[sweep.env.reward_hurt]
distribution = uniform
min = -1.8
max = -1.1
scale = auto

[sweep.env.reward_pickup]
distribution = log_normal
min = 0.018
max = 0.03
scale = auto

[sweep.env.reward_levelup]
distribution = log_normal
min = 0.025
max = 0.06
scale = auto
