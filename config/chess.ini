[base]
env_name = chess
# No end-of-training eval (10000 games took longer than a sweep trial). Evals pass --base.eval_episodes.
eval_episodes = 0

[selfplay]
enabled = 1
max_size = 500
# Resample frozen opponents from the pool every N steps (swept; 50M = never within one trial).
opp_timeout_steps = 50_000_000

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 8
num_policies = 2
hist_policy_percent = 0.125
hist_policy_hidden_size = 512
hist_policy_num_layers = 3

[env]
max_moves = 5000
reward_draw = 0
reward_invalid_piece = 0
reward_invalid_move = 0
reward_repetition = 0
# Reward per Italian book move (zero-sum: the other side loses it). 0 = off.
book_reward = 0.05
# Charged to a side that leaves the book from a book position (paid to the other side). 0 = off.
book_penalty = 0.3
enable_50_move_rule = 1
enable_threefold_repetition = 1
mode = 1
random_fen = 0
render_fps = 30
fen_curric_pct = 0.5

[policy]
hidden_size = 512
num_layers = 3

# 2026-11-03: the rules_book recipe (reports/chess_20261101/README.md; build with -DCHESS_RULES -DCHESS_PAIRED) with
# entropy 0 and no LR annealing, as the starting point of the book-move sweep below.
[train]
total_timesteps = 50_000_000
learning_rate = 0.003
anneal_lr = 0
min_lr_ratio = 0.086914
gamma = 0.999
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.557019
vf_coef = 4.37465
vf_clip_coef = 1.69524
max_grad_norm = 3.54293
ent_coef = 0
anneal_ent_coef = 0
magnet_coef = 0.03
magnet_tau = 0.01
momentum = 0.972205
minibatch_size = 8192
horizon = 64

# Book-move sweep (2026-11-03): 50M steps per trial, scored by env/book_moves (Italian book moves per game, both
# sides, at the end of training); book_reward and the FEN curriculum are fixed so the score cannot be raised by
# rewarding or seeding the book more. Locked: network size 512x3 (frozen self-play banks must match the learner),
# replay ratio 1, entropy 0. Swept: batch shape, PPO clips and coefficients, V-trace, magnet, opponent pool.
[sweep]
metric = book_moves
goal = maximize
downsample = 1
max_runs = 500
history_path = reports/chess_20261101/sweep_book/sweep.history
# No early stopping: the magnet starts slower and ends better, so mid-run cuts would bias against it.
early_stop_quantile = 0

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 5e7
scale = time

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 1
scale = auto

[sweep.train.ent_coef]
distribution = uniform
min = 0
max = 0
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 512
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 3
max = 3
scale = auto

# GPU memory (16 GB) caps agents x horizon at 4096 x 64 (11 GB; 8192 x 64 and 4096 x 128 fail to allocate). The
# too-big corners fail in ~20 s and Protein learns to avoid them.
[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 4096
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 1
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

# Steps of 1/16 keep the learner rows (agents minus frozen-opponent rows) at 64 x (8..15), so the minibatch always
# divides them (an unstepped 0.178 left 933 rows = 3 x 311, and the minibatch fell from 2048 to 96).
[sweep.vec.hist_policy_percent]
distribution = uniform
min = 0.0625
max = 0.5
step = 0.0625
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 16384
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.8
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 3.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.magnet_coef]
distribution = log_normal
min = 0.003
max = 0.3
scale = auto

[sweep.train.magnet_tau]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.train.vtrace]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 2.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.5
max = 1.0
scale = auto

[sweep.selfplay.opp_timeout_steps]
distribution = log_normal
min = 1e6
max = 5e7
scale = auto
