[base]
env_name = chess
# No end-of-training eval (10000 games took longer than a sweep trial). Evals pass --base.eval_episodes.
eval_episodes = 0

[selfplay]
enabled = 1
max_size = 500
# Resample frozen opponents from the pool every N steps (swept).
opp_timeout_steps = 50_000_000
# Each trial's score: its final checkpoint plays 300 games vs Maia-1100 ([bot_eval]: env mode 4, from the start),
# win 1 / draw 0.5 + 0.05 per book move it plays. Run with MAIA_LC0_PATH=reports/chess_20261101/uci_maia_sample.py
# (sampled Maia: top-move Maia repeats a few lines, see reports/chess_20261101/README.md), MAIA_LC0_BIN=./lc0bin,
# MAIA_TEMP=1, MAIA_WEIGHTS_PATH=lc0/maia-1100.pb.gz, MAIA_NODES=1. One rung: the [bot_eval] mode picks the opponent.
eval_bot_games = 300
eval_bots = 4
eval_bot_envs = 32
eval_bot_threads = 8

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 24
num_policies = 2
hist_policy_percent = 0.125
# Frozen self-play banks must match the learner (network size is never swept: 256x2 tests, 1024x2 real runs).
hist_policy_hidden_size = 1024
hist_policy_num_layers = 2

[env]
max_moves = 5000
reward_draw = 0
reward_invalid_piece = 0
reward_invalid_move = 0
reward_repetition = 0
# Reward per Italian book move (zero-sum: the other side loses it). 0 = off.
book_reward = 0.05
# Charged to a side that leaves the book from a book position (paid to the other side). 0 = off.
book_penalty = 0.3
# Eval only (keep 0 here): vs a fixed opponent, perf also counts the learner's book moves at this weight ([bot_eval]).
perf_book_weight = 0
enable_50_move_rule = 1
enable_threefold_repetition = 1
mode = 1
random_fen = 0
render_fps = 30
fen_curric_pct = 0.5

[bot_eval]
mode = 4
fen_curric_pct = 0
perf_book_weight = 0.05

[policy]
hidden_size = 1024
num_layers = 2

# 2026-11-04: the rules_book recipe (23% vs top-move Maia-1100 at 917M, the best player so far; build with
# -DCHESS_RULES -DCHESS_PAIRED) at 1024x2, as the sweep's starting point.
[train]
total_timesteps = 400_000_000
learning_rate = 0.003
anneal_lr = 1
min_lr_ratio = 0.086914
gamma = 0.999
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.557019
vf_coef = 4.37465
vf_clip_coef = 1.69524
max_grad_norm = 3.54293
ent_coef = 0.01
anneal_ent_coef = 1
min_ent_coef_ratio = 0.1
magnet_coef = 0.03
magnet_tau = 0.01
momentum = 0.972205
minibatch_size = 8192
horizon = 64
vtrace = 0

# Sweep (2026-11-04, sweep_1024): scored by the sampled-Maia bot eval above. Swept: training length, LR and entropy
# annealing, PPO coefficients and clips, batch shape, frozen-opponent share and refresh, magnet, V-trace. Locked:
# network 1024x2, replay ratio 1, book reward / penalty and the FEN curriculum (they would change the score itself).
[sweep]
metric = book_moves
goal = maximize
downsample = 1
max_runs = 500
history_path = reports/chess_20261101/sweep_1024/sweep.history
# No early stopping: the magnet starts slower and ends better, so mid-run cuts would bias against it.
early_stop_quantile = 0

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 1e9
scale = time

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 1
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 1024
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 2
max = 2
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 1
scale = auto

# GPU memory (16 GB) caps agents x horizon; too-big corners fail to allocate in seconds and count as failed trials.
[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 4096
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048
max = 16384
scale = auto

# Steps of 1/16 keep the learner rows a multiple of 64, so the minibatch always divides them.
[sweep.vec.hist_policy_percent]
distribution = uniform
min = 0.0625
max = 0.5
step = 0.0625
scale = auto

[sweep.selfplay.opp_timeout_steps]
distribution = log_normal
min = 1e6
max = 1e8
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.01
scale = auto

[sweep.train.anneal_lr]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_lr_ratio]
distribution = log_normal
min = 0.01
max = 0.5
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.03
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.8
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 3.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.02
max = 5.0
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.magnet_coef]
distribution = log_normal
min = 0.003
max = 1.0
scale = auto

[sweep.train.magnet_tau]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.train.vtrace]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 2.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.5
max = 1.0
scale = auto
