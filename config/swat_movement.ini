[base]
env_name = swat_movement
seed = 2718
async = 0
load_model_path = None
run_id = movement
checkpoint_dir = build/swat/checkpoints
log_dir = build/swat/logs
checkpoint_interval = 50
eval_episodes = 40

[vec]
total_agents = 64
num_buffers = 1
num_threads = 4

[env]
seed = 2718
# -1 mixes courses/roles; fix them for a curriculum or individual evaluation.
# stage: 0 goal, 1 stairs, 2 crouch clearance, 3 door, 4 pre-breached wall.
stage = -1
# role: 0 officer, 1 suspect. This trains movement, not combat.
role = -1
# One decision advances four real physics ticks; 300 decisions = 20 seconds.
max_steps = 300
progress_reward = 0.15
step_cost = 0.002
success_reward = 2
fall_penalty = 2

[policy]
hidden_size = 64
num_layers = 2

[train]
gpus = 1
total_timesteps = 1000000
learning_rate = 0.0003
anneal_lr = 1
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.005
horizon = 64
minibatch_size = 2048
reward_clip = 0

[sweep]
metric = perf
goal = maximize
