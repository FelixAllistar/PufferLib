[base]
package = ocean
env_name = puffer_gpudrive
policy_name = GPUDrive
rnn_name = Recurrent
vec = multiprocessing

[policy]
input_size = 64
hidden_size = 512

[rnn]
input_size = 512
hidden_size = 512

[env]
num_envs = 75
reward_vehicle_collision = 0
reward_offroad_collision = 0

[train]
total_timesteps = 150_000_000
learning_rate = 0.005
num_workers = 8
num_envs = 8
env_batch_size = 8
anneal_lr = True
batch_size = 297984
minibatch_size = 16384
bptt_horizon = 64

[sweep.env.reward_vehicle_collision]
distribution = uniform
min = -1.0
max = -0.25
mean = -0.5
scale = auto 

[sweep.env.reward_offroad_collision]
distribution = uniform
min = -1.0
max = -0.25
mean = -0.5
scale = auto
