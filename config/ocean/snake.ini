[base]
package = ocean
env_name = puffer_snake
vec = multiprocessing
policy_name = Snake
rnn_name = Recurrent

[env]
num_envs = 8
width = 640
height = 360
num_snakes = 256
num_food = 4096
vision = 5
leave_corpse_on_death = True
reward_food = 0.05776165516464438
reward_corpse = 0
reward_death = -1.0

[train]
total_timesteps = 70_000_000
num_envs = 2
num_workers = 2
env_batch_size = 1
batch_size = 131072
update_epochs = 1
minibatch_size = 8192
bptt_horizon = 32
anneal_lr = False
gae_lambda = 0.9492405273670754
gamma = 0.9728157183224302
clip_coef = 0.011102333784435113
vf_coef = 0.3403069830175013
vf_clip_coef = 0.26475190539131727
max_grad_norm = 1.9352931454183562
ent_coef = 0.0011184611855558752
learning_rate = 0.0024737126219394156
checkpoint_interval = 1000
device = cuda

use_diayn = True
diayn_archive = 2
diayn_coef = 0.43706788000170893
diayn_loss_coef = 1.2174636732278752

[sweep]
method = protein 
name = sweep
max_score = None

[sweep.metric]
goal = maximize
name = score 
min = 0
max = None

[sweep.env.num_envs]
distribution = uniform_pow2
min = 1
max = 32
mean = 16
scale = auto

[sweep.env.reward_food]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.1
scale = auto

[sweep.env.reward_corpse]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.1
scale = auto

[sweep.env.reward_death]
distribution = uniform
min = -1.0
max = 0.0
mean = -1.0
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 2e8
mean = 1e8
scale = auto
