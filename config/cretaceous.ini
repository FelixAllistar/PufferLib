[base]
env_name = cretaceous
seed = 42
checkpoint_interval = 50
cudagraphs = 1
# Episodes are 18000 ticks; the default 10000 eval episodes would run for hours.
eval_episodes = 64

[vec]
# Agents per env come from env.num_agents; every dinosaur is a learner.
total_agents = 4096
num_buffers = 2
# Local box: 4. Rented boxes pin their own count (Vast quota is ~25 CPUs).
num_threads = 4

[env]
# Six species from a fixed rotation (MIX in sim.c). Policy contract 4: 243 obs floats,
# action heads {5, 5, 3, 2, 7} (the last: none, attack, eat or drink, call, ability 1-3).
num_agents = 16
world_seed = 1
world_n = 2048
world_cell = 4
max_ticks = 18000
# Survival (seconds): a death respawns the agent as a new animal after respawn_ticks.
respawn_ticks = 1
growth_seconds = 1200
hunger_seconds = 900
thirst_seconds = 600
# Day length in real seconds; weather 1 lets cloud cover drift through fair,
# overcast and rain spells (looks only: it never changes the sim).
day_seconds = 1200
weather = 0
# Reward per tick: alive; per stomach of food or water gained; per victim
# max-health of damage dealt; per own max-health of damage taken; per kill;
# per death; per unit of growth (hatchling 0.35 to adult 1).
reward_alive = 0.001
reward_food = 1.0
reward_water = 1.0
reward_damage_dealt = 0.5
reward_damage_taken = 1.0
reward_kill = 1.0
reward_death = 1.0
reward_growth = 2.0
# Per quest completed (progress.c: drink, graze, hunt, patrol, defend; group quests count for each member).
reward_quest = 0.25

[policy]
# 256x2 for testing; 1024x2 for good runs. Size is never swept.
hidden_size = 256
num_layers = 2
# 1: structured encoder (self MLP, species embedding, terrain-patch conv, masked attention + max pooling over
# neighbours; ocean/cretaceous/docs/encoder.md). 0: PufferLib's default linear encoder (checkpoints before 2026-11-07).
cretaceous_net = 0

[train]
total_timesteps = 100000000
learning_rate = 0.0003
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.005
horizon = 64
minibatch_size = 4096
replay_ratio = 1.0

[sweep]
metric = perf
goal = maximize

# Pinned: replay_ratio and network size are never swept.
[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 1
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 256
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 2
scale = auto
