[base]
env_name = cretaceous
seed = 42
checkpoint_interval = 50
cudagraphs = 1
# Episodes are 18000 ticks; the default 10000 eval episodes would run for hours.
eval_episodes = 64

[vec]
# Agents per env come from env.num_agents; every dinosaur is a learner.
total_agents = 4096
num_buffers = 2
# Local box: 4. Rented boxes pin their own count (Vast quota is ~25 CPUs).
num_threads = 4

[env]
num_agents = 16
world_seed = 1
world_n = 2048
world_cell = 4
max_ticks = 18000

[policy]
# 256x2 for testing; 1024x2 for good runs. Size is never swept.
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 100000000
learning_rate = 0.0003
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.005
horizon = 64
minibatch_size = 4096
replay_ratio = 1.0

[sweep]
metric = perf
goal = maximize

# Pinned: replay_ratio and network size are never swept.
[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 1
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 256
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 2
scale = auto
