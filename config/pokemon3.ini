[base]
# Gen 3 random battles (2026-11-06): ocean/pokemon3, a port of ocean/pokemon9 (poke-engine Gen 3 + Showdown turn-1
# positions, mirror self-play on both seats, partial-information observations).
env_name = pokemon3
load_model_path = None
checkpoint_interval = 50
async = 1
cudagraphs = 1

[vec]
total_agents = 8192
num_buffers = 1
num_threads = 24
num_policies = 1

[selfplay]
enabled = 0
# After training: win rate of agent 0 against side two playing uniformly random legal actions (bot_policy 1).
eval_bot_games = 2000
eval_bots = 1

[env]
num_agents = 2
# One poke-engine state per line, from ocean/pokemon3/build_positions.js.
positions = build/pokemon3/positions.txt
seed = 3
# Side two instead of agent 1 (evaluation; see pokemon3.h): 1 random legal moves, 2 the max-damage baseline, 3 poke-engine
# MCTS (full information) with mcts_iterations per decision.
bot_policy = 0
mcts_iterations = 200
# Team mode (ocean/pokemon3/build_sets.js tables; pool = None plays env.positions): set table, team pool, draft
# catalog and cores; share of seats that draft their own team; forced cores and the env step they anneal to 0 at.
sets = None
pool = None
draft = None
cores = None
free_fraction = 0
# Top teams (2026-11-08): a pool file of the best teams (same format as pool) and the share of pool seats drawn from it.
top_pool = None
top_fraction = 0
force_core_prob = 0
force_core_steps = 0
# Diagnostics: append every finished team-mode game (result, who drafted, turns, both teams) to this file.
draft_log = None
# 1: matchup features (effectiveness, damage, KO per move vs the other active); 0 zeroes them (A/B control).
matchup = 1

[policy]
# 256x2 for tests, 1024x2 for real runs (the house rule; sizes are not swept).
hidden_size = 256
num_layers = 2
# 1: the structured Gen 3 net (ocean/pokemon3/pokemon3_encoder.cu: shared move and Pokemon MLPs, fusion MLP, pointer
# decoder for battle actions); 0: the default linear encoder/decoder (checkpoints before 2026-11-07).
pokemon3_net = 0
# Structured net widths: move/Pokemon embedding and entity-MLP hidden (multiples of 8).
pokemon_embed = 32
pokemon_mid = 64

[train]
total_timesteps = 200000000
learning_rate = 0.001
anneal_lr = 1
ent_coef = 0.01
gamma = 0.995
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 1
max_grad_norm = 1
horizon = 64
minibatch_size = 16384
