[base]
env_name = webnav_family
load_model_path = None
eval_episodes = 0
async = 0
checkpoint_interval = 10

[vec]
total_agents = 512
num_buffers = 2
num_threads = 2
num_policies = 1
action_mask_size = 17

[env]
# Ten verified click-family tasks, bit i selects task i. Use one bit to
# measure a task independently. The offset keeps evaluation seeds separate.
task_mask = 1023
seed_offset = 0
# Mix the original train/test data modes to teach instruction following.
# Use data_mode=0 to reproduce the benchmark's training split, and 1 to
# evaluate its test split. A mixed-mode run is not a held-out mode test.
data_mode = 2
# Set to 1 with --env.semantic=1 to add frozen Potion similarity features.
semantic = 0

[policy]
hidden_size = 64
num_layers = 1

[train]
total_timesteps = 1_000_000
learning_rate = 0.015
minibatch_size = 4096
horizon = 32
ent_coef = 0.002
gamma = 0.95
replay_ratio = 1
