[base]
env_name = kaggriculture
seed = 73
async = 0
cudagraphs = 1
rank = 0
world_size = 1
gpu_id = 0
gpu_offset = 0
nccl_id = None
profile = 0
# Fresh 256-wide restart. Set this explicitly when continuing a compatible run.
load_model_path = 'saved/kaggriculture_league_v5/run_1785956507493_0000000429916160.bin'
# 2048 agents x 16 steps saves at roughly the old 3.28M-step cadence.
checkpoint_interval = 20
checkpoint_dir = checkpoints
log_dir = logs
eval_episodes = 10
num_games = 0
burnin_games = 0
eval_agents = 0
load_enemy_model_path = None
enemy_hidden_size = 0
enemy_num_layers = 0
run_id = None
result_fd = 0
wandb = 0
slowly = 0
eval_epoch_mult = 1
reset_every_horizon = 0

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 4
# V4: 12 unit heads plus ten conditional STOP/command/quantity market slots.
action_mask_size = 838
gpu_env = 0
# One physical opponent bank is required even when the native rules bot
# overrides every opponent action. Zero banks degenerates to learner mirror.
num_frozen_banks = 1
frozen_bank_pct = .50
frozen_bank_hidden_size = 128
frozen_bank_num_layers = 2

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[selfplay]
enabled = 1
max_size = 128
seed = 42
# Set to zero for a fixed external opponent pool. Positive values periodically
# add the current learner to the historical pool at this agent-step interval.
snapshot_interval = 1000000
# Fresh 256-wide run: do not load the old 32-wide V4 league. PSRO will write
# a compatible pool after this run is evaluated and admitted to V5.
opponent_pool = 'saved/kaggriculture_league_v5/run_1785956507493_0000000429916160.bin,saved/kaggriculture_league_v5/bootstrap_18m.bin,saved/kaggriculture_league_v5/bootstrap_32m.bin,saved/kaggriculture_league_v5/bootstrap_500m.bin'
opponent_pool_weights = 'None'
opponent_pool_prob = 0.15
pfsp_mode = 'variance'
pfsp_alpha = 1
pfsp_uniform_mix = 0.1
payoff_ema = 0.1
opp_timeout_steps = 1000000
eval_pool_size = 1
eval_games = 50
eval_metric = 'money'
eval_agents = 8192

[env]
curriculum_stage = 6
# 0 normal, 1 paid NW+NE management, 2 NE-only spatial drill.
curriculum_preunlocked_land = 0
episode_steps = 720
board_size = 10
starting_money = 3000
max_market_orders_per_turn = 10
# Structural ablation 1: one usable ordered market slot and at most eight
# hired hands on both learned and scripted sides. The official core limits stay
# unchanged; the adapter forces every later policy slot to STOP.
policy_market_slots = 7
policy_max_hands = 10
turns_per_day = 24
shed_capacity = 100
weed_spawn_chance = 0.005
town_shop_unlock_interval = 3
town_shop_sell_interval = 4
town_center_sell_interval = 12
farm_hand_cost_mult = 1
seed = 42
# Coherent v3 economic-continuation reward tuple. Keep these values together:
# this exact scale/outcome/asset balance produced steadily rising fixed money.
# The one-slot/eight-hand limits above remain the only structural ablation.
reward_potential_scale = 0.000772047148
reward_win = 0.375989795
reward_seed_value = 0.01
reward_product_value = 0.95
reward_crop_value = 1
reward_animal_value = 0.95
reward_land_value = 1
reward_neglect_discount = 0.5
reward_liquidation_days = 6
reward_productive_action = 0.0002
# Apply -reward_inactivity at terminal when money remains within $2 of $3000.
reward_inactivity = 3
reward_neglect_death = 0.05
# Full stage-6 game from reset. Bot-opponent games are split by the native
# script fraction first, then the remaining bot lane uses rules/specialists.
bot_opponent_fraction = 0.75
bot_rules_fraction = 0.25
# Among bot-opponent games, use the four native public-policy tapes for
# diversity. The adaptive fraction is taken from the non-tape lane and rotates
# the three native state-reactive notebook ports. The remaining bot games
# retain the generic market bot and crop specialists.
bot_script_fraction = 0.35
bot_adaptive_fraction = 0.35

[train]
total_timesteps = 500_000_000
learning_rate = 0.002
anneal_lr = 0
gamma = 0.999899983
gae_lambda = 0.98
# 32,768 transitions per rollout instead of 131,072: four times more policy
# refreshes while retaining a 2048-agent inference batch. Do one PPO pass only:
# async collection is already one update behind, so replaying the same rollout
# made KL and clipfrac explode and cut SPS without improving fixed-opponent play.
replay_ratio = 1
clip_coef = 0.1
vf_coef = 1
vf_clip_coef = 0.5
max_grad_norm = 0.5
# Coherent v3 optimizer/EMAg tuple. Horizon 16 refreshes the acting policy every
# 32,768 transitions; horizon 128 delayed each refresh until 262,144 and yielded
# only 190 rollout updates in a 50M run.
ent_coef = 0.003
emag_kl_coef = 0.03
emag_tau = 0.0001
anneal_ent_coef = 0
momentum = 0.9
minibatch_size = 4096
horizon = 128
prio_alpha = 0
prio_beta0 = 0.6
epoch_sampling = 1
gpus = 1

# Warm-started selfplay/training sweep. Use sweep_selfplay.sh to initialize every
# trial from one competent checkpoint and rank final policies by seat-balanced
# money against the same eight-policy external panel.
[sweep]
# Sweep selection penalizes policies that finish at the untouched starting bank.
# Dashboard score remains literal final money.
metric = sweep_score
metric_distribution = linear
goal = maximize
# A 100M continuation trial can exceed five minutes on the current GPU. Keep
# the optimizer's cost ceiling above a complete trial instead of treating every
# useful sample as over-budget.
max_suggestion_cost = 1200
max_runs = 48
gpus = 0
downsample = 1
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
# Safe default is the staged hyper search used by sweep_v2.sh. Reward and
# selfplay-composition searches are separate experiments; combining all of them
# creates a sparse, confounded 20+ dimensional sweep. replay_ratio remains 1:
# repeated passes over stale async rollouts caused destructive KL spikes.
sweep_only = train.learning_rate, train.ent_coef, train.gamma, train.gae_lambda, train.horizon, train.minibatch_size, train.clip_coef, train.vf_coef, train.vf_clip_coef, train.max_grad_norm, train.emag_kl_coef, train.emag_tau

[sweep.vec.num_frozen_banks]
distribution = uniform_pow2
min = 1
max = 4
scale = auto

[sweep.selfplay.opponent_pool_prob]
distribution = uniform
min = 0.25
max = 0.75
scale = auto

[sweep.selfplay.pfsp_alpha]
distribution = log_normal
min = 0.25
max = 2.0
scale = auto

[sweep.selfplay.pfsp_uniform_mix]
