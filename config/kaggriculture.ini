[base]
env_name = kaggriculture

[vec]
total_agents = 256
num_buffers = 1
num_threads = 1
num_policies = 1

[env]
# 2 = both seats use the learner; 1 = learner_seat versus bot_policy.
num_agents = 2
learner_seat = 0
# 0 pass, 1 native reactive rules. Not a checkpoint league.
bot_policy = 1
market_slots = 10
max_hands = 16
land_buy_min_days = 0
# Only terminal cash gain / 3000; retain its magnitude without clipping.
reward_money = 1.0
# 0 gives fresh starts and does not load the bank, including for evaluation.
reset_state_prob = 0
reset_state_bank = None

[policy]
# Entity encoder and separate task/market/value heads; upstream MinGRU core.
hidden_size = 128
num_layers = 1

[train]
# Qualification profile, not a tuned training baseline.
total_timesteps = 1048576
learning_rate = 0.001
reward_clip = 0
horizon = 64
minibatch_size = 4096
