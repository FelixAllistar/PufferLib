bot_rules_fraction = 0
bot_script_fraction = 0
bot_adaptive_fraction = 0

[policy]
hidden_size = 512
num_layers = 2
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
use_rnn = 1

gpus = 1
seed = 42
total_timesteps = 500000000
learning_rate = 0.00015
anneal_lr = 0
min_lr_ratio = 0.1
gamma = 0.99970
gae_lambda = .999
replay_ratio = 1
clip_coef = 0.158850163
vf_coef = 0.249999985
vf_clip_coef = 0.31161955
max_grad_norm = 0.750745416
# Keep economic returns linear: $200k must remain better than $100k. PPO
# advantages and the critic loss are normalized downstream, so Kaggriculture
# does not need the generic legacy [-1, 1] reward clamp.
reward_clip = 0
ent_coef = 0.0006
# No anchor: this cold-start curriculum must be free to discover an intentionally
# exaggerated expansion opening.
emag_kl_coef = 0
emag_tau = 0
emag_cutoff = 1
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.9
minibatch_size = 4096
horizon = 128
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0
prio_beta0 = 0.6
epoch_sampling = 1

[sweep]
metric = money
metric_distribution = linear
goal = maximize
max_suggestion_cost = 300
max_runs = 500
gpus = 0
downsample = 1
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
# Start with enough space-filling Sobol trials to learn the broad reward
# landscape, then retain explicit exploration instead of collapsing forever
# around an early high-scoring corner. Guided iterations also reserve part of
# their acquisition batch for globally sampled candidates.
random_samples = 16
global_random_fraction = 0
global_candidate_fraction =0
# Only optimize learning/credit-assignment strength. Product, crop, animal,
# seed, and land coefficients stay at their fitted calibration; win reward is
# fixed at zero so Protein selects strictly on final cash.
sweep_only = train.learning_rate,env.reward_progress_scale,env.reward_progress_terminal_money_scale,env.reward_progress_liquidation_days

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 1e11
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

