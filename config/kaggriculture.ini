[base]
env_name = kaggriculture
load_model_path = saved/kaggriculture/initial_bc.bin
# Final checkpoint only; selfplay also saves its initial checkpoint.
checkpoint_interval = 0
# External reset-free eval/PSRO uses run.py, not inherited training resets.
eval_episodes = 0
eval_agents = 128
run_id = None
async = 1
# -1 disables graphs; 0 enables them. Both are searched below.
cudagraphs = -1

[vec]
total_agents = 2048
num_buffers = 2
num_threads = 16
num_policies = 5
hist_policy_hidden_size = 256
hist_policy_num_layers = 2
hist_policy_percent = 0.75

[selfplay]
enabled = 1
initial_opponents = None
# Fixed during a run; refresh from the external league between runs.
opp_timeout_steps = 0
eval_games = 0
eval_bot_games = 0

[env]
# 2 = mirror/checkpoint games; 1 = learner_seat versus bot_policy.
num_agents = 2
learner_seat = 0
# 0 pass, 1 native reactive rules. Not a checkpoint league.
bot_policy = 1
market_slots = 10
max_hands = 16
land_buy_min_days = 0
# Trial-zero baseline: terminal cash gain / 3000. Reward mix is swept below.
reward_money = 1
# Optional shaped components; zero in the baseline, searchable in other trials.
reward_growth_land = 0
reward_growth_crop = 0
reward_growth_animal = 0
reward_alive_daily = 0
reward_quality_scale = 0
reward_quality_idle_cost = 0
reward_target_plots = 3
reward_target_crops = 45
reward_target_animals = 15
# 0 gives fresh starts and does not load the bank, including for evaluation.
reset_state_prob = 0.8
reset_state_bank = data/kaggriculture/reset.kgb

[policy]
# Entity encoder and separate task/market/value heads; upstream MinGRU core.
hidden_size = 256
num_layers = 2

[train]
# BC actor initialization only; PPO learns the value head normally.
gpus = 1
# Native training rounds down to complete agents * horizon batches.
total_timesteps = 30000000
learning_rate = 0.0005
gamma = 0.99
gae_lambda = 0.995023446
ent_coef = 0
anneal_ent_coef = 0
min_ent_coef_ratio = 0.259882718
anneal_lr = 0
min_lr_ratio = 0.119832993
reward_clip = 0
# Power-of-two sweep baseline; still 64 sequences, like 360 / 23040.
horizon = 256
minibatch_size = 16384
replay_ratio = 2

[bc]
# Standalone offline application. These settings never alter PPO.
mode = actor
data = data/kaggriculture/terminal.bc
output = saved/kaggriculture/offline.bin
epochs = 20
batch = 1
learning_rate = 0.00005
value_coef = 1
# Qualification limiter; 0 uses every training and held-out episode.
max_batches = 0

# Start with ./puffer_cpu sweep. No model-size or step-budget sweep dimensions.
# Resource ranges are deliberately broad: failed/OOM trials are Protein evidence.
# root_money compares fresh-start cash, not reset-bank starting wealth or rewards.
# This is a training metric, not a held-out leaderboard evaluation.
[sweep]
metric = root_money
metric_distribution = linear
goal = maximize
max_runs = 500
# One independent trial per visible GPU (train.gpus = 1).
gpus = -1
# Final-score observations also enable Protein's success/failure classifier.
downsample = 1
max_suggestion_cost = 3600
prune_pareto = 1
early_stop_quantile = 0.3

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 16384
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 8
scale = auto

[sweep.vec.num_threads]
distribution = uniform_pow2
min = 4
max = 32
scale = auto

[sweep.base.cudagraphs]
distribution = int_uniform
min = -1
max = 0
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 720
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 512
max = 65536
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.000001
max = 0.03
scale = auto

[sweep.train.ent_coef]
distribution = uniform
min = 0
max = 0.01
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.99999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 8
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 4
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.reward_clip]
distribution = int_uniform
min = 0
max = 10
scale = auto

[sweep.env.reward_money]
distribution = log_normal
min = 0.25
max = 8
scale = auto

[sweep.env.reward_growth_land]
distribution = uniform
min = 0
max = 8
scale = auto

[sweep.env.reward_growth_crop]
distribution = uniform
min = 0
max = 4
scale = auto

[sweep.env.reward_growth_animal]
distribution = uniform
min = 0
max = 8
scale = auto

[sweep.env.reward_alive_daily]
distribution = uniform
min = 0
max = 2
scale = auto

[sweep.env.reward_quality_scale]
distribution = uniform
min = 0
max = 2
scale = auto

[sweep.env.reward_quality_idle_cost]
distribution = uniform
min = 0
max = 1
scale = auto

[sweep.env.reward_target_plots]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.env.reward_target_crops]
distribution = int_uniform
min = 0
max = 90
scale = auto

[sweep.env.reward_target_animals]
distribution = int_uniform
min = 0
max = 45
scale = auto

[sweep.env.reset_state_prob]
distribution = uniform
min = 0
max = 0.9
scale = auto

# Keep the BC architecture and trial budget fixed without changing other environments.
[sweep.train.total_timesteps]
min = 30000000
max = 30000000

[sweep.policy.hidden_size]
min = 256
max = 256

[sweep.policy.num_layers]
min = 2
max = 2
