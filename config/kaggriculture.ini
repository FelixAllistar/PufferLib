# QD starting config: fresh BC, 200M steps, no LR or entropy annealing.
# Reward-only QD is launched with ocean/kaggriculture/qd.py, not Protein sweep.
[base]
env_name = kaggriculture
#load_model_path = saved/kaggriculture/sweep_league_20260929/pool/finetune_1790729345074_a23be291dcf8.bin
#load_model_path = checkpoints/kaggriculture/1790651669679/0000000099876864.bin
#load_model_path = None
load_model_path = saved/kaggriculture/initial_bc.bin
# Save every 40 updates (~10.49M steps), plus the final checkpoint.
# Saved snapshots also enter the rolling selfplay pool.
checkpoint_interval = 40
# External reset-free eval/PSRO uses run.py, not inherited training resets.
eval_episodes = 0
eval_agents = 128
run_id = None
async = 1
# CUDA graphs remain enabled; not a sweep dimension.
cudagraphs = 1



[vec]
total_agents = 1024
num_buffers = 4
num_threads = 8
num_policies = 5
hist_policy_hidden_size = 256
hist_policy_num_layers = 2
hist_policy_percent = 0.75

[selfplay]
enabled = 1
max_size = 16
seed = 42
# Four fixed banks: finetune champion, previous champion, trials 17 and 13.
# Fixed banks: timeout rotation would replace these with this run's snapshots.
initial_opponents = saved/kaggriculture/sweep_league_20260929/initial_opponents.txt
opp_timeout_steps = 0
eval_pool_size = 8
eval_games = 0
eval_bot_games = 0
eval_bots = 0
eval_bot_envs = 8192
eval_bot_threads = 0

[env]
potential_beta = 0
potential_path = saved/kaggriculture/potential.bin
dr = 0
num_agents = 2
num_bots = 0
learner_seat = 0
bot_policy = 1
market_slots = 10
max_hands = 16
land_buy_min_days = 0
reward_money = 1
reward_growth_land =0
reward_growth_crop = 0
reward_growth_animal = 0
reward_alive_daily = 0
reward_quality_scale = .0
reward_quality_idle_cost = 0
reward_target_plots = 3
reward_target_crops = 50
reward_target_animals = 15
reset_state_prob = 0.8
reset_state_bank = data/kaggriculture/reset.kgb

[policy]
hidden_size = 256
num_layers = 2

[train]
gpus = 2
total_timesteps = 200000000
learning_rate = 0.000193072367
replay_ratio = 1.76115727
anneal_lr = 0
min_lr_ratio = 0.1
gamma = 0.999989986
gae_lambda = 0.999649584

clip_coef = 0.5
vf_coef = 3.19286418
vf_clip_coef = 1.66445255
reward_clip = 0
max_grad_norm = 3.71355104
ent_coef = 0.000708354462
anneal_ent_coef = 0
min_ent_coef_ratio = 0
momentum = 0.5
minibatch_size = 8192
horizon = 256
vtrace = 0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
verb_eps = 0.0
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0

[bc]
# Standalone offline application. These settings never alter PPO.
mode = actor
data = data/kaggriculture/terminal.bc
output = saved/kaggriculture/offline.bin
epochs = 20
batch = 1
learning_rate = 0.00005
value_coef = 1
# Qualification limiter; 0 uses every training and held-out episode.
max_batches = 0

# Legacy Protein ranges below are NOT used by reward-only QD.
# QD snapshots the fixed settings above and uses profiles/qd.ini reward ranges.
# Trial 0 is terminal-only; other trials test modest auxiliary rewards.
# Fixed bounds override inherited sweep dimensions from default.ini.
# root_money compares fresh-start cash, not reset-bank starting wealth or rewards.
# This is a training metric, not a held-out leaderboard evaluation.
[sweep]
metric = root_money
metric_distribution = linear
goal = maximize
max_runs = 500
# One independent trial per visible GPU (train.gpus = 1).
gpus = 2
# Final-score observations also enable Protein's success/failure classifier.
downsample = 1
max_suggestion_cost = 14400
prune_pareto = 1
early_stop_quantile = 0.3

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 1024
scale = auto


[sweep.train.horizon]
distribution = uniform_pow2
min = 256
max = 256
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 8192
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.0003
scale = auto

[sweep.train.ent_coef]
