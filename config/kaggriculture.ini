# Kaggriculture: compact primitive actions + Final-B-inspired PufferNet/MinGRU.
# Single active config. Six BC sizes are CLI overrides, not separate profiles.
# ABI 7 requires fresh BC; flat ABI-6 and macro checkpoints are incompatible.
[base]
env_name = kaggriculture
load_model_path = saved/kaggriculture/compact_v7/h1024_l2/bc.bin
teacher_model_path = None
checkpoint_interval = 64
eval_episodes = 0
eval_agents = 128
async = 1
cudagraphs = 1

[vec]
# 1024x2 + league: keep the vector fixed on the 8GB GPU.
total_agents = 256
num_buffers = 2
num_threads = 16
num_policies = 7
hist_policy_percent = 0.25

[selfplay]
# Live self-play plus at most six historical opponents; no scripted training bots.
enabled = 1
max_size = 6
# Refresh at the 64-rollout checkpoint cadence (256 * 720 * 64).
opp_timeout_steps = 11796480
eval_pool_size = 0
eval_games = 0
eval_bot_games = 0

[env]
num_agents = 2
num_bots = 0
learner_seat = 0
bot_policy = 1
market_slots = 10
max_hands = 19
land_buy_min_days = 0
reward_money = 1
reward_win_loss_draw = 1
reward_growth_land = 0
reward_growth_crop = 0
reward_growth_animal = 0
reward_alive_daily = 0
reward_quality_scale = 0
reward_quality_idle_cost = 0
reward_target_plots = 3
reward_target_crops = 50
reward_target_animals = 15
potential_beta = 0
potential_path = saved/kaggriculture/potential.bin
reset_state_prob = 0.1
reset_state_bank = data/kaggriculture/reset.kgb
opponent_noise_initial = 0
opponent_noise_final = 0
opponent_noise_decay_steps = 500000000

[policy]
action_version = 7
hidden_size = 1024
num_layers = 2
critic_mode = 2

[train]
gpus = 1
total_timesteps = 5000000000
# Puffer's Muon optimizer remains in use; this LR is NOT an Adam recipe transplant.
# Preserve the learning rate selected on the user's current Vast run.
learning_rate = 0.001585168378
anneal_lr = 1
min_lr_ratio = 0.25
momentum = 0.5
gamma = 1
gae_lambda = 0.97
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
reward_clip = 0
max_grad_norm = 5
ent_coef = 0.0015
anneal_ent_coef = 1
# Frozen-teacher KL is incompatible with historical policy banks; leave off.
teacher_kl_coefficient = 0
horizon = 720
minibatch_size = 1440
vtrace = 0

[bc]
mode = actor
data = data/kaggriculture/compact_v7/teacher.bc
output = saved/kaggriculture/compact_v7/h1024_l2/bc.bin
epochs = 30
batch = 1
learning_rate = 0.0001
adam_epsilon = 0.00001
max_grad_norm = 5
value_coef = 1
max_batches = 0

[bc_grid]
# Shared dataset/schedule, independent initialization for every architecture.
hidden_sizes = 256,512,1024
num_layers = 2,3
teacher = Majkel1337
output_root = saved/kaggriculture/compact_v7

# First screening sweep, not a final strength comparison. Each independent
# trial starts from the SAME 1024x2 BC; never 'latest'. One GPU, serial trials.
# The worker runs no-reset evaluation against the fixed rule bot on BOTH seats
# after training exits. Cash is the objective; win rate is recorded separately.
# Regular `train` keeps the budget above. Only `sweep` uses trial_timesteps.
[sweep]
metric = root_money
metric_distribution = linear
goal = maximize
max_runs = 12
gpus = 1
downsample = 1
prune_pareto = 0
early_stop_quantile = 0
max_suggestion_cost = 7200
max_failures = 3
trial_timesteps = 50000000
worker_path = ocean/kaggriculture_direct/sweep_worker.py
trainer_path = ./puffer
eval_seed = 20261007
eval_games_per_seat = 128
eval_agents = 32

# Fixed bounds explicitly disable every inherited default.ini search dimension.
# Horizon, memory layout, WLD, paired critic, resets and league are NOT swept.
[sweep.train.total_timesteps]
min = 50000000
max = 50000000

[sweep.policy.hidden_size]
min = 1024
max = 1024

[sweep.policy.num_layers]
min = 2
max = 2

[sweep.vec.total_agents]
min = 256
max = 256

[sweep.train.horizon]
min = 720
max = 720

[sweep.train.minibatch_size]
min = 1440
max = 1440

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.003

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.01

[sweep.train.gamma]
min = 1
max = 1

[sweep.train.gae_lambda]
min = 0.97
max = 0.97

[sweep.train.replay_ratio]
min = 1
max = 1

[sweep.train.clip_coef]
min = 0.2
max = 0.2

[sweep.train.vf_clip_coef]
min = 0.2
max = 0.2

[sweep.train.vf_coef]
min = 0.5
max = 3

[sweep.train.max_grad_norm]
min = 5
max = 5

[sweep.train.momentum]
distribution = uniform
min = 0.5
max = 0.95
