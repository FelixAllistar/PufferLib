reward_land_value = 1.0
# Mark large held/future product piles at the conservative marginal price after
# our own projected supply reaches the market. This makes the potential care
# about price impact and keeps SELL beneficial instead of repricing the unsold
# remainder into a false loss. 0 restores legacy count * current spot price.
