# maintenance, investment, and market-opportunity decisions.
reset_state_prob = 0
turns_per_day = 24
shed_capacity = 100
weed_spawn_chance = 0.005
town_shop_unlock_interval = 3
town_shop_sell_interval = 4
town_center_sell_interval = 24
farm_hand_cost_mult = 1
seed = 707
# Use only the fitted, time-aware economic potential below. Keep its shaping
# gamma equal to train.gamma so intermediate guidance telescopes to final cash.
reward_potential_scale = 0
reward_potential_gamma = 0.99970


reward_money_scale = 0

# The fitted future-cash estimate remains zero-terminal teaching guidance.
# This ablation disables cash/win objectives; the explicit expansion curriculum
# below is the only non-telescoping objective.
reward_cash_scale = 0
reward_progress_scale = 1
reward_progress_terminal_money_scale = 0
reward_progress_win_scale = 0
reward_progress_liquidation_days = 0
# These are calibration multipliers around the fitted product-specific values,
# not strategy rewards. Keep them fixed and neutral at one.
reward_progress_seed_scale = 1
reward_progress_crop_scale = 1
reward_progress_animal_scale = 1
reward_progress_product_scale = 1
reward_progress_maintenance_scale = 0
reward_progress_land_scale = 1
reward_progress_health_ratio = 0.900000
# Deliberate opening curriculum, not an economic reward. Each branch pays for
# new episode-high live counts through turn 180; the balance term pays twice
# again only as the least-developed branch catches up. Maximum total return is
# 5 * reward_expansion_scale. Set scale back to zero for normal training.
reward_expansion_scale = 10
reward_expansion_deadline = 180
reward_expansion_land_target = 3
reward_expansion_plant_target = 50
reward_expansion_animal_target = 12
reward_progress_crop_wheat_units = 3.174477
reward_progress_crop_carrot_units = 2.375688
