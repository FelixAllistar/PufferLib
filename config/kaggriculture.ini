[base]
env_name = kaggriculture
load_model_path = saved/kaggriculture/initial_bc_critic.bin
checkpoint_interval = 24
# External reset-free eval/PSRO uses run.py, not inherited training resets.
eval_episodes = 0
eval_agents = 128

[vec]
total_agents = 1024
num_buffers = 1
num_threads = 1
num_policies = 5
hist_policy_hidden_size = 256
hist_policy_num_layers = 2
hist_policy_percent = 0.75

[selfplay]
enabled = 1
initial_opponents = saved/kaggriculture/initial_opponents.txt
# Fixed during a run; refresh from the external league between runs.
opp_timeout_steps = 0
eval_games = 0
eval_bot_games = 0

[env]
# 2 = mirror/checkpoint games; 1 = learner_seat versus bot_policy.
num_agents = 2
learner_seat = 0
# 0 pass, 1 native reactive rules. Not a checkpoint league.
bot_policy = 1
market_slots = 10
max_hands = 16
land_buy_min_days = 0
# Only terminal cash gain / 3000; retain its magnitude without clipping.
reward_money = 4.71806717
# Optional earlier shaped components. All zero for terminal-money training.
reward_growth_land = 0
reward_growth_crop = 0
reward_growth_animal = 0
reward_alive_daily = 0
reward_quality_scale = 0
reward_quality_idle_cost = 0.529286027
reward_target_plots = 3
reward_target_crops = 45
reward_target_animals = 15
# 0 gives fresh starts and does not load the bank, including for evaluation.
reset_state_prob = 0.8
reset_state_bank = data/kaggriculture/reset.kgb

[policy]
# Entity encoder and separate task/market/value heads; upstream MinGRU core.
hidden_size = 256
num_layers = 2

[train]
# Conservative warm-start baseline, not a transferred optimum for upstream Muon.
total_timesteps = 300000000
learning_rate = 0.0003
gamma = 0.999817491
gae_lambda = 0.915023446
ent_coef = 0.000748388178
anneal_ent_coef = 1
min_ent_coef_ratio = 0.259882718
anneal_lr = 1
min_lr_ratio = 0.119832993
reward_clip = 0
# Packed rollout masks; recurrent carry across horizons.
horizon = 256
minibatch_size = 8192

[bc]
# Standalone offline application. These settings never alter PPO.
mode = actor
data = data/kaggriculture/terminal.bc
output = saved/kaggriculture/offline.bin
epochs = 20
batch = 1
learning_rate = 0.00005
value_coef = 1
# Qualification limiter; 0 uses every training and held-out episode.
max_batches = 0
