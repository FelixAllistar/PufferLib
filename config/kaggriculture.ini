# Kaggriculture: compact primitive actions + Final-B-inspired PufferNet/MinGRU.
# Single active config. Six BC sizes are CLI overrides, not separate profiles.
# ABI 7 requires fresh BC; flat ABI-6 and macro checkpoints are incompatible.
[base]
env_name = kaggriculture
load_model_path = saved/kaggriculture/compact_v7/h256_l2/bc.bin
teacher_model_path = saved/kaggriculture/compact_v7/h256_l2/bc.bin
checkpoint_interval = 32
eval_episodes = 0
eval_agents = 128
async = 1
cudagraphs = 1

[vec]
# Compact controls: 256 rows qualified at about 5GB on the 8GB GPU.
total_agents = 256
num_buffers = 2
num_threads = 4
num_policies = 1
hist_policy_percent = 0

[selfplay]
# Current-policy self-play: BOTH seats train. No historical opponents in this baseline.
enabled = 0
eval_pool_size = 0
eval_games = 0
eval_bot_games = 0

[env]
num_agents = 2
num_bots = 0
learner_seat = 0
bot_policy = 1
market_slots = 10
max_hands = 19
land_buy_min_days = 0
reward_money = 1
reward_win_loss_draw = 1
reward_growth_land = 0
reward_growth_crop = 0
reward_growth_animal = 0
reward_alive_daily = 0
reward_quality_scale = 0
reward_quality_idle_cost = 0
reward_target_plots = 3
reward_target_crops = 50
reward_target_animals = 15
potential_beta = 0
potential_path = saved/kaggriculture/potential.bin
reset_state_prob = 0.9
reset_state_bank = data/kaggriculture/reset.kgb
opponent_noise_initial = 0
opponent_noise_final = 0
opponent_noise_decay_steps = 500000000

[policy]
action_version = 7
hidden_size = 256
num_layers = 2
critic_mode = 2

[train]
gpus = 1
total_timesteps = 500000000
# Puffer's Muon optimizer remains in use; this LR is NOT an Adam recipe transplant.
# Preserve the learning rate selected on the user's current Vast run.
learning_rate = 0.000002585168378
anneal_lr = 1
min_lr_ratio = 0.25
momentum = 0.5
gamma = 1
gae_lambda = 0.97
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
reward_clip = 0
max_grad_norm = 5
ent_coef = 0.0015
anneal_ent_coef = 0
teacher_kl_coefficient = 0.2
horizon = 720
minibatch_size = 1440
vtrace = 0

[bc]
mode = actor
data = data/kaggriculture/compact_v7/teacher.bc
output = saved/kaggriculture/compact_v7/h256_l2/bc.bin
epochs = 30
batch = 1
learning_rate = 0.0001
adam_epsilon = 0.00001
max_grad_norm = 5
value_coef = 1
max_batches = 0

[bc_grid]
# Shared dataset/schedule, independent initialization for every architecture.
hidden_sizes = 256,512,1024
num_layers = 2,3
teacher = Majkel1337
output_root = saved/kaggriculture/compact_v7
