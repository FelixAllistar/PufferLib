[base]
env_name = kaggriculture
seed = 707
async = 0
cudagraphs = 1
rank = 0
world_size = 1
gpu_id = 0
gpu_offset = 0
nccl_id = None
profile = 0
# Sweep winner run 15 (exact score 14256.4 vs the fixed eval): diver_b 5M base
# + 20M steps with horizon 128, minibatch 8192, low entropy, emag_tau 0.017.
load_model_path = None
# 2048 agents x 128 steps saves at a 5.24M-step cadence.
checkpoint_interval = 20
checkpoint_dir = checkpoints
log_dir = logs
eval_episodes = 10
num_games = 0
burnin_games = 0
# Keep short dashboard evaluations small. League scripts override this with
# their own CUDA batch size; zero would silently expand a 10-game eval to 1024
# agents in the generic evaluator.
eval_agents = 2
load_enemy_model_path = None
enemy_hidden_size = 0
enemy_num_layers = 0
run_id = 'kag_sweep15_h128'
result_fd = 0
wandb = 0
slowly = 0
eval_epoch_mult = 1
reset_every_horizon = 0

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 4
# V4: 12 unit heads plus ten conditional STOP/command/quantity market slots.
action_mask_size = 838
gpu_env = 1
# Four resident opponent slots start with one active policy each, then PFSP
# rotates them through the compact league and rolling historical pool. The
# archive itself is never loaded wholesale.
num_frozen_banks = 4
frozen_bank_pct = .50
frozen_bank_hidden_size = 32
frozen_bank_num_layers = 2

[policy]
hidden_size = 32
num_layers = 2
expansion_factor = 1

[selfplay]
enabled = 1
max_size = 1
seed = 707
# Set to zero for a fixed external opponent pool. Positive values periodically
# add the current learner to the historical pool at this agent-step interval.
snapshot_interval = 0
# Historical snapshots are separate; stable external policies and their base
# weights come from the V6 league file.
opponent_pool = 'None'
opponent_league = 'None'
opponent_pool_weights = 'None'
# Of the non-bot lane, favor the archived league over this run's fresh
# snapshots. The latter remain present so adaptation cannot freeze completely.
opponent_pool_prob = 0.75
pfsp_mode = 'variance'
pfsp_alpha = 1
pfsp_uniform_mix = 0.1
payoff_ema = 0.1
opp_timeout_steps = 1000000
eval_pool_size = 1
eval_games = 50
eval_metric = 'money'
# A 50-game opponent check does not need an 8192-agent resident batch. The
# GPU matcher scripts pass their own --gpu-agents value when larger batches are
# useful.
eval_agents = 64

[env]
episode_steps = 720
board_size = 10
starting_money = 3000
max_market_orders_per_turn = 10
# Full official controls. Smaller values remain available as explicit
# structural ablations, but normal training does not truncate orders or hires.
policy_market_slots = 10
policy_max_hands = 240
# Optional strategy experiments. Both are off in normal full-game training.
# opening_turns one-hot masks the learner to the top replay prefix.
# reset_opening_turns samples a real prefix state uniformly from [0, N].
opening_turns = 0
reset_opening_turns = 0
turns_per_day = 24
shed_capacity = 100
weed_spawn_chance = 0.005
town_shop_unlock_interval = 3
town_shop_sell_interval = 4
town_center_sell_interval = 24
farm_hand_cost_mult = 1
seed = 707
# Coherent v3 economic-continuation reward tuple. Keep these values together:
# this exact scale/outcome/asset balance produced steadily rising fixed money.
# The one-slot/eight-hand limits above remain the only structural ablation.
reward_potential_scale = 0.000772047148
reward_win = 0.375989795
reward_seed_value = 0.01
reward_product_value = 0.95
reward_crop_value = 1
reward_animal_value = 0.95
reward_land_value = 1
reward_neglect_discount = 0.5
reward_liquidation_days = 6
reward_productive_action = 0.0002
reward_margin_scale = 0.3
reward_inactivity_threshold = 500
# Apply -reward_inactivity at terminal when money remains within $2 of $3000.
reward_inactivity = 3
reward_neglect_death = 0.05
# Full game from reset. 95% bot games with 95% of that lane assigned to
# the exact top hybrid gives 90.25% top games overall. The remaining 9.75%
# preserves a small mixture of other public ports and learned self-play.
bot_opponent_fraction = 1
bot_pass_fraction = 0
bot_first = 0
bot_top_fraction = 0.95
bot_rules_fraction = 0.5
# Fractions below partition only the non-top remainder of the bot lane.
bot_script_fraction = 0.4
bot_adaptive_fraction = 0.6

[train]
total_timesteps = 800000000
learning_rate = 0.0178926173
anneal_lr = 0
gamma = 0.999859989
gae_lambda = 0.987793684
# Sweep-15 tuple: horizon 128 with minibatch 8192 was the top region (12.7-14.3K
# exact score vs the old horizon-16 baseline's 11.2K). One PPO pass per rollout.
replay_ratio = 1
clip_coef = 0.158850163
vf_coef = 0.249999985
vf_clip_coef = 0.31161955
max_grad_norm = 0.750745416
ent_coef = 0.000577449391
emag_kl_coef = 0.0130934035
emag_tau = 0.0171176065
anneal_ent_coef = 0
momentum = 0.9
minibatch_size = 8192
horizon = 64
prio_alpha = 0
prio_beta0 = 0.6
epoch_sampling = 1
gpus = 1

# Warm-started selfplay/training sweep. Use sweep_selfplay.sh to initialize every
# trial from one competent checkpoint and rank final policies by seat-balanced
# money against the same eight-policy external panel.
[sweep]
# Sweep selection penalizes policies that finish at the untouched starting bank.
# Dashboard score remains literal final money.
metric = sweep_score
metric_distribution = linear
goal = maximize
# 100-run top-bot exploit sweep. 100M steps per trial at ~2.5M SPS is ~40s;
# keep the cost ceiling above a complete trial so the optimizer doesn't treat
# useful samples as over-budget.
max_suggestion_cost = 300
max_runs = 100
gpus = 0
downsample = 1
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
# Safe default is the staged hyper search used by sweep_v2.sh. Reward and
# selfplay-composition searches are separate experiments; combining all of them
# creates a sparse, confounded 20+ dimensional sweep. replay_ratio remains 1:
# repeated passes over stale async rollouts caused destructive KL spikes.
sweep_only = train.learning_rate,train.ent_coef,train.emag_kl_coef,train.emag_tau,env.reward_win,env.reward_potential_scale

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00005
max = 0.003
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.005
max = 0.12
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.9995
max = 0.99999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.94
max = 0.995
scale = auto


[sweep.train.vf_coef]
distribution = log_normal
min = 0.25
max = 2.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = log_normal
min = 0.10
max = 1.0
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.25
max = 1.0
scale = auto

[sweep.train.emag_kl_coef]
distribution = log_normal
min = 0.005
max = 0.10
scale = auto

[sweep.train.emag_tau]
distribution = log_normal
min = 0.00005
max = 0.03
scale = auto

[sweep.env.reward_potential_scale]
distribution = log_normal
min = 0.00005
max = 0.002
scale = auto

[sweep.env.reward_win]
distribution = log_normal
min = 0.1
max = 1.0
scale = auto

[sweep.env.reward_liquidation_days]
distribution = uniform
min = 3
max = 10
scale = auto

[sweep.env.reward_seed_value]
distribution = uniform
min = 0.50
max = 1.00
scale = auto

[sweep.env.reward_product_value]
distribution = uniform
min = 0.60
max = 1.00
scale = auto

[sweep.env.reward_crop_value]
distribution = uniform
min = 0.80
max = 1.20
scale = auto

[sweep.env.reward_neglect_discount]
distribution = uniform
min = 0.10
max = 0.90
scale = auto

[sweep.env.reward_animal_value]
distribution = uniform
min = 0.50
max = 1.00
scale = auto

[sweep.env.reward_land_value]
distribution = uniform
min = 0.90
max = 1.05
scale = auto

[sweep.env.reward_productive_action]
distribution = log_normal
min = 0.0002
max = 0.02
scale = auto

[sweep.env.reward_inactivity]
distribution = uniform
min = 1.0
max = 5.0
scale = auto

[sweep.env.reward_neglect_death]
distribution = log_normal
min = 0.005
max = 0.2
scale = auto

[sweep.env.bot_opponent_fraction]
distribution = uniform
min = 0.90
max = 1.00
scale = auto

[bc]
# Behavioral-cloning anchor trainer. profile: 4 = TOP script (opening+animal
# herd), steps 16 = intro only, 26 = opening, 720 = full tape imitation.
mode = train
steps = 26
profile = 4
epochs = 2000
learning_rate = 0.0003
output = saved/kaggriculture_bc_anchor.bin
games = 50
bot = 1
seed = 7
batch = 128
momentum = 0.9
data = saved/kaggriculture_bc_data.bin
