[base]
env_name = goofspiel
seed = 73
async = 0
reset_every_horizon = 1
cudagraphs = 0
load_model_path = None
load_enemy_model_path = None
# -1: evaluate/save every env.exploitability_interval_steps, rounded to a rollout.
# 0: final checkpoint only. Positive values: explicit trainer-epoch intervals.
checkpoint_interval = -1
# Exact exploitability replaces sampled post-training self-play scores.
eval_episodes = 0
eval_agents = 64

[vec]
total_agents = 4096
num_buffers = 1
# GPU simulation has no CPU worker count to tune.
num_threads = 4

# Four frozen banks for PSRO/selfplay diversity against a live shared policy.
num_policies = 8
hist_policy_percent = 0.00999999978
hist_policy_hidden_size = 128
hist_policy_num_layers = 4

[selfplay]
enabled = 1
max_size = 1024
seed = 42
opp_timeout_steps = 64000004
eval_pool_size = 8
eval_games = 0
initial_opponents = None

[policy]
hidden_size = 128
num_layers = 4

[env]
num_agents = 2
seed = 42
num_players = 2
num_cards = 4
num_turns = 4

# prize_order: 0=random, 1=ascending, 2=descending
prize_order = 0
# information: 0=perfect, 1=hidden opponent bids/hands
information = 0
egocentric = 1
# 0: compact current state. 1: OpenSpiel-style score/prize/hand one-hots.
# Both use the same fixed buffer and network shape.
open_spiel_obs = 0
# return_type: 0=win_loss, 1=point_difference, 2=total_points
return_type = 0
# tie_rule: 0=discard, 1=carry to the next uniquely won prize
tie_rule = 0
auto_forced_last = 1
# Automatic exact opponent best response during training and at the end.
exploitability_interval_steps = 1_048_576
# Optional exact responses with either native CPU or GPU simulation.
# Refreshes at checkpoints and saves a .bin.exact pool beside each snapshot.
exact_exploiter = 1
# First N frozen banks use the exact table; later banks retain their policies.
exact_exploiter_banks = 5
# Reservoir of historical exact responses sampled independently each episode.
exact_exploiter_history = 256
# Fraction assigned to the latest exact response; remainder samples history.
exact_exploiter_current_prob = 0.639643133

[train]
# One fixed budget for ordinary training and every sweep trial, for either model.
total_timesteps = 257204352
learning_rate = 0.00212708348
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.999989986
gae_lambda = 0.5
replay_ratio = 12.6203089
clip_coef = 0.0336489826
vf_coef = 0.420992643
vf_clip_coef = 0.0499598272
reward_clip = 0.291490018
max_grad_norm = 10
ent_coef = 3.03003872e-05
anneal_ent_coef = 0
min_ent_coef_ratio = 0.600696146
momentum = 0.94722873
minibatch_size = 2048
horizon = 16
vtrace = 1
vtrace_c_clip = 1.04501843
vtrace_rho_clip = 2.1095686
# EMAgnet is always on in sweeps (its own policy also counts for best_exploitability).
magnet_coef = 0.091146186
magnet_tau = 0.00145685999
anneal_magnet_coef = 1
min_magnet_coef_ratio = 0.64515698
magnet_reverse = 1
gpus = 1

[sweep]
# Also selects the metric shown during ordinary training. Zero is the target.
metric = best_exploitability
goal = minimize
downsample = 1
max_runs = 3000
gpus = 1
max_suggestion_cost = 3600
# 0 uses free GPU memory; positive values cap the per-trial estimate in MiB.
memory_limit_mb = 0
# Captured graph budget: minibatches * layers (* horizon for PufferNet); 0 disables.
max_train_graph_work = 131072
# Sweep workers only; keep the best checkpoint when progress stalls. 0 disables.
early_stop_patience_steps = 15_000_000
early_stop_min_steps = 20_000_000
early_stop_min_delta = 0.005

# 2026-11-08 narrowed sweep (the 2026-11-07 wide sweep stopped at ~575 trials, archived; resumable with the e7e4f5b06
# config). Ranges around its top 25 trials (0.0046-0.0126), widened where they sat on a bound (gae_lambda,
# max_grad_norm, vf_clip_coef, vtrace_rho_clip, hist_policy_percent, opp_timeout_steps). Pinned (min = max): every
# top-25 trial agreed (anneal_ent_coef 0, anneal_magnet_coef 1, magnet_reverse 1, async 0, reset_every_horizon 1,
# vtrace 1, selfplay 1, exact_exploiter 1); gamma sits at its 0.99999 bound in a 4-step game; max_size 1024 keeps
# every snapshot. Defaults (the first trial) = 2026-11-07 trial 500, exploitability 0.0046 (its magnet).
# Model size: hidden 32-256 x 1-5 layers; resolve halves the width while hidden^2 * layers
# > 256^2 * 2 (256x2, 128x4). replay_ratio stays >= 1: below 1 the same tail rows
# (frozen-opponent games) would never train.
[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 16384
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 1
scale = auto

[sweep.vec.num_threads]
distribution = uniform_pow2
min = 1
max = 1
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 64
scale = auto

# A minibatch larger than horizon x agents fails the trial (the trainer asserts); smaller ones pad.
[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 512
max = 32768
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 24
scale = auto

[sweep.train.learning_rate]
