[base]
env_name = goofspiel
async = 1
cudagraphs = 1
load_model_path = None
load_enemy_model_path = None
checkpoint_interval = 100
num_games = 8192
eval_agents = 8192

[vec]
total_agents = 2048
num_buffers = 2
num_threads = 4
action_mask_size = 4
gpu_env = 0

# Standard historical-checkpoint selfplay: live shared-policy games plus one
# frozen bank sampled from the rolling checkpoint history.
num_frozen_banks = 0
frozen_bank_pct = 0
frozen_bank_hidden_size = 32
frozen_bank_num_layers = 1

[selfplay]
enabled = 0
max_size = 32
seed = 42
opp_timeout_steps = 1000000
eval_pool_size = 8
eval_games = 0
eval_agents = 8192

[policy]
hidden_size = 64
num_layers = 2
expansion_factor = 1

[env]
seed = 42
num_players = 2
num_cards = 4
num_turns = 4

# prize_order: 0=random, 1=ascending, 2=descending
prize_order = 0
# information: 0=perfect, 1=hidden opponent bids/hands
information = 0
egocentric = 1
# 0: compact current state. 1: OpenSpiel-style score/prize/hand one-hots.
# Both use the same fixed buffer and network shape.
open_spiel_obs = 0
# return_type: 0=win_loss, 1=point_difference, 2=total_points
return_type = 0
# tie_rule: 0=discard, 1=carry to the next uniquely won prize
tie_rule = 0
auto_forced_last = 1
# Replace frozen-bank player actions with the periodically refreshed exact
# response to the learner checkpoint.
exact_exploiter = 0
# First N frozen banks use the exact table; later banks retain their policies.
exact_exploiter_banks = 1
# Reservoir of historical exact responses sampled independently each episode.
exact_exploiter_history = 256
# Fraction assigned to the latest exact response; remainder samples history.
exact_exploiter_current_prob = 0.5

[train]
total_timesteps = 32768000
learning_rate = 0.00860058703
anneal_lr = 1
gamma = 1.0
gae_lambda = 1.0
replay_ratio = 4
clip_coef = 0.0435373858
vf_coef = 0.767722487
vf_clip_coef = 0.806706
max_grad_norm = 0.5
ent_coef = 0.0164826009
emag_kl_coef = 0.117609896
emag_tau = 0.00094514084
anneal_ent_coef = 0
momentum = 0.916658
minibatch_size = 4096
horizon = 8
prio_alpha = 0
prio_beta0 = 0.6
epoch_sampling = 1
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0
gpus = 1

[sweep]
metric = exploitability
metric_distribution = linear
goal = minimize
max_suggestion_cost = 300
max_runs = 40
gpus = 0
downsample = 1
use_gpu = True
prune_pareto = True
sweep_only = train.total_timesteps, train.horizon, train.minibatch_size, train.learning_rate, train.ent_coef, train.replay_ratio, train.clip_coef, train.emag_kl_coef, train.emag_tau

[sweep.train.total_timesteps]
distribution = log_normal
min = 8000000
max = 128000000
scale = time

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 32
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
max = 0.02
scale = 0.5

[sweep.train.emag_kl_coef]
distribution = log_normal
min = 0.03
max = 0.5
scale = auto

[sweep.train.emag_tau]
distribution = log_normal
min = 0.0001
max = 0.01
scale = auto

[sweep.train.anneal_lr]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.005
max = 0.08
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.85
max = 0.999
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 12.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.02
max = 0.2
scale = auto

[sweep.train.vf_clip_coef]
distribution = log_normal
min = 0.5
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.25
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.25
max = 2.0
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.99
scale = auto
