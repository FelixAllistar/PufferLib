[base]
env_name = goofspiel
seed = 73
async = 0
reset_every_horizon = 1
cudagraphs = 0
load_model_path = None
load_enemy_model_path = None
# -1: evaluate/save every env.exploitability_interval_steps, rounded to a rollout.
# 0: final checkpoint only. Positive values: explicit trainer-epoch intervals.
checkpoint_interval = -1
# Exact exploitability replaces sampled post-training self-play scores.
eval_episodes = 0
eval_agents = 64

[vec]
total_agents = 4096
num_buffers = 1
# GPU simulation has no CPU worker count to tune.
num_threads = 4

# Four frozen banks for PSRO/selfplay diversity against a live shared policy.
num_policies = 8
hist_policy_percent = 0.0500000007
hist_policy_hidden_size = 128
hist_policy_num_layers = 4

[selfplay]
enabled = 1
max_size = 256
seed = 42
opp_timeout_steps = 16000007
eval_pool_size = 8
eval_games = 0
initial_opponents = None

[policy]
hidden_size = 128
num_layers = 1

[env]
num_agents = 2
seed = 42
num_players = 2
num_cards = 4
num_turns = 4

# prize_order: 0=random, 1=ascending, 2=descending
prize_order = 0
# information: 0=perfect, 1=hidden opponent bids/hands
information = 0
egocentric = 1
# 0: compact current state. 1: OpenSpiel-style score/prize/hand one-hots.
# Both use the same fixed buffer and network shape.
open_spiel_obs = 0
# return_type: 0=win_loss, 1=point_difference, 2=total_points
return_type = 0
# tie_rule: 0=discard, 1=carry to the next uniquely won prize
tie_rule = 0
auto_forced_last = 1
# Automatic exact opponent best response during training and at the end.
exploitability_interval_steps = 1_048_576
# Optional exact responses with either native CPU or GPU simulation.
# Refreshes at checkpoints and saves a .bin.exact pool beside each snapshot.
exact_exploiter = 1
# First N frozen banks use the exact table; later banks retain their policies.
exact_exploiter_banks = 7
# Reservoir of historical exact responses sampled independently each episode.
exact_exploiter_history = 128
# Fraction assigned to the latest exact response; remainder samples history.
exact_exploiter_current_prob = 0.399794847

[train]
# One fixed budget for ordinary training and every sweep trial, for either model.
total_timesteps = 71354008
learning_rate = 0.0170789137
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.999899983
gae_lambda = 0.969583929
replay_ratio = 6.80134583
clip_coef = 0.0231596008
vf_coef = 0.341098517
vf_clip_coef = 0.0221259426
reward_clip = 0.582889974
max_grad_norm = 0.728167653
ent_coef = 0.00484212441
anneal_ent_coef = 0
min_ent_coef_ratio = 0.756908298
momentum = 0.940475285
minibatch_size = 16000
horizon = 32
vtrace = 1
vtrace_c_clip = 0.90754813
vtrace_rho_clip = 1.40601063
# EMAgnet is always on in sweeps (its own policy also counts for best_exploitability).
magnet_coef = 0.0977006853
magnet_tau = 0.00221475749
anneal_magnet_coef = 1
min_magnet_coef_ratio = 0.0584295988
magnet_reverse = 1
gpus = 1

[sweep]
# Also selects the metric shown during ordinary training. Zero is the target.
metric = best_exploitability
goal = minimize
downsample = 1
max_runs = 10000
gpus = 1
max_suggestion_cost = 3600
# 0 uses free GPU memory; positive values cap the per-trial estimate in MiB.
memory_limit_mb = 0
# Captured graph budget: minibatches * layers (* horizon for PufferNet); 0 disables.
max_train_graph_work = 131072
# Sweep workers only; keep the best checkpoint when progress stalls. 0 disables.
early_stop_patience_steps = 15_000_000
early_stop_min_steps = 20_000_000
early_stop_min_delta = 0.005

# 2026-11-07 wide sweep (the 2026-11-06 one put its best trials on the agents, horizon, minibatch and replay
# bounds). Padded minibatches: any agents/horizon/minibatch/history mix is valid.
# Defaults (the sweep's first trial) = 2026-11-06 trial 537, exploitability 0.0084.
# Model size: hidden 16-256 x 1-6 layers; resolve halves the width while hidden^2 * layers
# > 256^2 * 2 (256x2, 128x4, 128x6). replay_ratio stays >= 1: below 1 the same tail rows
# (frozen-opponent games) would never train.
[sweep.train.total_timesteps]
distribution = log_normal
min = 10_000_000
max = 400_000_000
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 16
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 6
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 131072
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 1
scale = auto

[sweep.vec.num_threads]
distribution = uniform_pow2
min = 1
max = 1
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 4
max = 256
scale = auto

# A minibatch larger than the learner rows trains them all in one (padded) minibatch; resolve caps
# it at horizon x agents, which the trainer asserts.
[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 512
max = 262144
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1
max = 32
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = auto

[sweep.train.anneal_lr]
distribution = int_uniform
min = 1
max = 1
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0
max = 1
scale = auto

[sweep.train.momentum]
distribution = uniform
min = 0.5
max = 0.999
scale = auto

[sweep.train.max_grad_norm]
distribution = log_normal
min = 0.01
max = 10
scale = auto

# ent_coef near 1e-5 is effectively off.
[sweep.train.ent_coef]
distribution = log_normal
min = 0.000001
max = 0.3
scale = auto

[sweep.train.anneal_ent_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_ent_coef_ratio]
distribution = uniform
min = 0
max = 1
scale = auto

[sweep.train.magnet_coef]
distribution = log_normal
min = 0.0001
max = 3
scale = auto

[sweep.train.magnet_tau]
distribution = log_normal
min = 0.0001
max = 0.5
scale = auto

[sweep.train.anneal_magnet_coef]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.min_magnet_coef_ratio]
distribution = uniform
min = 0
max = 1
scale = auto

[sweep.train.magnet_reverse]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.99999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.9999
scale = auto

[sweep.train.clip_coef]
distribution = log_normal
min = 0.001
max = 1
scale = auto

[sweep.train.vf_coef]
distribution = log_normal
min = 0.01
max = 20
scale = auto

[sweep.train.vf_clip_coef]
distribution = log_normal
min = 0.001
max = 100
scale = auto

[sweep.train.reward_clip]
distribution = uniform
min = 0.25
max = 1
scale = auto

[sweep.base.async]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.base.reset_every_horizon]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.vtrace]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.05
max = 4
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.05
max = 2
scale = auto

[sweep.selfplay.enabled]
distribution = int_uniform
min = 0
max = 1
scale = auto

# Historical banks: count (1-8 frozen), share of games, pool size and swap cadence.
[sweep.vec.num_policies]
distribution = int_uniform
min = 2
max = 9
scale = auto

[sweep.vec.hist_policy_percent]
distribution = uniform
min = 0.01
max = 0.95
scale = auto

[sweep.selfplay.max_size]
distribution = uniform_pow2
min = 2
max = 1024
scale = auto

[sweep.selfplay.opp_timeout_steps]
distribution = log_normal
min = 16384
max = 64000000
scale = auto

[sweep.env.exact_exploiter]
distribution = int_uniform
min = 0
max = 1
scale = auto

[sweep.env.exact_exploiter_banks]
distribution = int_uniform
min = 1
max = 8
scale = auto

[sweep.env.exact_exploiter_history]
distribution = uniform_pow2
min = 1
max = 256
scale = auto

[sweep.env.exact_exploiter_current_prob]
distribution = uniform
min = 0
max = 1
scale = auto

# Fixed deliberately: game/observation rules, seeds, GPU count, CUDA graphs and the
# exact-evaluation objective. Not tuning lucky seeds or changing the game.
