[base]
env_name = goofspiel
seed = 73
async = 0
cudagraphs = 1
load_model_path = None
load_enemy_model_path = None
checkpoint_interval = 50
eval_episodes = 8192
eval_agents = 64

[vec]
total_agents = 8192
num_buffers = 1
num_threads = 4

# Four frozen banks for PSRO/selfplay diversity against a live shared policy.
num_policies = 5
hist_policy_percent = .5
hist_policy_hidden_size = 32
hist_policy_num_layers = 2

[selfplay]
enabled = 1
max_size = 32
seed = 42
opp_timeout_steps = 1000000
eval_pool_size = 8
eval_games = 0
initial_opponents = None

[policy]
hidden_size = 32
num_layers = 2

[env]
num_agents = 2
seed = 42
num_players = 2
num_cards = 4
num_turns = 4

# prize_order: 0=random, 1=ascending, 2=descending
prize_order = 0
# information: 0=perfect, 1=hidden opponent bids/hands
information = 0
egocentric = 1
# 0: compact current state. 1: OpenSpiel-style score/prize/hand one-hots.
# Both use the same fixed buffer and network shape.
open_spiel_obs = 0
# return_type: 0=win_loss, 1=point_difference, 2=total_points
return_type = 0
# tie_rule: 0=discard, 1=carry to the next uniquely won prize
tie_rule = 0
auto_forced_last = 1
# Exact-response refresh/persistence orchestration is still being ported.
# Keep disabled; this CPU port explicitly rejects enabling it.
exact_exploiter = 0
# First N frozen banks use the exact table; later banks retain their policies.
exact_exploiter_banks = 1
# Reservoir of historical exact responses sampled independently each episode.
exact_exploiter_history = 256
# Fraction assigned to the latest exact response; remainder samples history.
exact_exploiter_current_prob = 0.5

[train]
total_timesteps = 96000000
learning_rate = 0.00860058703
anneal_lr = 1
gamma = 0.998262286
gae_lambda = 0.998220325
replay_ratio = 4
clip_coef = 0.0435373858
vf_coef = 0.767722487
vf_clip_coef = 0.806706
max_grad_norm = 0.5
ent_coef = 0.023031367
anneal_ent_coef = 0
momentum = 0.916658
minibatch_size = 4096
horizon = 8
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0
gpus = 1
