[base]
env_name = shenaniguns3d
load_model_path = None
async=0

[vec]
total_agents = 8192
num_buffers = 4.78896
num_threads = 16
[env]
max_ticks = 3600
# 0 = fixed, 1 = random per environment, 2 = random on every reset
course_mode = 2
# 1 = varied, 2 = tighter doorway/tunnel/drop ranges
course_difficulty = 2
# reward knobs — edit without recompile, restart trainer to pick up
reward_progress = 0.1  # horizontal telescoping potential; no vertical farming
time_cost = 0.000140794 # best sweep trial; main speed pressure
reward_goal = 1.0     # dominant positive reward on reaching goal pedestal
reward_fall = -1.0    # failure cost on falling into kill-plane (y < -9)
reward_head_hit = -0.005 # discourage repeated forward impacts; wall-running is unaffected

[policy]
hidden_size = 512
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 50000000
learning_rate = 0.00246088 # best sweep trial
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.9
replay_ratio = 0.381289
clip_coef = 0.143548
vf_coef = 1.77975
vf_clip_coef = 3.90833
max_grad_norm = 0.329667
ent_coef = 0.01
momentum = 0.942691
minibatch_size = 16384
horizon = 32
vtrace_rho_clip = 2.91145
vtrace_c_clip = 1.66148
prio_alpha = 0.786776
prio_beta0 = 0.348617
use_rnn = 0

# Bayesian reward/optimizer sweep.
# Run clean trials with:
#   ./puffer sweep shenaniguns3d base.load_model_path=None
[sweep]
metric = episode_return
metric_distribution = linear
goal = maximize
max_suggestion_cost = 1800
max_runs = 16
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
sweep_only = train.learning_rate, env.time_cost, env.reward_progress

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.1
scale = 0.5

[sweep.env.time_cost]
distribution = log_normal
min = 0.00005
max = 0.1
scale = 0.5

[sweep.env.reward_progress]
distribution = log_normal
min = 0.001
max = 0.1
scale = 0.5
