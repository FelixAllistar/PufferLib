[base]
env_name = shenaniguns3d
 #checkpoints/shenaniguns3d/1787940789881/0000000099614720.bin
load_model_path = latest
async=0
checkpoint_interval = 10

#
[vec]
total_agents = 4096
# GPU rollout is full-batch on one CUDA stream and requires vec.num_buffers=1.
# CPU rollouts may use multiple buffers.
num_buffers = 1
num_threads = 4
[env]
max_ticks = 1200
# 0 = fixed, 1 = random per environment, 2 = random on every reset
course_mode = 2
# 1 = legacy obstacle route, 2 = tighter legacy route, 3 = randomized hallway route
course_difficulty = 2
# Optional isolated curriculum stage: -1 uses course_difficulty; 0 columns,
# 1 one turn, 2 two turns, 3 jump lip, 4 crouch gates, 5 full hallway stress.
course_stage = 4
# reward knobs — edit without recompile, restart trainer to pick up
reward_progress = 0.01  # horizontal telescoping potential; no vertical farming
time_cost = 0.0140794 # best sweep trial; main speed pressure
reward_goal = 1.0     # dominant positive reward on reaching goal pedestal
reward_fall = -1.0    # failure cost on falling into kill-plane (y < -9)
reward_head_hit = -0.1 # discourage repeated forward obstructions; wall-running is unaffected
# One-time action penalties. Set jump_penalty=0 to disable it; when omitted,
# the implementation derives it from -time_cost.
jump_penalty = -0.5
# crouch_penalty = -0.000140794
# Stance commitment durations are simulation ticks; 1 blocks an immediate toggle.
crouch_enter_commit_ticks = 1
crouch_exit_commit_ticks = 1
# Sensor maps stay aligned with the current pose; scalar state and collision
# checks are also updated per-frame.
sensor_depth_interval = 1
sensor_occupancy_interval = 1

[policy]
hidden_size = 32
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 10000000
learning_rate = 0.00046088 # best sweep trial
anneal_lr = 0
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.99
clip_coef = 0.143548
vf_coef = 1.77975
vf_clip_coef = 3.90833
max_grad_norm = 0.329667
ent_coef = 0.001
momentum = 0.942691
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 2.91145
vtrace_c_clip = 1.66148
prio_alpha = 0
prio_beta0 = 0.348617
use_rnn = 0

# Bayesian reward/optimizer sweep.
# Run clean trials with:
#   ./puffer sweep shenaniguns3d base.load_model_path=None
[sweep]
metric = episode_return
metric_distribution = linear
goal = maximize
max_suggestion_cost = 1800
max_runs = 16
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.25
sweep_only = train.learning_rate, env.time_cost, env.reward_progress

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.1
scale = 0.5

[sweep.env.time_cost]
distribution = log_normal
min = 0.00005
max = 0.1
scale = 0.5

[sweep.env.reward_progress]
distribution = log_normal
min = 0.001
max = 0.1
scale = 0.5
