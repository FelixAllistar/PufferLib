[base]
# Gen 9 random battles v1 (2026-10-30): pipeline check of ocean/pokemon9 (poke-engine + Showdown turn-1 positions,
# mirror self-play on both seats, partial-information float observations without species/ability/item ids).
env_name = pokemon9
load_model_path = None
checkpoint_interval = 50
async = 1
cudagraphs = 1

[vec]
total_agents = 8192
num_buffers = 1
num_threads = 24
num_policies = 1

[selfplay]
enabled = 0
# After training: win rate of agent 0 against side two playing uniformly random legal actions (bot_policy 1).
eval_bot_games = 2000
eval_bots = 1

[env]
num_agents = 2
# One poke-engine state per line, from ocean/pokemon9/build_positions.js (100K on the box).
positions = build/pokemon9/positions.txt
seed = 9
# 1: side two plays random legal moves instead of agent 1 (evaluation; see pokemon9.h).
bot_policy = 0

[policy]
hidden_size = 512
num_layers = 2

[train]
total_timesteps = 200000000
learning_rate = 0.001
anneal_lr = 1
ent_coef = 0.01
gamma = 0.995
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 1
max_grad_norm = 1
horizon = 64
minibatch_size = 16384
