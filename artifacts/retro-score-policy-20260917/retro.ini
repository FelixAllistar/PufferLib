[base]
env_name = retro
async = 1
# Fresh CNN training. Set latest explicitly only when continuing a CNN policy.
load_model_path = None
checkpoint_dir = checkpoints/retro_cnn_128x120_retry
# Save every 2.62M decisions with the current batch, and on graceful Ctrl-C.
checkpoint_interval = 160
checkpoint_on_interrupt = 1
cudagraphs = 1


[selfplay]
enabled = 0
magnet_path = None
max_size = 16
opp_timeout_steps = 1000000
pfsp_mode = variance
pfsp_alpha = 1
pfsp_uniform_mix = 0.1
payoff_ema = 0.1
eval_pool_size = 4
eval_games = 256
eval_agents = 256
eval_metric = winrate
opponent_pool = None
opponent_pool_prob = 0.5

[vec]
total_agents = 128
num_buffers = 1
num_threads = 4
worker_wait = block
cpu_scale = 1
gpu_env = 0

[policy]
num_layers = 2
hidden_size = 128

[env]
# One-frame controls preserve arbitrary press/release timing. A frameskip=4
# speed experiment still emulates every frame, but restricts available inputs.
frameskip = 4
full_render = 0
idle_loop_skip = 1
max_frames = 3000
potential_gamma = 0.997764528
# Level transitions and castle completion pay once per source level/episode.
# The ROM continues naturally through flags, pipes, vines and wrong warps.
completion_reward = 1
death_penalty = 0
checkpoint_distance = 128
checkpoint_reward = 0
score_scale = 1
# A common 1/16 scale preserves every reward ratio while fitting [-1,1].
# Every 128 novel pixels: +0.0078125. Death: -0.0078125; clear: +0.625.
# Checkpoints survive death/timeouts; area frontiers prevent repeat farming.
reward_scale = 1
# All 32 starts are built and validated once; CSV/single levels also work.
spawn_levels = 1-1
backend = quicknes
# Compiled ROM CPU with full-screen rendering.
cpu_backend = blocks
render_backend = wide
rom_path = ocean/retro/roms/smb1.nes

[train]
total_timesteps = 500_000_000
reward_clip = 0
# Provisional baseline: sweep_1789579982087_0004, best of the 3M-step sweep.
# Panel progress +11% vs prior defaults; short-budget result, not convergence evidence.
learning_rate = 0.004234825
gamma = 0.997764528
gae_lambda = 0.979004204
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.000749409432
momentum = 0.9
minibatch_size = 4096
horizon = 256
prio_alpha = 0
prio_beta0 = 0.6
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0
emag_kl_coef = 0.1
emag_tau = 0.1
emag_cutoff = 1.0

# Native entry: ./puffer sweep retro. Fixed budgets, final balanced ROM panel.
# Ordinary ./puffer train retro keeps the longer training budget above.
[sweep]
metric = distance
metric_distribution = linear
goal = maximize
trial_timesteps = 3000000
max_suggestion_cost = 3600
max_runs = 16
gpus = 1
downsample = 1
use_gpu = True
prune_pareto = False
early_stop_quantile = 0
random_samples = 4
global_random_fraction = 0.2
global_candidate_fraction = 0.2
# Six learning/credit/exploration knobs; no architecture, rewards or ROM knobs.
sweep_only = train.learning_rate,train.ent_coef,train.gamma,train.gae_lambda,train.horizon,train.replay_ratio
# Same two seeded attempts at EVERY level, one-frame controls, first clear/death
# or 3600-frame cutoff. distance = mean forward pixels; perf = clears first.
eval_frames = 3600
eval_repeats = 2
eval_seed = 20260907
eval_workers = 4

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.003
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0003
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.997
max = 0.9998
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.90
max = 0.995
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.train.replay_ratio]
distribution = int_uniform
min = 1
max = 4
scale = auto
