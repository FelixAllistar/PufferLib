[base]
env_name = bomberman
async = 1
# Best ordinary-game audited policy from the believable reverse curriculum.
load_model_path = saved/bomberman1/model.bin
load_enemy_model_path = saved/bomberman1/model.bin
checkpoint_interval = 10
num_games = 4096
eval_agents = 4096

[vec]
# Rules:
#   total_agents % num_buffers == 0
#   total_agents % env.num_agents == 0
#   num_threads % num_buffers == 0
#
# Tuned for ~3GB VRAM + 4-core CPU (GTX 10xx 3G class).
# Canonical obs is 1200 standard float values; rollout storage uses the
# configured PufferLib precision. Start at 1024 agents on a 3GB GTX 1060.
total_agents = 1024
num_buffers = 2
num_threads = 4
action_mask_size = 6
num_frozen_banks = 1
frozen_bank_pct = 0.5
frozen_bank_hidden_size = 128
frozen_bank_num_layers = 2
gpu_env = 0

[selfplay]
enabled = 1
max_size = 32
seed = 42
opp_timeout_steps = 5_000_000
eval_pool_size = 8
eval_games = 64
eval_agents = 1024

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[env]
num_agents = 2
width = 13
height = 11
# Reverse curriculum advances only after real safe credited kills.
max_ticks = 1600
bomb_timer = 18
flame_duration = 4
frames_per_cell = 2
soft_density = 0.55
item_chance = 0.35
# Reward credited aggression while making suicide much worse than being killed.
reward_soft = 0.3
reward_kill = 70.0
reward_death = -1.0
# Must outweigh reward_kill: a mutual kill should be a clear loss, not +EV.
reward_self_kill = -100.0
reward_win = 1.0
reward_alive = 0.0
reward_timeout = -2.0
# Bonuses are paid only on a credited kill; reward_bomb_escape additionally
# requires the killer to survive. Stage 2 separately uses it for its one-shot
# escape lesson. Harmless bomb placement cannot farm either reward.
reward_bomb_threat = 8.0
reward_bomb_escape = 5.0
# Tactical-only bridge rewards. These make the delayed bomb/escape sequence
# learnable; they are disabled automatically on ordinary full-game resets.
reward_curriculum_aim = 8.0
reward_curriculum_escape = 12.0
reward_curriculum_progress = 0.0
reverse_curriculum = 1
# Safety fallback only. Stage 3 already uses full ordinary games; graduation is
# driven by credited, non-suicidal kills instead of an abrupt time-based jump.
curriculum_steps = 1000000000
curriculum_window = 32
curriculum_success_rate = 0.45
pillar_mode = 1

[train]
total_timesteps = 40000000
learning_rate = 0.001
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 5.0
max_grad_norm = 1.0
ent_coef = 0.01
momentum = 0.9
# Keep minibatches modest on 3GB VRAM; the 1200-wide recurrent input still dominates.
minibatch_size = 4096
horizon = 64
prio_alpha = 0
prio_beta0 = 0.6
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0
gpus = 1

# Reward and episode-length sweep: ./puffer sweep bomberman
[sweep]
metric = slot_0_kills
metric_distribution = linear
goal = maximize
max_suggestion_cost = 7200
max_runs = 40
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
sweep_only = env.reward_soft, env.reward_kill, env.reward_death, env.reward_win, env.reward_alive, env.reward_timeout, env.max_ticks

# reward.soft
[sweep.env.reward_soft]
distribution = uniform
min = 0.0
max = 2.0
scale = auto

# reward.kill
[sweep.env.reward_kill]
distribution = log_normal
min = 25.0
max = 200.0
scale = auto

# reward.death
[sweep.env.reward_death]
distribution = uniform
min = -2.0
max = 0.0
scale = auto

# reward.win
[sweep.env.reward_win]
distribution = uniform
min = 0.0
max = 2.0
scale = auto

# reward.alive (applied every tick, so keep this range small)
[sweep.env.reward_alive]
distribution = uniform
min = -0.001
max = 0.001
scale = auto

# reward.timeout
[sweep.env.reward_timeout]
distribution = uniform
min = -2.0
max = 0.0
scale = auto

[sweep.env.max_ticks]
distribution = int_uniform
min = 600
max = 2400
scale = auto
